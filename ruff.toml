# Repo-wide lint baseline for CI (ruff>=0.1.14 in requirements.txt).
# Python 3.11 matches the runtime images (.docker/api/Dockerfile, python:3.11-slim).
target-version = "py311"
line-length = 120

[lint]
# Gate (2026-09): pyflakes (F) + syntax errors (E9) over the WHOLE repo —
# rules that flag actual defects. `scripts/security_scan.sh` and CI run
# `ruff check services scripts`; this file is the single source of truth for
# the selection. Style rules (E501/W29x/B904 ~280 findings) remain a
# documented ratchet: tighten by cleanup, never by ignoring findings.
select = ["F", "E9"]

[lint.per-file-ignores]
# Test files legitimately use pytest.raises without binding the exception.
"**/tests/**" = ["B011", "B017"]
# __init__.py re-exports form the package public API (from pkg import X) —
# unused-import is intentional there.
"**/__init__.py" = ["F401"]

[format]
quote-style = "double"
