<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1770" viewBox="0 0 1800 1770" role="img">
<title>CryptoScan proposed binary-oriented on-premises delivery</title>
<desc>Proposed packaging only, not an implemented or accepted binary release. Bank-controlled data and existing controlled local-source profile.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#60758e"/></marker></defs>
<rect x="0" y="0" width="1800" height="1770" rx="0" fill="#f3f6fa"/>
<text x="80" y="65" font-family="DejaVu Sans, sans-serif" font-size="43" font-weight="700" fill="#172b4d">CryptoScan | Bank-local runtime dataflow</text>
<text x="80" y="108" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#536780">Same authority and evidence contracts after native packaging · All numbered processing stays inside the bank</text>
<rect x="80" y="140" width="1180" height="1530" rx="22" fill="#e5f1ef"/>
<text x="110" y="183" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#17685f">CONTROLLED LOCAL-SOURCE PROFILE</text>
<rect x="1310" y="140" width="410" height="1530" rx="22" fill="#e7edf9"/>
<text x="1340" y="190" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#344d86">TRUST BOUNDARIES</text>
<rect x="110" y="215" width="1120" height="125" rx="16" fill="#ffffff" stroke="#c8dfd9" stroke-width="2"/>
<rect x="130" y="237" width="57" height="57" rx="14" fill="#197d93"/>
<text x="140" y="275" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#ffffff">01</text>
<text x="210" y="253" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#172b4d">Authorized source + register</text>
<text x="210" y="288" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#425570">Owner supplies an approved snapshot through bank-controlled intake.</text>
<text x="210" y="317" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#425570">Expected targets and missing/unattempted work stay independently recorded.</text>
<path d="M 665,340 L 665,366" fill="none" stroke="#60758e" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="110" y="371" width="1120" height="125" rx="16" fill="#ffffff" stroke="#c8dfd9" stroke-width="2"/>
<rect x="130" y="393" width="57" height="57" rx="14" fill="#197d93"/>
<text x="140" y="431" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#ffffff">02</text>
<text x="210" y="409" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#172b4d">Bank user → browser → same-origin API</text>
<text x="210" y="444" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#425570">Current human session; selected estate and permitted workflow.</text>
<text x="210" y="473" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#425570">Browser receives inspectable JS, not SQL/Redis credentials or privileged authority.</text>
<path d="M 665,496 L 665,522" fill="none" stroke="#60758e" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="110" y="527" width="1120" height="125" rx="16" fill="#ffffff" stroke="#c8dfd9" stroke-width="2"/>
<rect x="130" y="549" width="57" height="57" rx="14" fill="#197d93"/>
<text x="140" y="587" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#ffffff">03</text>
<text x="210" y="565" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#172b4d">API → durable SQL job / outbox</text>
<text x="210" y="600" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#425570">Recheck current identity, membership, exact estate and execution policy.</text>
<text x="210" y="629" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#425570">Record owning job and dispatch state; accepted does not mean completed.</text>
<path d="M 665,652 L 665,678" fill="none" stroke="#60758e" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="110" y="683" width="1120" height="125" rx="16" fill="#ffffff" stroke="#c8dfd9" stroke-width="2"/>
<rect x="130" y="705" width="57" height="57" rx="14" fill="#197d93"/>
<text x="140" y="743" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#ffffff">04</text>
<text x="210" y="721" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#172b4d">Redis → trusted worker reconciliation</text>
<text x="210" y="756" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#425570">Queue descriptor is an untrusted dispatch hint, not execution authority.</text>
<text x="210" y="785" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#425570">Worker rechecks current SQL state, approval, lease/fence and stop/revocation.</text>
<path d="M 665,808 L 665,834" fill="none" stroke="#60758e" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="110" y="839" width="1120" height="125" rx="16" fill="#ffffff" stroke="#c8dfd9" stroke-width="2"/>
<rect x="130" y="861" width="57" height="57" rx="14" fill="#197d93"/>
<text x="140" y="899" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#ffffff">05</text>
<text x="210" y="877" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#172b4d">Dispatcher → isolated parser</text>
<text x="210" y="912" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#425570">Exact preloaded image digest; fixed protocol; verified staging/source marker.</text>
<text x="210" y="941" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#425570">Read-only input; no network, DB credentials or daemon socket; bounded resources.</text>
<path d="M 665,964 L 665,990" fill="none" stroke="#60758e" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="110" y="995" width="1120" height="125" rx="16" fill="#ffffff" stroke="#c8dfd9" stroke-width="2"/>
<rect x="130" y="1017" width="57" height="57" rx="14" fill="#197d93"/>
<text x="140" y="1055" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#ffffff">06</text>
<text x="210" y="1033" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#172b4d">Parser → bounded result → trusted worker</text>
<text x="210" y="1068" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#425570">Fixed JSON output and separated diagnostics; validate shape, scope and receipts.</text>
<text x="210" y="1097" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#425570">A returned observation does not prove independent truth or whole-estate coverage.</text>
<path d="M 665,1120 L 665,1146" fill="none" stroke="#60758e" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="110" y="1151" width="1120" height="125" rx="16" fill="#ffffff" stroke="#c8dfd9" stroke-width="2"/>
<rect x="130" y="1173" width="57" height="57" rx="14" fill="#197d93"/>
<text x="140" y="1211" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#ffffff">07</text>
<text x="210" y="1189" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#172b4d">Worker → owning job / immutable evidence</text>
<text x="210" y="1224" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#425570">Only the eligible attempt/fence may persist through the approved workflow.</text>
<text x="210" y="1253" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#425570">Retain partial, refused, failed, unsupported and UNKNOWN outcomes honestly.</text>
<path d="M 665,1276 L 665,1302" fill="none" stroke="#60758e" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="110" y="1307" width="1120" height="125" rx="16" fill="#ffffff" stroke="#c8dfd9" stroke-width="2"/>
<rect x="130" y="1329" width="57" height="57" rx="14" fill="#197d93"/>
<text x="140" y="1367" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#ffffff">08</text>
<text x="210" y="1345" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#172b4d">Authorized current read models / six BOMs</text>
<text x="210" y="1380" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#425570">SBOM · CBOM · NBOM · TechBOM · HBOM · VBOM keep distinct evidence paths.</text>
<text x="210" y="1409" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#425570">Current source/package eligibility is re-evaluated; original history is not repaired.</text>
<path d="M 665,1432 L 665,1458" fill="none" stroke="#60758e" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="110" y="1463" width="1120" height="125" rx="16" fill="#ffffff" stroke="#c8dfd9" stroke-width="2"/>
<rect x="130" y="1485" width="57" height="57" rx="14" fill="#197d93"/>
<text x="140" y="1523" font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" fill="#ffffff">09</text>
<text x="210" y="1501" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#172b4d">Separate review → exact-condition verification</text>
<text x="210" y="1536" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#425570">Named authorized humans review assertions and remediation evidence.</text>
<text x="210" y="1565" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#425570">No auto-VERIFIED state, site qualification or customer approval from a binary/signature.</text>
<text x="1338" y="245" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#344d86">01 / INPUT</text>
<text x="1338" y="282" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#425570">Bank source is not vendor</text>
<text x="1338" y="311" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#425570">product source. Native</text>
<text x="1338" y="340" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#425570">packaging must not change</text>
<text x="1338" y="369" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#425570">source/evidence provenance.</text>
<text x="1338" y="465" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#344d86">02 / AUTHORITY</text>
<text x="1338" y="502" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#425570">No stale token-role fallback.</text>
<text x="1338" y="531" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#425570">Invalid identities refuse.</text>
<text x="1338" y="560" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#425570">Role-store outage stays 503.</text>
<text x="1338" y="589" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#425570">No in-memory production fallback.</text>
<text x="1338" y="710" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#344d86">03 / EXECUTION</text>
<text x="1338" y="747" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#425570">Only trusted dispatcher gets</text>
<text x="1338" y="776" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#425570">reviewed daemon access.</text>
<text x="1338" y="805" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#425570">Parser never gets the socket</text>
<text x="1338" y="834" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#425570">or dependency credentials.</text>
<text x="1338" y="955" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#344d86">04 / EVIDENCE</text>
<text x="1338" y="992" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#425570">Queue ACK ≠ completion.</text>
<text x="1338" y="1021" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#425570">Partial ≠ full coverage.</text>
<text x="1338" y="1050" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#425570">UNKNOWN ≠ stopped.</text>
<text x="1338" y="1079" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#425570">Origin ≠ independent truth.</text>
<text x="1338" y="1200" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#344d86">05 / SCOPE</text>
<text x="1338" y="1237" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#425570">Local-source scans do not</text>
<text x="1338" y="1266" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#425570">establish live network,</text>
<text x="1338" y="1295" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#425570">hardware, deployment or</text>
<text x="1338" y="1324" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#425570">runtime invocation evidence.</text>
<text x="1338" y="1445" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#344d86">06 / RESIDENCY</text>
<text x="1338" y="1482" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#425570">No automatic vendor egress.</text>
<text x="1338" y="1511" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#425570">Verify actual infrastructure</text>
<text x="1338" y="1540" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#425570">flows and redact support data.</text>
<text x="1338" y="1569" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#425570">Bank owns secrets and backups.</text>
<text x="80" y="1714" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="600" fill="#845216">DESIGN ONLY: native build, compiled-image security tests and actual bank acceptance remain to be performed.</text>
<text x="80" y="1748" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#536780">Release SBOM describes CryptoScan; customer SBOM describes assessed software. Never conflate artifact digest, document hash and truth.</text>
</svg>