<text x="110" y="1228" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#17685f">No automatic vendor data export. Parser daemon isolation is a separate host boundary, not just Kubernetes NetworkPolicy.</text>
