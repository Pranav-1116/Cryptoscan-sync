<text x="105" y="1316" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#845216">PROTECTION LIMIT: native code raises reverse-engineering effort; it does not prevent analysis by bank root/admin.</text>
<text x="105" y="1346" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#845216">Signed integrity ≠ runtime truth or go-live approval. Current local-source profile does not enable live collectors or qualified HA.</text>
