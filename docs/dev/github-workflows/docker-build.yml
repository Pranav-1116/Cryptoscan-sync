name: Docker Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: .docker/api/Dockerfile
            context: .
          - name: worker
            dockerfile: .docker/worker/Dockerfile
            context: .
          - name: scanner
            dockerfile: .docker/scanner/Dockerfile
            context: .
          - name: nginx
            dockerfile: .docker/nginx/Dockerfile
            context: .
          - name: dashboard
            dockerfile: .docker/dashboard/Dockerfile
            context: services/dashboard
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          tags: cryptoscan-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  compose-config:
    name: docker compose config validates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate dev + prod compose files
        env:
          # Placeholder secrets — compose only interpolates them.
          SECRET_KEY: ci-placeholder-secret-key-32-chars-ok!
          ADMIN_PASSWORD_HASH: ci-placeholder
          GITHUB_WEBHOOK_SECRET: ci-placeholder
          POSTGRES_PASSWORD: ci
          NEO4J_PASSWORD: ci
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
