# TLS overlay — terminates HTTPS at the nginx edge.
#
#   1. Put certificates in deploy/nginx/certs/ (never committed):
#        deploy/nginx/certs/fullchain.pem
#        deploy/nginx/certs/privkey.pem
#      (Let's Encrypt `fullchain.pem`/`privkey.pem` names work as-is.)
#   2. Bring the stack up with all three files:
#        docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#                       -f docker-compose.tls.yml up --build -d
#
# :80 answers with a 301 redirect only; all real traffic rides :443 with HSTS.

services:
  nginx:
    ports: !override
      - "80:80"
      - "${TLS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
      - ./.docker/nginx/tls.conf:/etc/nginx/nginx.conf:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
