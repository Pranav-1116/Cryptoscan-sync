# Reusable PostgreSQL migration gate. The migration fixture drops its target
# database: both URLs below point only at this job's disposable service.
name: db-migration

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_NO_CACHE_DIR: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  ENVIRONMENT: test
  SECRET_KEY: test-secret-key-for-sessions-min-32-chars
  GITHUB_WEBHOOK_SECRET: test-webhook-secret-abc123
  CRYPTOSCAN_HOME: /tmp/cryptoscan-home
  CRYPTOSCAN_PARITY_NO_DOCKER: "1"
  PYTHON: python
  # Parity's worker and API fixtures create and drop uniquely named databases
  # through this existing, disposable service database.
  CRYPTOSCAN_TEST_DATABASE_URL: postgresql+psycopg2://cryptoscan:ci-only-parity@127.0.0.1:5432/cs_ci_parity
  DATABASE_URL: postgresql+psycopg2://cryptoscan:ci-only-parity@127.0.0.1:5432/cs_ci_parity
  # The Alembic test explicitly DROP/CREATEs this database, not the base above.
  CRYPTOSCAN_TEST_PG_URL: postgresql+psycopg2://cryptoscan:ci-only-parity@127.0.0.1:5432/cs_ci_migration

jobs:
  migration-parity:
    name: PostgreSQL ${{ matrix.postgres }} / migration and parity
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # 15 is the shipped docker-compose.yml version; 16 guards compatibility.
        postgres: ["15", "16"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_USER: cryptoscan
          POSTGRES_PASSWORD: ci-only-parity
          POSTGRES_DB: cs_ci_parity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cryptoscan -d cs_ci_parity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements.lock.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -c requirements.lock.txt
      - name: Bootstrap service imports
        run: |
          echo "PYTHONPATH=$(find "$PWD/services" "$PWD/shared" -mindepth 1 -maxdepth 1 -type d | tr '\n' ':')" >> "$GITHUB_ENV"
      - name: Assert disposable local PostgreSQL and expected major version
        env:
          EXPECTED_MAJOR: ${{ matrix.postgres }}
        run: |
          python - <<'PY'
          import os
          import sqlalchemy as sa
          from sqlalchemy.engine import make_url

          base = make_url(os.environ["CRYPTOSCAN_TEST_DATABASE_URL"])
          migration = make_url(os.environ["CRYPTOSCAN_TEST_PG_URL"])
          app = make_url(os.environ["DATABASE_URL"])
          assert base.get_backend_name() == "postgresql"
          assert (base.host, base.port, base.username, base.database) == (
              "127.0.0.1", 5432, "cryptoscan", "cs_ci_parity"
          )
          assert app == base
          assert migration == base.set(database="cs_ci_migration")
          with sa.create_engine(base).connect() as connection:
              version = int(connection.scalar(sa.text("SHOW server_version_num")))
          assert version // 10000 == int(os.environ["EXPECTED_MAJOR"]), version
          PY
      - name: Fresh Alembic chain, PostgreSQL worker suite and API estate parity
        run: bash scripts/postgres_parity.sh
      - name: Focused live migration proof (JUnit, no skipped tests)
        working-directory: services/database
        run: |
          python -m pytest -q -m live tests/unit/test_migration_chain_postgres.py \
            --junitxml="$RUNNER_TEMP/db-migration-pg${{ matrix.postgres }}.xml"
          python ../../scripts/check_junit.py "$RUNNER_TEMP/db-migration-pg${{ matrix.postgres }}.xml"
      - name: Keep migration proof report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: db-migration-pg${{ matrix.postgres }}-junit
          path: ${{ runner.temp }}/db-migration-pg${{ matrix.postgres }}.xml
          if-no-files-found: error
          retention-days: 7
