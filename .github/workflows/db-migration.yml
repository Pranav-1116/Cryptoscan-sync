name: Database schema

on:
  pull_request:
    paths:
      - "services/database/**"

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install sqlalchemy
      - run: PYTHONPATH=services/database python -c "from db.connection.session import init_db; import os; os.environ['DATABASE_URL']='sqlite:///:memory:'; init_db(); print('ok')"
