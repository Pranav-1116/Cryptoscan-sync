# Required PR/main and requested integration-branch entrypoint. Reusable lanes
# run inside this workflow; the final check catches missing or failed lanes.
name: ci

on:
  push:
    branches: [main, 'arena/bb4b80dd-cryproscan']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_NO_CACHE_DIR: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install -c requirements.lock.txt ruff
      - run: ruff check services scripts shared

  discover:
    name: discover backend suites
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.suites.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: suites
        name: Discover all non-scanner service and shared suites
        run: |
          matrix="$(python scripts/ci_suites.py --non-scanners)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  backend:
    name: tests / ${{ matrix.suite }}
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    env:
      ENVIRONMENT: test
      GITHUB_WEBHOOK_SECRET: test-webhook-secret-abc123
      SECRET_KEY: test-secret-key-for-sessions-min-32-chars
      CRYPTOSCAN_CVE_LIVE: "0"
      CRYPTOSCAN_TLS_LIVE: "0"
      CRYPTOSCAN_CLOUD_LIVE: "0"
      CRYPTOSCAN_CLOUD_SUBMIT: "0"
      CRYPTOSCAN_CBOM_SIGN: "0"
      CRYPTOSCAN_HOME: /tmp/cryptoscan-home
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements.lock.txt
      - run: python -m pip install -r requirements.txt -c requirements.lock.txt
      - name: Build PYTHONPATH from every service and shared package
        run: echo "PYTHONPATH=$(find services shared -mindepth 1 -maxdepth 1 -type d | tr '\n' ':')" >> "$GITHUB_ENV"
      - name: Run ${{ matrix.suite }} with JUnit
        run: |
          mkdir -p test-results
          python -m pytest -q -p no:xdist -m 'not live' \
            --disable-socket --allow-hosts=127.0.0.1,::1,localhost --allow-unix-socket \
            --junitxml=test-results/backend.xml "${{ matrix.suite }}"
          python scripts/check_junit.py --allow-skips test-results/backend.xml
      - name: Retain backend test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-${{ strategy.job-index }}
          path: test-results/backend.xml
          if-no-files-found: error
          retention-days: 14

  scanner-offline:
    name: scanner-offline
    uses: ./.github/workflows/scanner-tests.yml
    permissions:
      contents: read

  db-migration:
    name: database-migrations
    uses: ./.github/workflows/db-migration.yml
    permissions:
      contents: read

  images-build-only:
    name: images-build-only
    uses: ./.github/workflows/docker-build.yml
    permissions:
      contents: read

  frontend:
    name: frontend (typecheck + Vitest + build + toolchain)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.22.3"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify supported Node and npm versions
        working-directory: frontend
        run: node -e 'const [major,minor,patch]=process.versions.node.split(".").map(Number);if(major!==22||minor<22||(minor===22&&patch<3))process.exit(1)' && npm --version
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Typecheck
        run: npm run typecheck
        working-directory: frontend
      - name: Vitest
        run: npm test
        working-directory: frontend
      - name: Coverage instrumentation smoke
        run: npm run test:coverage -- src/lib/api.test.ts
        working-directory: frontend
      - name: Production build
        run: npm run build
        working-directory: frontend
      - name: Frozen toolchain test
        run: npm run test:toolchain
        working-directory: frontend

  prod-config-guard:
    name: production config guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # These are synthetic validation inputs, not production credentials.
    env:
      ENVIRONMENT: production
      CRYPTOSCAN_DEPLOYMENT_PROFILE: kubernetes-external-services/local-source-v1
      NEO4J_URI: ""
      SECRET_KEY: ci-only-production-guard-secret-key-0123456789abcdef
      ADMIN_PASSWORD_HASH: ci-only-placeholder-hash
      GITHUB_WEBHOOK_SECRET: ci-only-webhook-secret-0123456789abcdef
      METRICS_TOKEN: ci-only-metrics-token-0123456789abcdef
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      REDIS_URL: rediss://ci_acl_user:ci-only-redis-acl-password@localhost:6379/0
      CORS_ORIGINS: https://cryptoscan.example.invalid
      TRUSTED_HOSTS: '["cryptoscan.example.invalid"]'
      REGISTRY_WEBHOOK_SECRET: ci-only-registry-webhook-secret-0123456789abcdef
      CBOM_SIGNING_SECRET: ci-only-cbom-signing-secret-0123456789abcdef
      STREAM_SECRET: ci-only-stream-hmac-secret-0123456789abcdef
      AUDITOR_API_KEY: ci-only-auditor-api-key-0123456789abcdef
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Production Compose exposes only nginx
        run: python scripts/check_prod_compose.py
      - run: python -m pip install -r requirements.txt -c requirements.lock.txt
      - name: Build PYTHONPATH
        run: echo "PYTHONPATH=$(find services shared -mindepth 1 -maxdepth 1 -type d | tr '\n' ':')" >> "$GITHUB_ENV"
      - name: Reject a known weak secret in otherwise valid configuration
        run: python scripts/check_prod_guard.py --expect-reject
        env:
          SECRET_KEY: cryptoscan-dev-secret
      - name: Accept structurally valid production configuration
        run: python scripts/check_prod_guard.py

  ci-required:
    name: ci-required
    if: always()
    needs: [lint, discover, backend, scanner-offline, db-migration, images-build-only, frontend, prod-config-guard]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail on any incomplete required lane
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          incomplete = {name: job["result"] for name, job in needs.items()
                        if job["result"] != "success"}
          if not needs or incomplete:
              print("Required CI lanes incomplete:", incomplete or "none reported")
              sys.exit(1)
          print("All required CI lanes completed successfully")
          PY
