# Required build-only lane. PR code never receives registry credentials or pushes images.
name: docker-build

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - name: api
            dockerfile: .docker/api/Dockerfile
            context: .
          - name: dashboard
            dockerfile: .docker/dashboard/Dockerfile
            context: .
          - name: frontend
            dockerfile: .docker/frontend/Dockerfile
            context: .
          - name: nginx
            dockerfile: .docker/nginx/Dockerfile
            context: .docker/nginx
          - name: scanner
            dockerfile: .docker/scanner/Dockerfile
            context: .
          - name: worker
            dockerfile: .docker/worker/Dockerfile
            context: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build ${{ matrix.name }} without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: false
          tags: cryptoscan-${{ matrix.name }}:ci-${{ github.sha }}
