# Manual, read-only release handoff. This does not build, publish or deploy images.
# Operator-reviewed registry digests and a protected environment are prerequisites.
name: release-preflight

on:
  workflow_dispatch:
    inputs:
      registry:
        description: OCI repository prefix for the reviewed images (no tag or digest)
        type: string
        required: true
      api_digest:
        description: Reviewed registry SHA-256 digest, 64 hex characters
        type: string
        required: true
      worker_digest:
        description: Reviewed registry SHA-256 digest, 64 hex characters
        type: string
        required: true
      neo4j_digest:
        description: Reviewed registry SHA-256 digest, 64 hex characters
        type: string
        required: true

permissions:
  contents: read

jobs:
  render:
    name: render unsigned digest manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-review
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require configured release review and a tag-selected dispatch
        env:
          REVIEW_READY: ${{ vars.CRYPTOSCAN_RELEASE_REVIEW_READY }}
        run: |
          if [ "$REVIEW_READY" != "true" ]; then
            printf 'release-review environment is not configured or approved\n' >&2
            exit 1
          fi
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) printf 'select a reviewed v* release tag when dispatching\n' >&2; exit 1 ;;
          esac
      - name: Render digest-pinned Kubernetes templates
        env:
          REGISTRY: ${{ inputs.registry }}
          API_DIGEST: ${{ inputs.api_digest }}
          WORKER_DIGEST: ${{ inputs.worker_digest }}
          NEO4J_DIGEST: ${{ inputs.neo4j_digest }}
        run: |
          python scripts/pin_release_images.py \
            --registry "$REGISTRY" \
            --api-digest "$API_DIGEST" \
            --worker-digest "$WORKER_DIGEST" \
            --neo4j-digest "$NEO4J_DIGEST" \
            --out "$RUNNER_TEMP/unsigned-release-manifests"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'unsigned-release-manifests'
          lock = json.loads((root / 'release-image-lock.json').read_text())
          assert set(lock['digests']) == {'api', 'worker', 'neo4j'}
          (root / 'qualification-status.json').write_text(json.dumps({
              'source_commit': os.environ['GITHUB_SHA'],
              'schema': 'cryptoscan.release-preflight/1',
              'signed': False,
              'site_qualified': False,
              'production_approved': False,
              'next_step': 'independently sign and verify an operator site package, then run the strict readiness gate',
          }, indent=2) + '\n')
          PY
      - name: Retain unsigned handoff only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-release-preflight-${{ github.sha }}
          path: ${{ runner.temp }}/unsigned-release-manifests
          if-no-files-found: error
          retention-days: 7
