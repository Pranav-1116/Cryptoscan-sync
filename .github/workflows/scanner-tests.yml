name: Scanner tests

on:
  pull_request:
    paths:
      - "services/scanner/**"

jobs:
  scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e shared/shared_models -e services/scanner pytest structlog
      - run: python -m pytest -q services/scanner/tests
