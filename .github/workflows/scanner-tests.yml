# Unprivileged, offline scanner fixtures. Called unconditionally by ci.yml;
# dispatch is for explicit reruns, not a path-filtered substitute for the gate.
name: scanner-tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  discover:
    name: discover scanner suites
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.suites.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Discover scanner suites (fail if empty)
        id: suites
        shell: bash
        run: |
          set -euo pipefail
          matrix="$(python3 -I scripts/ci_suites.py --scanners-only)"
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  scanner:
    name: scanner offline / ${{ matrix.suite }}
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements.lock.txt
      - name: Install locked dependencies
        run: python -m pip install -c requirements.lock.txt -r requirements.txt
      - name: Build PYTHONPATH (all services + shared)
        shell: bash
        run: |
          printf 'PYTHONPATH=%s\n' "$(find services shared -mindepth 1 -maxdepth 1 -type d | tr '\n' ':')" >> "$GITHUB_ENV"
      - name: Offline scanner tests
        # pytest.ini excludes live-marked tests; pytest-socket refuses external
        # hosts while allowing loopback fixture servers and Unix sockets.
        run: |
          mkdir -p junit
          python -m pytest '${{ matrix.suite }}' -q -p no:xdist -m 'not live' \
            --disable-socket --allow-hosts=127.0.0.1,::1,localhost \
            --allow-unix-socket --junitxml=junit/results.xml
        env:
          ENVIRONMENT: test
          SECRET_KEY: test-secret-key-for-sessions-min-32-chars
          GITHUB_WEBHOOK_SECRET: test-webhook-secret-abc123
          CRYPTOSCAN_CVE_LIVE: "0"
          CRYPTOSCAN_TLS_LIVE: "0"
          CRYPTOSCAN_CLOUD_LIVE: "0"
          CRYPTOSCAN_CLOUD_SUBMIT: "0"
          CRYPTOSCAN_CBOM_SIGN: "0"
          CRYPTOSCAN_HOME: ${{ runner.temp }}/cryptoscan-home
      - name: Require executed tests and valid JUnit
        # Offline suites can legitimately skip unavailable local tools, but
        # cannot pass when every case was skipped or any case failed.
        run: python scripts/check_junit.py --allow-skips junit/results.xml
      - name: Retain scanner JUnit (also on failure)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scanner-junit-${{ strategy.job-index }}
          path: junit/results.xml
          if-no-files-found: error
          retention-days: 14
