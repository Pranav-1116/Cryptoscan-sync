# Secret scanning (deep/22 P0#6) — staged under the workflows-pending
# convention: pushing under .github/workflows/ needs a workflow-scoped
# token (see README.md in this directory).
name: secret-scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # history scan nightly — gitleaks diffs only recent commits on push/PR
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # full history for the scheduled scan; shallow for push/PR speed
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fail on any finding. Baseline/exclusions live in .gitleaks.toml
          # (if ever needed) — never inline skip lists here.
          GITLEAKS_ENABLE_COMMENTS: false
