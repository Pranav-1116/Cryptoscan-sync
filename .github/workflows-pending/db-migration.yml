name: Database schema

on:
  pull_request:
    paths:
      - "services/database/**"

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install sqlalchemy
      # A file-backed SQLite URL, not sqlite:///:memory:. The in-memory URL
      # selects StaticPool, which rejects the pool_size / max_overflow /
      # pool_timeout arguments the engine passes, so the original line died
      # with "Invalid argument(s) ... sent to create_engine()" before it ever
      # reached the schema. Verified both ways against this repository.
      - run: |
          PYTHONPATH=services/database:shared/shared_models \
          ALLOW_SQLITE=true DATABASE_URL="sqlite:///$RUNNER_TEMP/schema-check.db" \
          python -c "from db.connection.session import init_db; init_db(); print('ok')"
