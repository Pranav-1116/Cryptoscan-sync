apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: payment-api
spec:
  tls:
    - hosts:
        - api.payment.example.com
      secretName: payment-tls
  rules:
    - host: api.payment.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: payment-api
                port:
                  number: 443
---
apiVersion: v1
kind: Secret
metadata:
  name: payment-tls
type: kubernetes.io/tls
data:
  tls.crt: ""
  tls.key: ""
---
apiVersion: v1
kind: Service
metadata:
  name: payment-api
spec:
  ports:
    - name: https
      port: 443
