# Production overlay. Dedicated host — do not merge this with another stack on :80.
# Requires Docker Compose v2.24+ (!override / !reset).
#
#   cp .env.production.example .env
#   python3 scripts/hash_admin_password.py
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
#
# The API refuses to boot if demo secrets, SQLite, or CORS_ORIGINS=* remain.

services:
  postgres:
    restart: unless-stopped
    ports: !reset []
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cryptoscan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-cryptoscan}
    logging: &json-log
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    mem_limit: 1g

  redis:
    restart: unless-stopped
    ports: !reset []
    logging: *json-log
    mem_limit: 256m

  neo4j:
    restart: unless-stopped
    ports: !reset []
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?set NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
      NEO4J_server_usage__report_enabled: "false"
    logging: *json-log
    mem_limit: 1536m

  neo4j-init:
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?set NEO4J_PASSWORD}

  migrate:
    build:
      context: .
      dockerfile: .docker/api/Dockerfile
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-cryptoscan}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cryptoscan}
    command:
      - alembic
      - -c
      - services/database/migrations/alembic.ini
      - upgrade
      - head
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks: [cryptoscan-net]

  api:
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      DOCS_ENABLED: ${DOCS_ENABLED:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS to an explicit origin list}
      METRICS_TOKEN: ${METRICS_TOKEN:?set METRICS_TOKEN for Prometheus /metrics scraping}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:?set TRUSTED_HOSTS as a JSON host list}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?set ADMIN_PASSWORD_HASH}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?set GITHUB_WEBHOOK_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ALLOW_SQLITE: "false"
      ALLOW_INSECURE_CORS: "false"
      # Event stream (r29): CBOM signing secret is REQUIRED in production.
      CBOM_SIGNING_SECRET: ${CBOM_SIGNING_SECRET:?set CBOM_SIGNING_SECRET}
      # Signed registry webhooks: REQUIRED in production — unsigned events
      # are rejected 401; a wrong signature is always 401 (fail-closed).
      REGISTRY_WEBHOOK_SECRET: ${REGISTRY_WEBHOOK_SECRET:?set REGISTRY_WEBHOOK_SECRET}
      # Stream HMAC secret (event bus / replication / PITR verification).
      STREAM_SECRET: ${STREAM_SECRET:?set STREAM_SECRET}
      # Auditor API: production auditor access to /compliance/audit/* is
      # fail-closed 401 WITHOUT this key.
      AUDITOR_API_KEY: ${AUDITOR_API_KEY:?set AUDITOR_API_KEY}
      # Platform self-observability: W3C trace-context + Prometheus on every
      # request; set OTEL_EXPORTER_OTLP_ENDPOINT for OTLP/JSON export too.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-cryptoscan}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cryptoscan}
      REDIS_URL: redis://redis:6379/0
      WORKSPACE_BASE_PATH: /tmp/cryptoscan-workspaces
      CRYPTOSCAN_SOURCE_ROOTS: /app:/tmp/cryptoscan-workspaces
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD}
      CRYPTOSCAN_SNAPSHOT_DIR: /var/lib/cryptoscan/telecom
      CRYPTOSCAN_TELECOM_REGISTRY: /var/lib/cryptoscan/telecom/telecom_registry.json
    volumes:
      - telecom_data:/var/lib/cryptoscan/telecom
      - ${TELECOM_REGISTRY_HOST_PATH:-./config/telecom_registry.json}:/var/lib/cryptoscan/telecom/telecom_registry.json:ro
    command:
      - uvicorn
      - api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8010"
      - --proxy-headers
      - --forwarded-allow-ips
      - "*"
      - --workers
      - "2"
      # The structured http_request logger (LoggingMiddleware) records
      # method/path/status/duration/request_id/trace_id/span_id for every
      # request — uvicorn's access log is a redundant second line per request
      # and measurably adds ~12% to sequential latency.
      - --no-access-log
    logging: *json-log
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp/cryptoscan-workspaces:rw,size=1024m,mode=1777

  worker:
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      ALLOW_SQLITE: "false"
      DATABASE_URL: postgresql://${POSTGRES_USER:-cryptoscan}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cryptoscan}
      REDIS_URL: redis://redis:6379/0
      STREAM_SECRET: ${STREAM_SECRET:?set STREAM_SECRET}
      WORKSPACE_BASE_PATH: /tmp/cryptoscan-workspaces
      CRYPTOSCAN_SOURCE_ROOTS: /app:/tmp/cryptoscan-workspaces
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD}
      CRYPTOSCAN_SNAPSHOT_DIR: /var/lib/cryptoscan/telecom
    logging: *json-log
    mem_limit: 2g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp/cryptoscan-workspaces:rw,size=1024m,mode=1777

  monitor:
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      STREAM_SECRET: ${STREAM_SECRET:?set STREAM_SECRET}
      CRYPTOSCAN_SNAPSHOT_DIR: /var/lib/cryptoscan/telecom
      CRYPTOSCAN_TELECOM_REGISTRY: /var/lib/cryptoscan/telecom/telecom_registry.json
    volumes:
      - telecom_data:/var/lib/cryptoscan/telecom
      - ${TELECOM_REGISTRY_HOST_PATH:-./config/telecom_registry.json}:/var/lib/cryptoscan/telecom/telecom_registry.json:ro
    logging: *json-log
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  frontend:
    logging: *json-log
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  nginx:
    ports: !override
      - "${NGINX_PORT:-80}:80"
    logging: *json-log
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
