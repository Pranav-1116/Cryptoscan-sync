# Production overlay. Dedicated host — do not merge this with another stack on :80.
# Requires Docker Compose v2.24+ (!override / !reset).
#
#   cp .env.production.example .env
#   python3 scripts/hash_admin_password.py
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
#
# The API refuses to boot if demo secrets, SQLite, or CORS_ORIGINS=* remain.

services:
  postgres:
    restart: unless-stopped
    ports: !reset []
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cryptoscan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-cryptoscan}
    logging: &json-log
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    mem_limit: 1g

  redis:
    restart: unless-stopped
    ports: !reset []
    logging: *json-log
    mem_limit: 256m

  neo4j:
    restart: unless-stopped
    ports: !reset []
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?set NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
      NEO4J_server_usage__report_enabled: "false"
    logging: *json-log
    mem_limit: 1536m

  neo4j-init:
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?set NEO4J_PASSWORD}

  api:
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      DOCS_ENABLED: ${DOCS_ENABLED:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS to an explicit origin list}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?set ADMIN_PASSWORD_HASH}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?set GITHUB_WEBHOOK_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ALLOW_SQLITE: "false"
      ALLOW_INSECURE_CORS: "false"
      # Event stream (r29): CBOM signing secret is REQUIRED in production.
      CBOM_SIGNING_SECRET: ${CBOM_SIGNING_SECRET:?set CBOM_SIGNING_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER:-cryptoscan}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cryptoscan}
      REDIS_URL: redis://redis:6379/0
      WORKSPACE_BASE_PATH: /tmp/cryptoscan-workspaces
      CRYPTOSCAN_SOURCE_ROOTS: /app:/tmp/cryptoscan-workspaces
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD}
      CRYPTOSCAN_SNAPSHOT_DIR: /var/lib/cryptoscan/telecom
      CRYPTOSCAN_TELECOM_REGISTRY: /var/lib/cryptoscan/telecom/telecom_registry.json
    volumes:
      - telecom_data:/var/lib/cryptoscan/telecom
      - ${TELECOM_REGISTRY_HOST_PATH:-./config/telecom_registry.json}:/var/lib/cryptoscan/telecom/telecom_registry.json:ro
    command:
      - uvicorn
      - api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8010"
      - --proxy-headers
      - --forwarded-allow-ips
      - "*"
      - --workers
      - "2"
    logging: *json-log
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp/cryptoscan-workspaces:rw,size=1024m,mode=1777

  worker:
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      ALLOW_SQLITE: "false"
      DATABASE_URL: postgresql://${POSTGRES_USER:-cryptoscan}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cryptoscan}
      REDIS_URL: redis://redis:6379/0
      WORKSPACE_BASE_PATH: /tmp/cryptoscan-workspaces
      CRYPTOSCAN_SOURCE_ROOTS: /app:/tmp/cryptoscan-workspaces
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD}
    logging: *json-log
    mem_limit: 2g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp/cryptoscan-workspaces:rw,size=1024m,mode=1777

  monitor:
    environment:
      CRYPTOSCAN_SNAPSHOT_DIR: /var/lib/cryptoscan/telecom
      CRYPTOSCAN_TELECOM_REGISTRY: /var/lib/cryptoscan/telecom/telecom_registry.json
    volumes:
      - telecom_data:/var/lib/cryptoscan/telecom
      - ${TELECOM_REGISTRY_HOST_PATH:-./config/telecom_registry.json}:/var/lib/cryptoscan/telecom/telecom_registry.json:ro
    logging: *json-log
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  frontend:
    logging: *json-log
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  nginx:
    ports: !override
      - "${NGINX_PORT:-80}:80"
    logging: *json-log
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
