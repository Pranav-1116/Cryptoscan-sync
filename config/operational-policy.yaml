# Operational policy baseline for bank deployments.
#
# This is deliberately `draft`: the numbers are proposed internal objectives,
# not contractual promises or regulator-approved commitments. A production
# release must supply an approved, customer/jurisdiction-specific policy and
# run `scripts/operational_policy_gate.py --strict`.

schema: cryptoscan.operational-policy/1
status: draft
owner: security-operations
reviewed_by: null
approved_at: null
scope: vendor-operated CryptoScan product and its production support boundary

patch_remediation:
  critical:
    remediate_within_days: 7
    compensating_control_within_hours: 24
  high:
    remediate_within_days: 30
    compensating_control_within_hours: 72
  medium:
    remediate_within_days: 90
    compensating_control_within_hours: 168
  low:
    remediate_within_days: 180
    compensating_control_within_hours: 720

incident_response:
  internal_acknowledgement_minutes: 15
  incident_commander_assignment_minutes: 30
  customer_initial_notification_hours: 24
  customer_update_hours: 24
  regulator_notification: within applicable legal and contractual deadline
  evidence_preservation_required: true
  post_incident_review_within_days: 10
  notification_channels:
    - security-contact
    - customer-status-channel
    - contractual-escalation

support_escalation:
  sev1:
    availability: 24x7
    acknowledgement_minutes: 15
    update_minutes: 60
  sev2:
    availability: business-hours
    acknowledgement_minutes: 60
    update_minutes: 240
  sev3:
    availability: business-hours
    acknowledgement_minutes: 480
    update_minutes: 1440
  sev4:
    availability: business-hours
    acknowledgement_minutes: 1440
    update_minutes: 2880

backup_governance:
  retention_days: 35
  destruction_after_expiry_days: 30
  offsite_copy_required: true
  encryption_required: true
  restore_test_interval_days: 90
  destruction_authorization: two-person-review
  destruction_evidence_required: true

access_review:
  privileged_review_interval_days: 90
  service_account_review_interval_days: 90
  break_glass_review_after_use_hours: 24
  termination_deprovision_target_hours: 4
