---
rule_id: "NORM-RSA-GENERIC"
version: "1.0"
description: "RSA with unspecified key size"
raw_patterns:
  - "RSA"
  - "RSA/ECB/PKCS1Padding"
  - "RSA/ECB/OAEPWithSHA-256AndMGF1Padding"
  - "RSA/ECB/OAEPWithSHA-1AndMGF1Padding"
  - "RSA/NONE/PKCS1Padding"
normalized_output:
  algorithm: "RSA"
  algorithm_family: "asymmetric"
  standard_name: "RSA"
  mode: null
  padding: "PKCS1Padding"
  key_size: null
  iv_size: null
  tag_size: null
  purpose: null
  nist_designation: "APPROVED"
  nist_reference: "FIPS 186-5"
  fips_status: "FIPS-186-5"
