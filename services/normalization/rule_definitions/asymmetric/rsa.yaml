---
rule_id: "NORM-RSA-4096"
version: "1.0"
description: "RSA-4096 — currently approved, quantum vulnerable"
raw_patterns:
  - "RSA-4096"
  - "RSA4096"
normalized_output:
  algorithm: "RSA"
  algorithm_family: "asymmetric"
  standard_name: "RSA-4096"
  mode: null
  padding: null
  key_size: 4096
  iv_size: null
  tag_size: null
  purpose: null
  nist_designation: "APPROVED"
  nist_reference: "FIPS 186-5, NIST SP 800-131A Rev 2"
  fips_status: "FIPS-186-5"
  quantum_vulnerable: true
  pqc_replacement: "ML-KEM-1024"
  iana_id: "rsa"
  cbom_component_type: "cryptographic-asset"
  cbom_algorithm_ref: "urn:ietf:crypto:rsa:4096"

