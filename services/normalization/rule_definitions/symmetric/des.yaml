# ============================================================
# DES / 3DES Normalization Rules
# CryptoScan Platform — Normalization Rule Definitions
# Version: 1.0
# Status: DISALLOWED — cryptographically broken
# Standard Reference: NIST SP 800-131A Rev 2 (2019)
# ============================================================

---
rule_id: "NORM-DES"
version: "1.0"
description: "DES — cryptographically broken, 56-bit key"
raw_patterns:
  - "DES"
  - "DES/ECB/PKCS5Padding"
  - "DES/ECB/NoPadding"
  - "DES/CBC/PKCS5Padding"
  - "DES/CBC/NoPadding"
  - "DES-ECB"
  - "DES-CBC"
normalized_output:
  algorithm: "DES"
  algorithm_family: "symmetric"
  standard_name: "DES"
  mode: "ECB"
  padding: "PKCS5Padding"
  key_size: 56
  iv_size: null
  tag_size: null
  purpose: "encryption"
  nist_designation: "DISALLOWED"
  nist_reference: "NIST SP 800-131A Rev 2 — Disallowed after 2023"
  fips_status: "NON-FIPS"
  quantum_vulnerable: true
  pqc_replacement: "AES-256-GCM"
  iana_id: null
  cbom_component_type: "cryptographic-asset"
  cbom_algorithm_ref: "urn:ietf:crypto:des"

---
rule_id: "NORM-3DES"
version: "1.0"
description: "Triple-DES (3DES/DESede) — deprecated, vulnerable to Sweet32"
raw_patterns:
  - "DESede"
  - "DESede/CBC/PKCS5Padding"
  - "DESede/ECB/PKCS5Padding"
  - "TripleDES"
  - "3DES"
  - "3DES-CBC"
  - "3DES-ECB"
  - "DESedeWrap"
  - "TDEA"
normalized_output:
  algorithm: "3DES"
  algorithm_family: "symmetric"
  standard_name: "3DES-CBC"
  mode: "CBC"
  padding: "PKCS5Padding"
  key_size: 112
  iv_size: 64
  tag_size: null
  purpose: "encryption"
  nist_designation: "DISALLOWED"
  nist_reference: "NIST SP 800-131A Rev 2 — Disallowed after 2023"
  fips_status: "NON-FIPS"
  quantum_vulnerable: true
  pqc_replacement: "AES-256-GCM"
  iana_id: null
  cbom_component_type: "cryptographic-asset"
  cbom_algorithm_ref: "urn:ietf:crypto:3des"