# ============================================================
# AES Normalization Rules
# CryptoScan Platform — Normalization Rule Definitions
# Version: 1.0
# Standard Reference: FIPS 197, NIST SP 800-38A/B/C/D/F
# ============================================================

---
rule_id: "NORM-AES-GCM-256"
version: "1.0"
description: "AES-256 in GCM mode (AEAD)"
raw_patterns:
  - "AES/GCM/NoPadding"
  - "AES_256/GCM/NoPadding"
  - "AES-256-GCM"
  - "AES256GCM"
normalized_output:
  algorithm: "AES"
  algorithm_family: "symmetric"
  standard_name: "AES-256-GCM"
  mode: "GCM"
  padding: "NoPadding"
  key_size: 256
  iv_size: 96
  tag_size: 128
  purpose: "encryption"
  nist_designation: "APPROVED"
  nist_reference: "FIPS 197, NIST SP 800-38D"
  fips_status: "FIPS-197"
  quantum_vulnerable: false
  iana_id: "aes256-gcm"
  cbom_component_type: "cryptographic-asset"
  cbom_algorithm_ref: "urn:ietf:crypto:aes:gcm:256"

