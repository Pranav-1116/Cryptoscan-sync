# ============================================================
# SHA-2 Family Normalization Rules
# CryptoScan Platform — Normalization Rule Definitions
# Version: 1.0
# Standard Reference: FIPS 180-4
# ============================================================

---
rule_id: "NORM-SHA256"
version: "1.0"
description: "SHA-256 — approved hash function"
raw_patterns:
  - "SHA-256"
  - "SHA256"
  - "SHA2-256"
  - "SHA_256"
  - "2.16.840.1.101.3.4.2.1"
normalized_output:
  algorithm: "SHA2"
  algorithm_family: "hash"
  standard_name: "SHA-256"
  mode: null
  padding: null
  key_size: null
  iv_size: null
  tag_size: null
  output_bits: 256
  purpose: "hashing"
  nist_designation: "APPROVED"
  nist_reference: "FIPS 180-4"
  fips_status: "FIPS-180-4"
  quantum_vulnerable: false
  iana_id: "sha-256"
  cbom_component_type: "cryptographic-asset"
  cbom_algorithm_ref: "urn:ietf:crypto:sha2:256"

---
rule_id: "NORM-SHA224"
version: "1.0"
description: "SHA-224 — approved hash function (round 25: rule omission; the three SHA-2 siblings existed but 224 fell through to the pattern path, which extracted the digest size as a bogus key_size=224)"
raw_patterns:
  - "SHA-224"
  - "SHA224"
  - "SHA2-224"
  - "SHA_224"
  - "2.16.840.1.101.3.4.2.4"
normalized_output:
  algorithm: "SHA2"
  algorithm_family: "hash"
  standard_name: "SHA-224"
  mode: null
  padding: null
  key_size: null
  iv_size: null
  tag_size: null
  output_bits: 224
  purpose: "hashing"
  nist_designation: "APPROVED"
  nist_reference: "FIPS 180-4"
  fips_status: "FIPS-180-4"
  quantum_vulnerable: false
  iana_id: "sha-224"
  cbom_component_type: "cryptographic-asset"
  cbom_algorithm_ref: "urn:ietf:crypto:sha2:224"

