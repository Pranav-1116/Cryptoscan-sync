<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CryptoScan — Estate CBOM</title>
  <style>
    :root {
      --bg: #0b1020;
      --bg-elev: #121a2f;
      --bg-card: #161f38;
      --line: #243154;
      --text: #e8eefc;
      --muted: #8b97b8;
      --accent: #3ee0c5;
      --accent-2: #7aa2ff;
      --fail: #ff5d73;
      --warn: #f5c14a;
      --pass: #3ee0c5;
      --crit: #ff5d73;
      --high: #ff8a4a;
      --info: #7aa2ff;
      --shadow: 0 18px 50px rgba(0,0,0,.35);
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font-family: "IBM Plex Sans", system-ui, sans-serif; }
    a { color: var(--accent-2); text-decoration: none; }
    button, input, select { font-family: inherit; }
    .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
    .app { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
    .sidebar { background: #0d1428; border-right: 1px solid var(--line); padding: 22px 16px; }
    .brand { display: flex; gap: 10px; align-items: center; margin-bottom: 28px; }
    .logo { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg,#3ee0c5,#7aa2ff); }
    .brand h1 { font-size: 16px; margin: 0; letter-spacing: .04em; }
    .brand small { color: var(--muted); display: block; font-size: 11px; }
    .nav button { width: 100%; text-align: left; background: transparent; border: 0; color: var(--muted);
      padding: 10px 12px; border-radius: 10px; cursor: pointer; margin-bottom: 4px; font-size: 14px; }
    .nav button.active, .nav button:hover { background: #1a2544; color: var(--text); }
    .main { padding: 28px 32px 60px; }
    .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; }
    .top h2 { margin: 0; font-size: 26px; }
    .muted { color: var(--muted); }
    .grid { display: grid; gap: 14px; }
    .cards { grid-template-columns: repeat(4, 1fr); }
    .card { background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 16px 18px; box-shadow: var(--shadow); }
    .card .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
    .card .value { font-size: 28px; font-weight: 700; margin-top: 6px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); font-size: 13px; }
    th { color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
    tr:hover td { background: #1a2442; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
    .FAIL, .CRITICAL { background: #3a1520; color: var(--fail); }
    .PASS { background: #10332d; color: var(--pass); }
    .WARN { background: #3a3014; color: var(--warn); }
    .HIGH { background: #3a2314; color: var(--high); }
    .MEDIUM { background: #2a2440; color: #c5b8ff; }
    .INFO, .QUEUED { background: #18233f; color: var(--info); }
    .COMPLETED, .RUNNING { background: #10332d; color: var(--pass); }
    .btn { background: var(--accent); color: #04241d; border: 0; border-radius: 10px; padding: 9px 14px;
      font-weight: 600; cursor: pointer; }
    .btn.secondary { background: #243154; color: var(--text); }
    .btn.danger { background: var(--fail); color: white; }
    input, select, textarea { background: #0e162c; border: 1px solid var(--line); color: var(--text);
      border-radius: 10px; padding: 10px 12px; width: 100%; }
    .row { display: flex; gap: 10px; align-items: center; }
    .login { min-height: 100vh; display: grid; place-items: center; background:
      radial-gradient(900px 400px at 20% 0%, #1b2b55, transparent), var(--bg); }
    .login-card { width: 400px; background: var(--bg-card); border: 1px solid var(--line); border-radius: 18px; padding: 32px; }
    pre { background: #0a1020; border: 1px solid var(--line); border-radius: 10px; padding: 12px; overflow: auto;
      font-size: 12px; line-height: 1.45; }
    .snippet { color: #c5d4ff; }
    .err { color: var(--fail); margin-top: 8px; }
    .hidden { display: none !important; }
    @media (max-width: 1100px) { .app { grid-template-columns: 1fr; } .cards { grid-template-columns: 1fr 1fr; } .sidebar { display: none; } }
  </style>
</head>
<body>
  <div id="login-view" class="login">
    <div class="login-card">
      <div class="brand"><div class="logo"></div><div><h1>CryptoScan</h1><small>Deterministic crypto intelligence</small></div></div>
      <p class="muted">Sign in to find cryptographic bills of materials across your systems.</p>
      <form id="login-form" onsubmit="event.preventDefault(); login(); return false;">
        <label class="muted">Username</label>
        <input id="username" name="username" autocomplete="username" placeholder="admin" />
        <div style="height:10px"></div>
        <label class="muted">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" />
        <div style="height:16px"></div>
        <button class="btn" type="submit" style="width:100%">Enter platform</button>
      </form>
      <p id="dev-login-hint" class="muted hidden" style="margin-top:12px">Development login: <span class="mono">admin</span> / <span class="mono">cryptoscan</span></p>
      <div id="login-error" class="err"></div>
    </div>
  </div>

  <div id="app-view" class="app hidden">
    <aside class="sidebar">
      <div class="brand"><div class="logo"></div><div><h1>CryptoScan</h1><small>Estate CBOM</small></div></div>
      <nav class="nav">
        <button data-route="home" class="active" onclick="go('home')">Overview</button>
        <button data-route="monitor" onclick="go('monitor')">Live monitor</button>
        <button data-route="payment" onclick="go('payment')">Payment crypto</button>
        <button data-route="scans" onclick="go('scans')">Scans</button>
        <button data-route="new" onclick="go('new')">New scan</button>
        <button data-route="jobs" onclick="go('jobs')">Jobs</button>
        <button data-route="assets" onclick="go('assets')">Assets</button>
        <button data-route="systems" onclick="go('systems')">Systems</button>
        <button data-route="cbom" onclick="go('cbom')">CBOM</button>
        <button data-route="compliance" onclick="go('compliance')">Compliance</button>
        <button data-route="policy" onclick="go('policy')">Policy</button>
        <button data-route="container" onclick="go('container')">Container</button>
        <button data-route="tls" onclick="go('tls')">TLS / certs</button>
        <button data-route="cloud" onclick="go('cloud')">Cloud / IaC</button>
        <button data-route="runtime" onclick="go('runtime')">Runtime</button>
        <button data-route="algorithms" onclick="go('algorithms')">Algorithms</button>
        <button data-route="graph" onclick="go('graph')">Graph</button>
        <button data-route="business" onclick="go('business')">Business</button>
        <button data-route="quantum" onclick="go('quantum')">Quantum</button>
        <button data-route="agility" onclick="go('agility')">Agility</button>
        <button data-route="exceptions" onclick="go('exceptions')">Exceptions</button>
        <button data-route="vendors" onclick="go('vendors')">Vendors</button>
        <button data-route="ot" onclick="go('ot')">OT / ICS</button>
        <button data-route="analytics" onclick="go('analytics')">Analytics</button>
        <button data-route="migrations" onclick="go('migrations')">Migrations</button>
        <button data-route="drift" onclick="go('drift')">Drift</button>
        <button data-route="findings" onclick="go('findings')">Findings</button>
        <button data-route="workorders" onclick="go('workorders')">Work orders</button>
      </nav>
      <div style="margin-top:40px">
        <button class="btn secondary" style="width:100%" onclick="logout()">Sign out</button>
      </div>
    </aside>
    <main class="main" id="main"></main>
  </div>

<script>
const API = '/api/v1';
let TOKEN = localStorage.getItem('cs_token') || '';
let ENV = 'development';
let state = { route: 'home', scanId: null, findingId: null, jobId: null, assetId: null, systemId: null };

function isDevEnv() { return ENV === 'development' || ENV === 'dev'; }
function sampleTarget(devDefault) { return isDevEnv() ? devDefault : ''; }

async function api(path, opts={}) {
  const headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
  if (TOKEN) headers['Authorization'] = 'Bearer ' + TOKEN;
  let res;
  try {
    res = await fetch(API + path, Object.assign({ credentials: 'same-origin' }, opts, { headers }));
  } catch (e) {
    throw new Error('Cannot reach API at ' + API + path);
  }
  if (res.status === 401 && path !== '/auth/login') { logout(); throw new Error('Unauthorized'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const detail = data.detail;
    let message;
    if (typeof detail === 'string') message = detail;
    else if (Array.isArray(detail)) message = detail.map(d => (typeof d === 'string' ? d : (d.msg || JSON.stringify(d)))).join('; ');
    else if (detail && typeof detail === 'object') message = detail.message || JSON.stringify(detail);
    else message = res.statusText || ('HTTP ' + res.status);
    throw new Error(message);
  }
  return data;
}

async function login() {
  try {
    const data = await api('/auth/login', { method: 'POST', body: JSON.stringify({
      username: document.getElementById('username').value,
      password: document.getElementById('password').value
    })});
    TOKEN = data.token;
    localStorage.setItem('cs_token', TOKEN);
    document.getElementById('login-view').classList.add('hidden');
    document.getElementById('app-view').classList.remove('hidden');
    go('home');
  } catch (e) {
    document.getElementById('login-error').textContent = e.message;
  }
}

function logout() {
  const token = TOKEN;
  TOKEN = '';
  localStorage.removeItem('cs_token');
  document.getElementById('app-view').classList.add('hidden');
  document.getElementById('login-view').classList.remove('hidden');
  const headers = token ? { 'Authorization': 'Bearer ' + token } : {};
  fetch(API + '/auth/logout', { method: 'POST', headers }).catch(() => {});
}

function go(route, extra={}) {
  state = Object.assign({ route: 'home', scanId: null, findingId: null, jobId: null, assetId: null, systemId: null }, { route }, extra);
  document.querySelectorAll('.nav button').forEach(b => b.classList.toggle('active', b.dataset.route === route));
  render();
}

function badge(v) { return `<span class="badge ${v || ''}">${v || '—'}</span>`; }
function coverageBadge(v) {
  const map = {CURRENT:'PASS', NEVER_SCANNED:'FAIL', NO_TARGET:'WARN', STALE:'HIGH', FAILED:'FAIL'};
  return `<span class="badge ${map[v]||'INFO'}">${v || '—'}</span>`;
}

async function render() {
  if (window.__monitorPoll) { clearInterval(window.__monitorPoll); window.__monitorPoll = null; }
  const el = document.getElementById('main');
  el.innerHTML = '<p class="muted">Loading…</p>';
  try {
    if (state.route === 'monitor') return renderMonitor(el);
    if (state.route === 'payment') return renderPayment(el);
    if (state.route === 'home') return renderHome(el);
    if (state.route === 'scans') return renderScans(el);
    if (state.route === 'scan') return renderScan(el);
    if (state.route === 'finding') return renderFinding(el);
    if (state.route === 'new') return renderNew(el);
    if (state.route === 'job') return renderJob(el);
    if (state.route === 'jobs') return renderJobs(el);
    if (state.route === 'drift') return renderDrift(el);
    if (state.route === 'findings') return renderFindings(el);
    if (state.route === 'assets') return renderAssets(el);
    if (state.route === 'asset') return renderAsset(el);
    if (state.route === 'systems') return renderSystems(el);
    if (state.route === 'system') return renderSystem(el);
    if (state.route === 'cbom') return renderCbom(el);
    if (state.route === 'compliance') return renderCompliance(el);
    if (state.route === 'policy') return renderPolicy(el);
    if (state.route === 'container') return renderContainer(el);
    if (state.route === 'workorders') return renderWorkOrdersHome(el);
    if (state.route === 'tls') return renderTls(el);
    if (state.route === 'cloud') return renderCloud(el);
    if (state.route === 'runtime') return renderRuntime(el);
    if (state.route === 'algorithms') return renderAlgorithms(el);
    if (state.route === 'graph') return renderGraph(el);
    if (state.route === 'business') return renderBusiness(el);
    if (state.route === 'quantum') return renderQuantum(el);
    if (state.route === 'agility') return renderAgility(el);
    if (state.route === 'exceptions') return renderExceptions(el);
    if (state.route === 'vendors') return renderVendors(el);
    if (state.route === 'ot') return renderOt(el);
    if (state.route === 'analytics') return renderAnalytics(el);
    if (state.route === 'migrations') return renderMigrations(el);
  } catch (e) {
    el.innerHTML = `<div class="card"><h2>Error</h2><p class="err">${e.message}</p></div>`;
  }
}

async function renderHome(el) {
  const s = await api('/stats/summary');
  const scans = await api('/scans?page_size=8');
  const cov = s.coverage || {};
  const counts = cov.counts || {};
  el.innerHTML = `
    <div class="top"><div><h2>Estate cryptographic coverage</h2>
      <p class="muted">${cov.message || 'A bank cannot know which algorithms a system runs until that system is scanned into a CBOM.'}</p></div>
      <button class="btn" onclick="go('cbom')">Open CBOM coverage</button></div>
    <div class="grid cards">
      <div class="card"><div class="label">Systems</div><div class="value">${cov.systems||0}</div></div>
      <div class="card"><div class="label">With a CBOM</div><div class="value" style="color:var(--pass)">${cov.with_cbom||0}</div><p class="muted">${cov.coverage_pct||0}% coverage</p></div>
      <div class="card"><div class="label">Unknown crypto</div><div class="value" style="color:var(--fail)">${cov.unknown_crypto||0}</div><p class="muted">Never scanned or no target</p></div>
      <div class="card"><div class="label">Ready to scan</div><div class="value">${cov.scannable||0}</div><p class="muted">Have a target, missing/stale CBOM</p></div>
    </div>
    <div style="height:16px"></div>
    <div class="grid cards">
      <div class="card"><div class="label">Never scanned</div><div class="value">${counts.NEVER_SCANNED||0}</div></div>
      <div class="card"><div class="label">No scan target</div><div class="value">${counts.NO_TARGET||0}</div></div>
      <div class="card"><div class="label">Stale CBOM</div><div class="value">${counts.STALE||0}</div></div>
      <div class="card"><div class="label">Failed scans</div><div class="value">${counts.FAILED||0}</div></div>
    </div>
    <div style="height:16px"></div>
    <div class="grid" style="grid-template-columns: 1.2fr .8fr">
      <div class="card">
        <div class="label">Recent scans</div>
        <table><thead><tr><th>Target</th><th>Status</th><th>When</th></tr></thead>
        <tbody>${(scans.scans||[]).map(sc => `<tr onclick="go('scan',{scanId:'${sc.scan_id}'})" style="cursor:pointer">
          <td class="mono">${sc.target_location}</td><td>${badge(sc.status)}</td>
          <td class="muted">${(sc.scan_start||'').replace('T',' ').slice(0,19)}</td></tr>`).join('') || '<tr><td colspan=3 class="muted">No scans yet</td></tr>'}
        </tbody></table>
      </div>
      <div class="card">
        <div class="label">Open drift</div>
        <p>Critical ${s.open_drift?.CRITICAL||0} · High ${s.open_drift?.HIGH||0} · Medium ${s.open_drift?.MEDIUM||0}</p>
        <div class="label">Algorithms</div>
        <table><tbody>${(s.algorithms||[]).slice(0,8).map(a => `<tr><td>${a.algorithm}</td><td>${a.total}</td><td>${a.compliance_pct}%</td></tr>`).join('') || '<tr><td class="muted">None yet</td></tr>'}</tbody></table>
      </div>
    </div>`;
}

async function renderScans(el) {
  const data = await api('/scans?page_size=50');
  el.innerHTML = `<div class="top"><h2>Scans</h2><button class="btn" onclick="go('new')">New scan</button></div>
    <div class="card"><table><thead><tr><th>Target</th><th>Branch</th><th>Status</th><th>Findings</th><th>When</th></tr></thead>
    <tbody>${(data.scans||[]).map(sc => `<tr onclick="go('scan',{scanId:'${sc.scan_id}'})" style="cursor:pointer">
      <td class="mono">${sc.target_location}</td><td>${sc.target_branch||'—'}</td>
      <td>${badge(sc.status)}</td><td>${sc.statistics?.total_findings ?? '—'}</td>
      <td class="muted">${(sc.scan_start||'').replace('T',' ').slice(0,19)}</td></tr>`).join('') || '<tr><td colspan=5 class="muted">No scans</td></tr>'}
    </tbody></table></div>`;
}

async function renderScan(el) {
  const sc = await api('/scans/' + state.scanId);
  const f = await api(`/scans/${state.scanId}/findings?page_size=100`);
  let agility = null, orders = null, gate = null, materials = null;
  try { agility = await api(`/scans/${state.scanId}/agility`); } catch (e) { agility = null; }
  try { orders = await api(`/scans/${state.scanId}/work-orders`); } catch (e) { orders = null; }
  try { gate = await api(`/scans/${state.scanId}/gate`); } catch (e) { gate = null; }
  try { materials = await api(`/scans/${state.scanId}/materials`); } catch (e) { materials = null; }
  const gateDecision = gate?.decision || sc.statistics?.gate?.decision || '—';
  el.innerHTML = `<div class="top"><div><h2>Scan detail</h2><p class="muted mono">${sc.target_location}</p></div>
    <div class="row" style="flex-wrap:wrap">
      <button class="btn secondary" onclick="retryScan('${sc.scan_id}')">Retry scan</button>
      ${githubLink(sc.target_location, sc.target_commit)}
      <button class="btn secondary" onclick="approveBaseline('${sc.scan_id}')">Approve baseline</button>
      <button class="btn secondary" onclick="verifyScan('${sc.scan_id}')">Verify chain</button>
      <button class="btn secondary" onclick="downloadFile('/scans/${sc.scan_id}/cbom', 'cbom-${sc.scan_id}.json')">Export CBOM</button>
      <button class="btn secondary" onclick="downloadFile('/scans/${sc.scan_id}/export', 'scan-${sc.scan_id}.json')">Export JSON</button>
      <button class="btn secondary" onclick="downloadFile('/scans/${sc.scan_id}/export.csv', 'scan-${sc.scan_id}.csv')">Export CSV</button>
      <button class="btn secondary" onclick="downloadFile('/scans/${sc.scan_id}/evidence-pack', 'evidence-pack-${sc.scan_id}.json')">Evidence pack</button>
      <button class="btn secondary" onclick="downloadFile('/scans/${sc.scan_id}/audit-pack', 'cryptoscan-audit-${sc.scan_id}.zip')">CRA/NIST zip</button>
      <button class="btn secondary" onclick="downloadFile('/scans/${sc.scan_id}/gate.sarif', 'gate-${sc.scan_id}.sarif.json')">SARIF</button>
      <button class="btn secondary" onclick="downloadFile('/scans/${sc.scan_id}/report.html', 'report-${sc.scan_id}.html')">Compliance report</button>
      <button class="btn secondary" onclick="go('scans')">Back</button>
    </div></div>
    <div class="grid cards">
      <div class="card"><div class="label">Status</div><div class="value" style="font-size:18px">${badge(sc.status)}</div></div>
      <div class="card"><div class="label">Findings</div><div class="value">${sc.statistics?.total_findings ?? f.total_count}</div></div>
      <div class="card"><div class="label">Agility</div><div class="value">${agility ? agility.score : '—'}</div><p class="muted">${agility?.band || ''}</p></div>
      <div class="card"><div class="label">PR gate</div><div class="value" style="font-size:18px">${badge(gateDecision)}</div><p class="muted">${gate?.summary || ''}</p></div>
    </div>
    <div style="height:16px"></div>
    <div class="grid" style="grid-template-columns:1fr 1fr">
      <div class="card"><div class="label">Work orders</div>
        <table><thead><tr><th>ID</th><th>Replace</th><th>Sites</th><th>With</th></tr></thead>
        <tbody>${(orders?.orders||[]).map(o => `<tr>
          <td class="mono">${o.work_order_id}</td><td>${o.algorithm} ${o.purpose}</td>
          <td>${o.sites}</td><td class="muted">${o.replacement}</td></tr>`).join('') || '<tr><td colspan=4 class="muted">No failing sites to migrate.</td></tr>'}
        </tbody></table>
      </div>
      <div class="card"><div class="label">Materials (PEM / certs)</div>
        <table><thead><tr><th>File</th><th>Algo</th><th>Linked source</th></tr></thead>
        <tbody>${(materials?.materials||[]).map(m => `<tr>
          <td class="mono">${m.file_path}</td><td>${m.algorithm||'—'}</td>
          <td class="muted">${(m.linked_source||[]).map(s => (s.file_path||'')+':'+s.line_number).join(', ') || '—'}</td></tr>`).join('') || '<tr><td colspan=3 class="muted">No PEM/certs in this tree.</td></tr>'}
        </tbody></table>
      </div>
    </div>
    <div style="height:16px"></div>
    <div class="card"><div class="label">Findings</div>
    <table><thead><tr><th>Algo</th><th>Mode</th><th>Location</th><th>Line</th><th>Status</th></tr></thead>
    <tbody>${(f.findings||[]).map(x => `<tr onclick="go('finding',{findingId:'${x.evidence_id}',scanId:'${state.scanId}'})" style="cursor:pointer">
      <td class="mono">${x.algorithm}</td><td>${x.mode||'—'}</td><td class="mono">${x.file_path}</td>
      <td>${x.line_number}</td><td>${badge(x.compliance_status)}</td></tr>`).join('') || '<tr><td colspan=5 class="muted">No findings</td></tr>'}
    </tbody></table></div>`;
}

async function renderFinding(el) {
  const x = await api('/findings/' + state.findingId);
  const snippet = x.finding_data?.source?.code_snippet || 'No snippet';
  const rules = x.policy_evaluation?.rules_evaluated || [];
  el.innerHTML = `<div class="top"><div><h2>${x.algorithm}${x.mode ? '/'+x.mode : ''}</h2>
    <p class="muted mono">${x.file_path}:${x.line_number}</p></div>
    <button class="btn secondary" onclick="go('scan',{scanId:'${x.scan_id}'})">Back to scan</button></div>
    <div class="grid" style="grid-template-columns:1fr 1fr">
      <div class="card">
        <div class="label">Crypto</div>
        <p>Algorithm <b>${x.algorithm}</b> · Key ${x.key_size || 'n/a'} · Mode ${x.mode || 'n/a'} · Purpose ${x.purpose || 'n/a'}</p>
        <p>Confidence ${badge(x.confidence)} · Hardcoded key ${x.is_hardcoded_key ? badge('FAIL') : badge('PASS')}</p>
        <div class="label">Compliance</div><p>${badge(x.compliance_status)}</p>
        ${rules.map(r => `<p>${badge(r.evaluation_result)} <b>${r.rule_id}</b> — ${r.message}</p>`).join('')}
      </div>
      <div class="card">
        <div class="label">Evidence integrity</div>
        <p class="mono">content ${x.content_hash}</p>
        <p class="mono">chain ${x.chain_hash}</p>

async function startScan() {
  const repo = (document.getElementById('repo').value || '').trim();
  const branch = document.getElementById('branch').value;
  const msg = document.getElementById('scan-msg');
  if (!repo) {
    if (msg) msg.textContent = 'Enter a git URL or local path.';
    return;

  const data = await api('/scans/trigger', { method: 'POST', body: JSON.stringify({ repo_url: repo, branch })});
  go('job', { jobId: data.job_id });
}

function liveScanCard(job) {
  const cloud = job.progress && job.progress.cloud;
  const ls = cloud && cloud.live_scan;
  if (!ls) return '';
  const errs = (ls.errors || []).slice(0, 6).map(e => `<tr><td class="mono">${e.account ? e.account + ' · ' : ''}${e.provider}/${e.service}${e.region && e.region !== 'global' ? '/' + e.region : ''}</td><td class="mono">${e.code || ''}</td><td class="muted">${(e.error || '').slice(0, 90)}</td></tr>`).join('');
  const accounts = (cloud.accounts || []).slice(0, 12).map(a => `<tr><td class="mono">${a.account_id || '—'}</td><td>${verdictBadge(a.status)}</td><td>${a.resources || 0}</td></tr>`).join('');
  return `<div style="height:16px"></div>
    <div class="card"><div class="label">Live scan telemetry</div>
      <p>Verdict ${verdictBadge(ls.status)} · ${ls.resources_scanned || cloud.resources || 0} resources scanned
        ${cloud.accounts_discovered ? ` · ${cloud.accounts_discovered} accounts discovered` : ''}
        ${ls.error_count ? ` · <span style="color:var(--fail)">${ls.error_count} errors</span>` : ''}
        ${ls.truncation_count ? ` · ${ls.truncation_count} truncations` : ''}</p>
      ${accounts ? `<table><thead><tr><th>Account</th><th>Verdict</th><th>Resources</th></tr></thead><tbody>${accounts}</tbody></table>` : ''}
      ${errs ? `<div class="label" style="margin-top:12px">Errors</div><table><tbody>${errs}</tbody></table>` : ''}
    </div>`;
}

const MONITOR_STATUS_BADGE = { OK: 'PASS', DEGRADED: 'WARN', FAILING: 'FAIL', BLOCKED: 'FAIL', PAUSED: 'INFO', PENDING: 'QUEUED' };

async function renderMonitor(el) {
  async function paint() {
    const status = await api('/monitor/status');
    const targets = (await api('/monitor/targets')).targets;
    const o = status.overview;
    const counts = Object.entries(o.by_status || {}).map(([k, v]) => badge(`${k} ${v}`)).join(' ');
    el.innerHTML = `
    <h2>Live monitor <span class="muted">(24/7)</span></h2>
    <div class="card"><div class="label">Estate under watch</div>
      <p><b>${o.targets_total}</b> targets (${o.enabled} enabled) — status: ${counts || '—'}</p>
      <p class="muted">Daemon: ${escapeHtml(o.daemon)} · updated ${new Date().toLocaleTimeString()} (auto-refresh 5s)</p>
    </div>
    ${status.needs_attention.length ? `
    <div class="card"><div class="label">Needs attention</div>
      <table><thead><tr><th>Target</th><th>Status</th><th>Why</th></tr></thead><tbody>
        ${status.needs_attention.map(t => `<tr><td>${escapeHtml(t.name)}</td><td>${badge(MONITOR_STATUS_BADGE[t.status] || 'INFO')}</td><td class="mono">${escapeHtml(t.last_error || (t.last_summary?.issues || []).join(', ') || '—')}</td></tr>`).join('')}
      </tbody></table></div>` : ''}
    <div class="card"><div class="label">Watch list</div>
      <table><thead><tr><th>Name</th><th>Type</th><th>Interval</th><th>Status</th><th>Last scan</th><th>Next scan</th><th></th></tr></thead><tbody>
      ${targets.map(t => `<tr>
        <td>${escapeHtml(t.name)}</td><td>${escapeHtml(t.target_type)}</td><td>${Math.round(t.interval_seconds / 60)}m</td>
        <td>${badge(MONITOR_STATUS_BADGE[t.status] || 'INFO')} ${t.enabled ? '' : '<span class="badge INFO">paused</span>'}</td>
        <td>${t.last_scan_at ? new Date(t.last_scan_at).toLocaleString() : '—'}</td>
        <td>${t.next_scan_at ? new Date(t.next_scan_at).toLocaleString() : '—'}</td>
        <td>${t.enabled ? `<button class="btn secondary" onclick="monitorScanNow('${t.id}')">Scan now</button> <button class="btn secondary" onclick="monitorToggle('${t.id}', false)">Pause</button>` : `<button class="btn secondary" onclick="monitorToggle('${t.id}', true)">Resume</button>`} <button class="btn danger" onclick="monitorDelete('${t.id}')">Remove</button></td>
      </tr>`).join('') || '<tr><td colspan="7" class="muted">Nothing watched yet — add an endpoint below.</td></tr>'}
      </tbody></table></div>
    <div class="card"><div class="label">Add a watch target</div>
      <p><input id="mon-name" placeholder="name (e.g. Payments edge)" style="width:180px">
         <select id="mon-type"><option>NETWORK</option><option>CLOUD</option><option>REPO</option><option>CONTAINER</option><option>PAYMENT</option></select>
         <input id="mon-endpoints" placeholder="endpoints, comma separated (host:port)" style="width:320px">
         <select id="mon-interval"><option value="300">5 min</option><option value="900" selected>15 min</option><option value="3600">1 h</option><option value="86400">1 day</option></select>
         <button class="btn" onclick="monitorAdd()">Watch</button></p>
      <p class="muted">NETWORK probes TLS live (no credentials needed). CLOUD needs provider + account in config; REPO/CONTAINER run through the scan pipeline.</p>
    </div>
    <div class="card"><div class="label">Recent events</div>
      <table><tbody>${status.recent_events.map(e => `<tr><td class="mono">${e.created_at ? new Date(e.created_at).toLocaleTimeString() : ''}</td><td>${badge(e.event_type === 'ALERT' ? 'HIGH' : e.event_type === 'SCAN_OK' ? 'PASS' : e.event_type === 'SCAN_DEGRADED' ? 'WARN' : 'INFO')}</td><td>${escapeHtml(e.target_name)}</td><td class="mono">${escapeHtml(e.detail || '')}</td></tr>`).join('') || '<tr><td class="muted">No events yet.</td></tr>'}</tbody></table>
    </div>`;
  }
  await paint();
  window.__monitorPoll = setInterval(async () => {
    if (state.route !== 'monitor') { clearInterval(window.__monitorPoll); window.__monitorPoll = null; return; }
    try { await paint(); } catch (e) { /* transient — next tick retries */ }
  }, 5000);
}

async function monitorAdd() {
  const name = document.getElementById('mon-name').value.trim();

  go('monitor');

async function ceremonySchedule() {
  const id = document.getElementById('cer-id').value.trim();
  const key = document.getElementById('cer-key').value.trim();
  const date = document.getElementById('cer-date').value;
  const custodians = document.getElementById('cer-custodians').value.split(',').map(x => x.trim()).filter(Boolean);

  await api('/payment-crypto/ceremonies', { method: 'POST', body: JSON.stringify({
    ceremony_id: id, key_id: key, held_at: new Date(date + 'T09:00:00Z').toISOString(),
    custodians, m_of_n: custodians.length >= 2 ? `2-of-${custodians.length}` : null,
  }) });
  go('payment');
}

function githubLink(target, commit) {
  const url = githubBrowseUrl(target, commit);
  if (!url) return '';
  return `<a class="btn secondary" href="${url}" target="_blank" rel="noopener">View on GitHub</a>`;
}

function githubBrowseUrl(target, commit) {
  if (!target) return '';
  let raw = String(target);
  if (raw.endsWith('.git')) raw = raw.slice(0, -4);
  if (raw.startsWith('git@github.com:')) raw = 'https://github.com/' + raw.slice('git@github.com:'.length);
  const marker = 'github.com/';
  const idx = raw.indexOf(marker);
  if (idx === -1) return '';
  const repo = raw.slice(idx + marker.length).split('/').slice(0, 2).join('/');
  if (!repo || repo.indexOf('/') === -1) return '';
  return commit ? ('https://github.com/' + repo + '/tree/' + commit) : ('https://github.com/' + repo);
}

async function scanContainer() {
  const target = prompt('Image ref, docker-save .tar, or filesystem path', sampleTarget('local://demo/polyglot-app'));
  if (!target) return;
  let body;
  if (target.endsWith('.tar') || target.endsWith('.tar.gz') || target.endsWith('.tgz')) {
    body = { archive: target, live_cve: true };
  } else if (target.startsWith('/') || target.startsWith('.') || target.startsWith('local://') || target.startsWith('file://')) {
    body = { path: target.replace('local://', '').replace('file://', ''), live_cve: true };
  } else {
    body = { image: target, live_cve: true };
  }
  await api('/container/scan', { method: 'POST', body: JSON.stringify(body) });
  renderContainer(document.getElementById('main'));
}

async function parseAlgo() {
  const name = document.getElementById('algo-input').value.trim();
  if (!name) return;
  const out = await api('/algorithms/parse?name=' + encodeURIComponent(name));
  const comps = (out.components || []).map(c => `${c.role}: ${c.algorithm}${c.key_size ? ' (' + c.key_size + 'b)' : ''}`).join(' · ');
  document.getElementById('algo-result').innerHTML = `<table><tbody>
    <tr><td>Raw</td><td class="mono">${out.raw}</td></tr>
    <tr><td>Canonical</td><td><b>${out.algorithm}</b></td></tr>
    <tr><td>Family</td><td>${out.family}</td></tr>
    <tr><td>Key size</td><td>${out.key_size ? out.key_size + ' bits (' + (out.parameter_kind || 'key_bits') + ')' : '—'}</td></tr>
    <tr><td>Status</td><td>${verdictBadge(out.status)}</td></tr>
    <tr><td>Quantum</td><td>${out.quantum_impact || '—'}${out.quantum_vulnerable ? ' (quantum-vulnerable)' : ''}</td></tr>
    ${comps ? `<tr><td>Components</td><td>${comps}</td></tr>` : ''}
    ${out.notes ? `<tr><td>Notes</td><td class="muted">${out.notes}</td></tr>` : ''}
  </tbody></table>`;
}

function filterAlgoRows() {
  const needle = document.getElementById('algo-filter').value.toLowerCase();
  document.querySelectorAll('.algo-row').forEach(row => {
    row.style.display = row.dataset.hay.includes(needle) ? '' : 'none';

}

// ---------- Interactive dependency graph ----------
// Force-directed layout + click-to-highlight connected systems.
// No external libraries: deterministic seeded layout, SVG pan/zoom,
// BFS neighbor highlighting with hop distances.

const GV_WIDTH = 960, GV_HEIGHT = 560, GV_MAX_NODES = 140;
const GV_COLORS = { System:'#3ee0c5', CryptoAsset:'#7aa2ff', Vendor:'#ff8a4a', BusinessProcess:'#b07aff', Certificate:'#ffd166', Owner:'#ff6b9d', Scope:'#f5c14a', CloudResource:'#f5c14a' };
let graphState = { layout: null, transform: { k: 1, x: 0, y: 0 }, selected: null, hopLimit: 2 };

function gvColor(n) { return GV_COLORS[n.group || n.kind] || '#8fa3c8'; }
function gvShort(id) { return (id || '').includes(':') ? (id || '').split(':').slice(1).join(':') : (id || ''); }

function graphLayout(nodes, edges) {
  // Mulberry32 PRNG — same graph always renders the same way.
  let seed = 0x9E3779B9;
  const rnd = () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  const idx = new Map(nodes.map((n, i) => [n.id, i]));
  const pos = nodes.map((n, i) => {
    const a = (2 * Math.PI * i) / Math.max(nodes.length, 1) + rnd() * 0.6;
    const r = 0.30 + rnd() * 0.16;
    return { x: GV_WIDTH / 2 + GV_WIDTH * 0.44 * r * Math.cos(a),
             y: GV_HEIGHT / 2 + GV_HEIGHT * 0.44 * r * Math.sin(a), vx: 0, vy: 0 };
  });
  const es = edges
    .map(e => [idx.get(e.from), idx.get(e.to)])
    .filter(p => p[0] !== undefined && p[1] !== undefined && p[0] !== p[1]);
  for (let it = 0; it < 180; it++) {
    for (let i = 0; i < pos.length; i++) for (let j = i + 1; j < pos.length; j++) {
      let dx = pos[i].x - pos[j].x, dy = pos[i].y - pos[j].y;
      const d2 = dx * dx + dy * dy || 0.01;
      if (d2 > 120000) continue;
      const d = Math.sqrt(d2), f = 2200 / d2;
      dx /= d; dy /= d;
      pos[i].vx += dx * f; pos[i].vy += dy * f;
      pos[j].vx -= dx * f; pos[j].vy -= dy * f;
    }
    for (const [a, b] of es) {
      const dx = pos[b].x - pos[a].x, dy = pos[b].y - pos[a].y;
      const d = Math.sqrt(dx * dx + dy * dy) || 0.01;
      const f = (d - 120) * 0.02, ux = dx / d, uy = dy / d;
      pos[a].vx += ux * f; pos[a].vy += uy * f;
      pos[b].vx -= ux * f; pos[b].vy -= uy * f;
    }
    for (const p of pos) {
      p.vx += (GV_WIDTH / 2 - p.x) * 0.0025; p.vy += (GV_HEIGHT / 2 - p.y) * 0.0025;
      p.x += Math.max(-14, Math.min(14, p.vx)); p.y += Math.max(-14, Math.min(14, p.vy));
      p.vx *= 0.85; p.vy *= 0.85;
      p.x = Math.max(24, Math.min(GV_WIDTH - 24, p.x));
      p.y = Math.max(24, Math.min(GV_HEIGHT - 24, p.y));
    }
  }
  return pos;
}

function gvNeighbors(nodes, edges) {
  const adj = new Map(nodes.map(n => [n.id, []]));
  for (const e of edges) {
    if (adj.has(e.from) && adj.has(e.to)) {
      adj.get(e.from).push(e.to);
      adj.get(e.to).push(e.from);
    }
  }
  return adj;
}

// BFS up to hopLimit; returns { ids: Set, hops: Map<id, number> }.
function gvReach(adj, startId, hopLimit) {
  const hops = new Map([[startId, 0]]);
  const queue = [startId];
  while (queue.length) {
    const cur = queue.shift();
    const d = hops.get(cur);
    if (d >= hopLimit) continue;
    for (const nxt of adj.get(cur) || []) {
      if (!hops.has(nxt)) { hops.set(nxt, d + 1); queue.push(nxt); }
    }
  }
  return { ids: new Set(hops.keys()), hops };
}

function gvApplyView() {
  const world = document.getElementById('gv-world');
  if (!world || !graphState.layout) return;
  const { k, x, y } = graphState.transform;
  world.setAttribute('transform', `translate(${x} ${y}) scale(${k})`);
}

function gvApplyHighlight() {
  const svg = document.getElementById('gv-svg');
  if (!svg || !graphState.layout) return;
  const { ids } = graphState.reach || { ids: null };
  svg.querySelectorAll('[data-node]').forEach(el => {
    const on = !ids || ids.has(el.dataset.node);
    el.style.opacity = on ? '1' : '0.12';
    el.setAttribute('stroke', el.dataset.node === graphState.selected ? '#ffffff' : 'none');
    el.setAttribute('stroke-width', el.dataset.node === graphState.selected ? '2.5' : '0');
  });
  svg.querySelectorAll('[data-edge]').forEach(el => {
    const [a, b] = el.dataset.edge.split('→');
    const on = !ids || (ids.has(a) && ids.has(b));
    el.style.opacity = on ? '1' : '0.06';
  });
  svg.querySelectorAll('[data-elabel]').forEach(el => {
    const [a, b] = el.dataset.elabel.split('→');
    el.style.display = (!ids || (ids.has(a) && ids.has(b))) ? '' : 'none';
  });
}

function gvSelect(nodeId) {
  graphState.selected = nodeId;
  const limit = graphState.hopLimit;
  graphState.reach = nodeId
    ? gvReach(graphState.adj, nodeId, limit === 'all' ? 99 : limit)
    : null;
  gvApplyHighlight();
  gvRenderDetails();
  // Keep the blast-radius panel in sync when a System is selected.
  const raw = nodeId ? gvShort(nodeId) : '';
  const select = document.getElementById('blast-system');
  if (select && raw && [...select.options].some(o => o.value === raw)) {
    select.value = raw;
    runBlast();
  }
}

function gvRenderDetails() {
  const box = document.getElementById('gv-details');
  if (!box) return;
  const id = graphState.selected;
  if (!id || !graphState.layout) { box.innerHTML = '<span class="muted">Click a node to highlight everything connected to it.</span>'; return; }
  const node = graphState.byId[id] || {};
  const reach = graphState.reach || { hops: new Map() };
  const kindOf = nid => (graphState.byId[nid] || {}).group || (graphState.byId[nid] || {}).kind || '';
  const systems = [...reach.hops.entries()].filter(([nid]) => kindOf(nid) === 'System' && nid !== id)
    .sort((a, b) => a[1] - b[1]);
  const assets = [...reach.hops.entries()].filter(([nid]) => kindOf(nid) === 'CryptoAsset' && nid !== id);
  const others = reach.hops.size - 1 - systems.length - assets.length;
  box.innerHTML = `<div class="label">${node.group || node.kind || 'Node'}</div>
    <div style="font-weight:600;margin:4px 0 8px">${node.label || gvShort(id)}</div>
    <p class="muted" style="margin:0 0 8px">Within ${graphState.hopLimit === 'all' ? 'all' : graphState.hopLimit} hop${graphState.hopLimit === 1 ? '' : 's'}:</p>
    <p style="margin:0 0 4px"><span style="color:${GV_COLORS.System}">●</span> ${systems.length} connected system${systems.length === 1 ? '' : 's'}</p>
    <p style="margin:0 0 4px"><span style="color:${GV_COLORS.CryptoAsset}">●</span> ${assets.length} crypto asset${assets.length === 1 ? '' : 's'}</p>
    ${others > 0 ? `<p style="margin:0 0 4px" class="muted">+ ${others} related nodes</p>` : ''}
    <div style="margin-top:8px" class="mono muted">${id}</div>
    ${systems.length ? `<div class="label" style="margin-top:10px">Connected systems</div>
      <table><tbody>${systems.slice(0, 12).map(([nid, h]) =>
        `<tr><td>${(graphState.byId[nid] || {}).label || gvShort(nid)}</td><td class="muted">${h} hop${h === 1 ? '' : 's'}</td></tr>`).join('')}
        ${systems.length > 12 ? `<tr><td colspan=2 class="muted">+ ${systems.length - 12} more</td></tr>` : ''}</tbody></table>` : ''}`;
}

async function renderGraph(el) {
  const graph = await api('/graph');
  const health = graph.health || await api('/graph/health');
  const priorities = await api('/priorities');
  const backend = graph.backend || health.backend || 'memory';
  const allNodes = graph.nodes || [];
  const edges = graph.edges || [];
  const nodes = allNodes.slice(0, GV_MAX_NODES);
  const truncated = allNodes.length - nodes.length;
  const systems = nodes.filter(n => (n.group || n.kind) === 'System');

  if (!graphState.layout || graphState.layoutKey !== nodes.length + ':' + edges.length) {
    graphState.layout = graphLayout(nodes, edges);
    graphState.layoutKey = nodes.length + ':' + edges.length;
    graphState.transform = { k: 1, x: 0, y: 0 };
    graphState.selected = null;
    graphState.reach = null;
  }
  graphState.adj = gvNeighbors(nodes, edges);
  graphState.byId = Object.fromEntries(nodes.map(n => [n.id, n]));

  const pos = graphState.layout;
  const byId = graphState.byId;
  const lines = edges.filter(e => byId[e.from] && byId[e.to]).map(e => {
    const a = pos[nodes.findIndex(n => n.id === e.from)], b = pos[nodes.findIndex(n => n.id === e.to)];
    if (!a || !b) return '';
    return `<line data-edge="${e.from}→${e.to}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#3a4a78" stroke-width="1.4"/>`;
  }).join('');
  const labels = edges.filter(e => byId[e.from] && byId[e.to]).map(e => {
    const ia = nodes.findIndex(n => n.id === e.from), ib = nodes.findIndex(n => n.id === e.to);
    const a = pos[ia], b = pos[ib];
    if (!a || !b || !e.label) return '';
    return `<text data-elabel="${e.from}→${e.to}" x="${(a.x + b.x) / 2}" y="${(a.y + b.y) / 2 - 3}" fill="#7d8fbf" font-size="9" text-anchor="middle" style="display:none">${e.label}</text>`;
  }).join('');
  const dots = nodes.map((n, i) => {
    const p = pos[i];
    const r = (n.group || n.kind) === 'System' ? 9 : 7;
    return `<g style="cursor:pointer" data-nodeg="${n.id}">
      <circle data-node="${n.id}" cx="${p.x}" cy="${p.y}" r="${r}" fill="${gvColor(n)}" stroke="none"/>
      <text x="${p.x + r + 4}" y="${p.y + 3.5}" fill="#c5d4ff" font-size="10">${(n.label || gvShort(n.id) || '').toString().slice(0, 22)}</text></g>`;
  }).join('');
  const legend = Object.entries(GV_COLORS).filter(([k]) => nodes.some(n => (n.group || n.kind) === k))
    .map(([k, c]) => `<span style="margin-right:14px"><span style="color:${c}">●</span> ${k}</span>`).join('');

  el.innerHTML = `<div class="top"><div><h2>Dependency graph</h2>
    <p class="muted">${allNodes.length} nodes · ${edges.length} edges · backend ${badge(backend === 'neo4j' ? 'PASS' : 'INFO')} ${backend}${health.ok ? '' : ' (memory fallback)'}${truncated > 0 ? ` · showing first ${GV_MAX_NODES}` : ''}</p></div>
    <div class="row"><button class="btn secondary" onclick="syncGraph()">Sync Neo4j</button>
      <button class="btn secondary" onclick="gvClear()">Clear selection</button></div></div>
    <div class="card" style="margin-bottom:16px">
      <div class="row" style="justify-content:space-between;margin-bottom:8px">
        <div class="row">${legend}</div>
        <div class="row"><span class="muted">Highlight hops</span>
          <select id="gv-hops" onchange="graphState.hopLimit=this.value==='all'?'all':parseInt(this.value,10);gvSelect(graphState.selected)">
            <option value="1">1</option><option value="2" selected>2</option><option value="3">3</option><option value="all">all</option>
          </select></div>
      </div>
      <svg id="gv-svg" viewBox="0 0 ${GV_WIDTH} ${GV_HEIGHT}" width="100%" height="${GV_HEIGHT}" style="background:#0c1428;border-radius:8px;touch-action:none">
        <g id="gv-world">${lines}${labels}${dots}</g>
      </svg>
      <p class="muted" style="margin:8px 0 0">Click a node → highlights every connected system within the hop limit. Drag to pan · scroll to zoom.</p>
    </div>
    <div class="grid" style="grid-template-columns:1fr 1fr">
      <div class="card"><div class="label">Selection</div><div id="gv-details" style="min-height:80px"><span class="muted">Click a node to highlight everything connected to it.</span></div>
        <div class="label" style="margin-top:14px">Blast radius</div>
        <div class="row">
          <select id="blast-system">${systems.map(s => `<option value="${gvShort(s.id)}">${s.label || s.name || s.id}</option>`).join('')}</select>
          <input id="blast-hops" type="number" min="1" max="12" value="5" style="max-width:90px" />
          <button class="btn" onclick="runBlast()">Query</button>
        </div>
        <div id="blast-out" class="muted" style="margin-top:10px">Click a node or run a query. Cypher walks CALLS*1..N on Neo4j when Bolt is up.</div>
      </div>
      <div class="card"><div class="label">Nodes</div>
        <table><thead><tr><th>Kind</th><th>Name</th></tr></thead>
        <tbody>${nodes.slice(0, 40).map(n => `<tr><td>${n.group || n.kind || ''}</td><td>${n.label || n.name || n.id}</td></tr>`).join('') || '<tr><td colspan=2 class="muted">No systems yet</td></tr>'}
        </tbody></table>
        <div class="label" style="margin-top:14px">Prioritized assets</div>
        <table><thead><tr><th>P</th><th>Algo</th><th>Revenue/day</th></tr></thead>
        <tbody>${(priorities.assets || []).slice(0, 20).map(a => `<tr>
          <td>${badge(a.business_context?.priority || 'P2')}</td>
          <td class="mono">${a.algorithm}</td>
          <td>${a.business_context?.total_revenue_at_risk || 0}</td></tr>`).join('') || '<tr><td colspan=3 class="muted">Run a scan and add a business process.</td></tr>'}
        </tbody></table></div>
    </div>`;

  gvApplyView();
  gvApplyHighlight();

  // Pan (drag) and zoom (wheel).
  const svg = document.getElementById('gv-svg');
  let drag = null, moved = 0;
  svg.addEventListener('pointerdown', ev => {
    drag = { x: ev.clientX, y: ev.clientY, tx: graphState.transform.x, ty: graphState.transform.y };
    moved = 0; svg.setPointerCapture(ev.pointerId);
  });
  svg.addEventListener('pointermove', ev => {
    if (!drag) return;
    const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
    moved = Math.max(moved, Math.abs(dx) + Math.abs(dy));
    if (moved > 4) { graphState.transform.x = drag.tx + dx; graphState.transform.y = drag.ty + dy; gvApplyView(); }
  });
  svg.addEventListener('pointerup', () => { drag = null; });
  svg.addEventListener('wheel', ev => {
    ev.preventDefault();
    const k = Math.max(0.4, Math.min(4, graphState.transform.k * (ev.deltaY < 0 ? 1.12 : 0.89)));
    graphState.transform.k = k; gvApplyView();
  }, { passive: false });

  // Click-to-highlight via event delegation (no inline id escaping).
  svg.addEventListener('click', ev => {
    if (moved > 4) return;
    const g = ev.target.closest('[data-nodeg]');
    gvSelect(g ? g.dataset.nodeg : null);
  });
}

function gvClear() { graphState.selected = null; graphState.reach = null; gvApplyHighlight(); gvRenderDetails(); }

async function syncGraph() {
  const result = await api('/graph/sync', { method: 'POST', body: '{}' });
  alert('Graph sync: backend=' + (result.backend || result.health?.backend) + ' nodes=' + (result.nodes || 0));
  renderGraph(document.getElementById('main'));
}

async function queryBlast(rawId) {
  const id = (rawId || '').split(':').pop();
  const select = document.getElementById('blast-system');
  if (select && id) select.value = id;
  return runBlast();
}
async function runBlast() {
  const systemId = document.getElementById('blast-system')?.value;
  const hops = document.getElementById('blast-hops')?.value || 5;
  if (!systemId) return;
  const radius = await api('/graph/blast-radius?system_id=' + encodeURIComponent(systemId) + '&hops=' + hops);
  const impact = await api('/graph/impact?system_id=' + encodeURIComponent(systemId));
  document.getElementById('blast-out').innerHTML =
    `<p>Backend ${badge(radius.backend||'INFO')} · ${radius.systems.length} downstream · revenue $${(impact.total_revenue_at_risk||0).toLocaleString()}/day · customers ${(impact.total_customers_at_risk||0).toLocaleString()}</p>
     <p>${(radius.systems||[]).map(s => `${s.name||s.id} (${s.hops} hop)`).join(' → ') || 'No downstream systems.'}</p>
     <p class="muted">Scopes: ${(impact.compliance_scopes||[]).join(', ') || '—'}</p>`;
}

  })});

async function ingestCbom() {
  const msg = document.getElementById('cbom-ingest-msg');
  const raw = document.getElementById('cbom-json').value || '';
  let bom;
  try { bom = JSON.parse(raw); } catch (e) { msg.textContent = 'Invalid JSON'; return; }
  const name = (document.getElementById('cbom-system-name').value || '').trim();
  try {
    const data = await api('/cbom/ingest', { method: 'POST', body: JSON.stringify({ bom, system_name: name || undefined })});
    msg.textContent = 'Imported ' + data.imported + ' components into ' + (data.system?.name || 'system');
    go('cbom');
  } catch (e) {
    msg.textContent = e.message;
  }
}

async function diffCboms() {
  const left = document.getElementById('cbom-left')?.value;
  const right = document.getElementById('cbom-right')?.value;
  const out = document.getElementById('cbom-diff-out');
  if (!left || !right) { out.innerHTML = '<p class="muted">Need two systems.</p>'; return; }
  const data = await api('/cbom/diff', { method: 'POST', body: JSON.stringify({
    left: { system_id: left }, right: { system_id: right }
  })});
  const row = (item) => `<tr><td class="mono">${item.algorithm}${item.mode ? '/'+item.mode : ''}</td><td>${item.key_size||'—'}</td></tr>`;
  out.innerHTML = `<p>Added ${data.counts?.added||0} · removed ${data.counts?.removed||0} · unchanged ${data.counts?.unchanged||0}</p>
    <div class="grid" style="grid-template-columns:1fr 1fr">
      <div><div class="label">Added on ${data.right?.name||'right'}</div>
        <table><tbody>${(data.added||[]).map(row).join('') || '<tr><td class="muted">None</td></tr>'}</tbody></table></div>
      <div><div class="label">Removed from ${data.left?.name||'left'}</div>
        <table><tbody>${(data.removed||[]).map(row).join('') || '<tr><td class="muted">None</td></tr>'}</tbody></table></div>
    </div>`;
}

async function downloadFile(path, filename, opts={}) {
  const headers = Object.assign({}, opts.headers || {});
  if (TOKEN) headers['Authorization'] = 'Bearer ' + TOKEN;
  if (opts.body && !headers['Content-Type']) headers['Content-Type'] = 'application/json';
  const res = await fetch(API + path, Object.assign({ headers }, opts));
  if (!res.ok) {
    alert('Export failed: ' + res.statusText);
    return;
  }
  const blob = await res.blob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}

async function boot() {
  try {
    const meta = await fetch('/api/v1/meta', { credentials: 'same-origin' }).then(r => r.json());
    ENV = String(meta.environment || 'development').toLowerCase();
    const hint = document.getElementById('dev-login-hint');
    if (hint && isDevEnv()) hint.classList.remove('hidden');
  } catch (e) {}
  if (TOKEN) {
    document.getElementById('login-view').classList.add('hidden');
    document.getElementById('app-view').classList.remove('hidden');
    go('home');
  }
}
boot();
</script>
