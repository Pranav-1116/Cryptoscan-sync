[project]
name = "universal-vendor"
version = "0.1.0"
description = "ZELNX Universal Vendor Scanner — vendor-neutral crypto discovery across all vendor categories"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5.3",
    "pyyaml>=6.0.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
