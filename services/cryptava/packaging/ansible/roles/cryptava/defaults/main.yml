---
# Console the agents report to, and the CA that signs its certificate.
cryptava_server: "https://cryptoscan.bank.example"
cryptava_ca_file: ""
cryptava_estate: "default"
# Unique per host. The default gives e.g. mrdn-prod-dc1-swiftgw01.
cryptava_bank: "mrdn"
cryptava_environment: "prod"
cryptava_datacenter: "dc1"
cryptava_name: "{{ cryptava_bank }}-{{ cryptava_environment }}-{{ cryptava_datacenter }}-{{ inventory_hostname_short }}"
cryptava_owner: ""
cryptava_interval: 3600
cryptava_probe_listeners: true
cryptava_probe_exclude_ports: []
cryptava_cert_dirs: []
# Optional approved business mapping (TechBOM), e.g.
# cryptava_system: {name: "SWIFT Gateway", owner: "Payments Ops",
#                   applications: [{name: "Alliance Access", services: ["java", "nginx"]}]}
cryptava_system: {}
# Optional asset-register record from the CMDB (HBOM hardware identity + VBOM vendor
# contracts), written to /etc/cryptava/asset-record.json. Usually generated per host from
# a CMDB export, e.g.
# cryptava_asset_record:
#   source: "Meridian CMDB export"
#   hardware: {manufacturer: "Dell Technologies", model: "PowerEdge R750", serial_number: "7Q2K3X3",
#              asset_tag: "MRDN-DC1-000412", location: "DC1 / Rack 04 / U12", warranty_end: "2028-04-30"}
#   contracts:
#     - {vendor: "Dell Technologies", contract_id: "PSP-88213", support_level: "ProSupport Plus",
#        end: "2028-04-30", covers: ["Intel", "Broadcom"]}
#     - {vendor: "Red Hat", contract_id: "RH-9921", support_level: "Premium", end: "2027-01-31"}
cryptava_asset_record: {}
# Admin API key used only for enrolment (keep it in Ansible Vault). Never written to disk.
cryptava_provision_key: ""
# Where the agent source is on the control node.
cryptava_source: "{{ role_path }}/../../../../cryptava"
