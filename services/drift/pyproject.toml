[tool.poetry]
name = "cryptoscan-drift"
version = "1.0.0"
description = "CryptoScan drift detection service"
authors = ["CryptoScan Platform <platform@cryptoscan.local>"]
packages = [{ include = "drift" }]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.5.0"
structlog = "^23.2.0"
jinja2 = "^3.1.2"
cryptoscan-shared-models = { path = "../../shared/shared_models", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.1.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=drift --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
omit = ["tests/*"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"