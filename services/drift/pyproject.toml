[project]
name = "cryptoscan-drift"
version = "1.0.0"
description = "CryptoScan drift detection service"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.5.0", "structlog>=23.2.0", "jinja2>=3.1.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["drift*"]
