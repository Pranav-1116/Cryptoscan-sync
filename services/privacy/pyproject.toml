[project]
name = "cryptoscan-privacy"
version = "1.0.0"
description = "Privacy engine + unified scanner gate (least privilege, data minimization, redaction, 4-layer rate limits)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.5.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["privacy*"]
