# Scanner packaging/config supplement to pyproject.toml.
#
# pyproject.toml holds the PEP 621 metadata; this file carries the settings
# that tools still read from setup.cfg and keeps per-service overrides out of
# the repo root.

[flake8]
max-line-length = 120
extend-ignore = E203, W503
exclude =
    .venv,
    build,
    dist,
    jdt

# NOTE: pytest config lives in pyproject.toml ([tool.pytest.ini_options]) —
# pytest gives pyproject.toml precedence over setup.cfg, so it is not
# duplicated here.

[mypy]
python_version = 3.11
warn_unused_ignores = True
warn_redundant_casts = True
# CryptoScan is gradually typed; strictness ratchets up per-module below.
check_untyped_defs = True
plugins = pydantic.mypy

[mypy-scanner.*]
disallow_untyped_defs = False

[bumpversion]
current_version = 0.1.0
parse = (?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)
serialize = {major}.{minor}.{patch}
commit = True
tag = True
