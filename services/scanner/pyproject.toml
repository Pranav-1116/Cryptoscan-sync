[project]
name = "cryptoscan-scanner"
version = "0.1.0"
description = "Static Java source scanner for cryptographic API detection"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5.0",
    "gitpython>=3.1.40",
    "click>=8.1.7",
    "structlog>=24.1.0",
]

[project.scripts]
cryptoscan-scanner = "scanner.main:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scanner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
