[tool.poetry]
name = "cryptoscan-scanner"
version = "0.1.0"
description = "Static Java source code scanner for cryptographic API detection"
authors = ["CryptoScan Team"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.5.0"
gitpython = "^3.1.40"
click = "^8.1.7"
structlog = "^23.2.0"
jsonschema = "^4.20.0"
rich = "^13.7.0"

[tool.poetry.dev-dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
ruff = "^0.1.0"
mypy = "^1.7.0"

[tool.poetry.scripts]
cryptoscan-scanner = "scanner.main:cli"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --cov=scanner --cov-report=term-missing"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"