[project]
name = "cryptoscan-worker"
version = "0.1.0"
description = "CryptoScan scan job worker"
requires-python = ">=3.11"
dependencies = ["sqlalchemy>=2.0", "pydantic-settings>=2.1", "redis>=5.0"]

[project.scripts]
cryptoscan-worker = "worker.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["worker*"]
