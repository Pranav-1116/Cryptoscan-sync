rule_id: "QCB-002"
rule_name: "QCB — minimum TLS 1.2 for customer channels and remote access"
version: "1.0"
effective_date: "2026-09-26"
severity: "HIGH"
standard_reference: "Qatar Central Bank Technology Risk Circular — secure communication for e-banking, mobile payment (QMP) and remote access"
description: >
  Customer-facing channels, QMP wallet APIs, Fawran/Himyan connectivity and
  remote access in a QCB-supervised estate must use TLS 1.2 or 1.3.
condition:
  type: "COMPLEX"
  parameters:
    required_scopes:
      - "QCB"
      - "QA-QCB"
    required_scope_groups:
      - ["CUSTOMER-FACING", "REMOTE-ACCESS"]
    forbidden_algorithms:
      - "SSLv3"
      - "TLS1.0"
      - "TLS1.1"
evaluation:
  result_template: "FAIL"
  message_template: "Transport {algorithm} is below the TLS 1.2 floor required by QCB"
remediation: >
  Disable SSLv3 / TLS 1.0 / 1.1 on the endpoint, pin TLS 1.2 as the minimum
  (prefer 1.3) and re-scan so the new floor is captured in evidence.
enabled: true
