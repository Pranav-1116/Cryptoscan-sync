rule_id: "PDPPL-001"
rule_name: "Qatar PDPPL (Law 13/2016) — no broken algorithms on personal data"
version: "1.0"
effective_date: "2026-09-26"
severity: "CRITICAL"
standard_reference: "Qatar Law No. 13 of 2016 (Personal Data Privacy Protection Law), Arts. 8–13 — appropriate technical measures; NCGAA/CRA guidelines"
description: >
  A system processing personal data of individuals in Qatar (QID, CPR-like
  identifiers, KYC records) cannot rely on broken or deprecated algorithms.
  Scoped to the Qatari personal-data tags only — the generic PERSONAL_DATA
  tag never selects a jurisdiction on its own.
condition:
  type: "COMPLEX"
  parameters:
    required_scopes:
      - "PDPPL"
      - "QA-PDPPL-13-2016"
    forbidden_algorithms:
      - "DES"
      - "3DES"
      - "RC4"
      - "MD5"
      - "SHA-1"
      - "SHA1"
      - "SSLv3"
      - "TLS1.0"
      - "TLS1.1"
evaluation:
  result_template: "FAIL"
  message_template: "{algorithm} cannot protect personal data under Qatar PDPPL"
remediation: >
  Replace with AES-256 (GCM/CCM), SHA-256 or stronger and TLS 1.2/1.3; note
  the breach-notification duty to the competent department.
enabled: true
