rule_id: "QCB-001"
rule_name: "QCB — no broken or deprecated algorithms in supervised systems"
version: "1.0"
effective_date: "2026-09-26"
severity: "CRITICAL"
standard_reference: "Qatar Central Bank Technology Risk Circular (2018) and Information Security Standard — cryptographic controls aligned to ISO/IEC 27001 Annex A.10"
description: >
  Systems of a QCB-supervised institution (banks, PSPs, exchange houses)
  must not rely on broken or deprecated algorithms: DES, 3DES, RC4, MD5,
  SHA-1, SSLv3 and TLS below 1.2. Scoped to the QCB tag so a group with
  entities in several jurisdictions evaluates each under its own regulator.
condition:
  type: "COMPLEX"
  parameters:
    required_scopes:
      - "QCB"
      - "QA-QCB"
    forbidden_algorithms:
      - "DES"
      - "3DES"
      - "RC4"
      - "MD5"
      - "SHA-1"
      - "SHA1"
      - "SSLv3"
      - "TLS1.0"
      - "TLS1.1"
evaluation:
  result_template: "FAIL"
  message_template: "Algorithm {algorithm} is forbidden in QCB-supervised systems"
remediation: >
  Replace DES/3DES with AES-256-GCM, RC4 with ChaCha20-Poly1305 or AES-GCM,
  MD5/SHA-1 with SHA-256+, and lift transport to TLS 1.2/1.3.
enabled: true
