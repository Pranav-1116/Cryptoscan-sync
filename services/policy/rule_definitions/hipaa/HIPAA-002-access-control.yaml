rule_id: "HIPAA-002"
rule_name: "HIPAA Security Rule — access-control secrets must not use raw hashes"
version: "2.0"
effective_date: "2024-01-01"
severity: "HIGH"
standard_reference: "45 CFR 164.312(d) / 164.312(a)(2)(i)"
description: >
  Authentication material protecting ePHI must use a modern password KDF.
condition:
  type: "COMPLEX"
  parameters:
    required_scopes:
      - "HIPAA"
      - "EPHI"
    if_purpose:
      - "PASSWORD_HASHING"
    require_algorithms:
      - "PBKDF2"
      - "SCRYPT"
      - "BCRYPT"
      - "ARGON2"
      - "ARGON2ID"
evaluation:
  result_template: "FAIL"
  message_template: "HIPAA access control forbids raw hashes for authentication secrets"
remediation: >
  Store passwords with bcrypt, scrypt, Argon2, or PBKDF2 — never MD5 or a single SHA-256.
enabled: true
