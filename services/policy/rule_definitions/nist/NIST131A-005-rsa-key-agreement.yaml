rule_id: "NIST131A-005"
rule_name: "NIST SP 800-131A — RSA key agreement is disallowed"
version: "2.0"
effective_date: "2024-01-01"
severity: "HIGH"
standard_reference: "NIST SP 800-131A Rev. 2"
description: >
  RSA used as a key-agreement mechanism is disallowed. Prefer ECDH or a KEM.
condition:
  type: "COMPLEX"
  parameters:
    required_scopes:
      - "NIST-131A"
      - "NIST SP 800-131A"
      - "FIPS"
    if_purpose:
      - "KEY_AGREEMENT"
    forbidden_algorithms:
      - "RSA"
evaluation:
  result_template: "FAIL"
  message_template: "NIST SP 800-131A disallows RSA key agreement"
remediation: >
  Replace RSA key agreement with ECDH (P-256/P-384) or ML-KEM.
enabled: true
