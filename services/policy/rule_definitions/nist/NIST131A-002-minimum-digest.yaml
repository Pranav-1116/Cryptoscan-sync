rule_id: "NIST131A-002"
rule_name: "NIST SP 800-131A — SHA-1 and MD5 are disallowed"
version: "2.0"
effective_date: "2024-01-01"
severity: "HIGH"
standard_reference: "NIST SP 800-131A Rev. 2"
description: >
  MD5 and SHA-1 are not approved for digital signature generation or general hashing.
condition:
  type: "COMPLEX"
  parameters:
    required_scopes:
      - "NIST-131A"
      - "NIST SP 800-131A"
      - "FIPS"
    forbidden_algorithms:
      - "MD5"
      - "SHA-1"
      - "SHA1"
evaluation:
  result_template: "FAIL"
  message_template: "{algorithm} is not approved by NIST SP 800-131A"
remediation: >
  Use SHA-256, SHA-384, SHA-512, or SHA-3 family hashes.
enabled: true
