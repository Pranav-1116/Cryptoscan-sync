rule_id: "CBB-001"
rule_name: "CBB Rulebook — no broken or deprecated algorithms in licensee systems"
version: "1.0"
effective_date: "2026-09-26"
severity: "CRITICAL"
standard_reference: "Central Bank of Bahrain Rulebook Vol. 1 (Conventional Banks) / Vol. 2 (Islamic Banks) — Operational Risk Management, Module OM-5 Cyber Security (2021)"
description: >
  A CBB licensee's systems must not rely on broken or deprecated algorithms
  (DES, 3DES, RC4, MD5, SHA-1, SSLv3, TLS < 1.2). Scoped to the CBB tag.
condition:
  type: "COMPLEX"
  parameters:
    required_scopes:
      - "CBB"
      - "BH-CBB"
    forbidden_algorithms:
      - "DES"
      - "3DES"
      - "RC4"
      - "MD5"
      - "SHA-1"
      - "SHA1"
      - "SSLv3"
      - "TLS1.0"
      - "TLS1.1"
evaluation:
  result_template: "FAIL"
  message_template: "Algorithm {algorithm} is forbidden in CBB-licensed systems"
remediation: >
  Replace with AES-256-GCM / ChaCha20-Poly1305, SHA-256+, TLS 1.2/1.3.
enabled: true
