rule_id: "CBB-002"
rule_name: "CBB — minimum TLS 1.2 for customer channels, open banking and remote access"
version: "1.0"
effective_date: "2026-09-26"
severity: "HIGH"
standard_reference: "CBB Rulebook Module OM-5 Cyber Security; Bahrain Open Banking Framework (2020) — transport security (FAPI / mTLS)"
description: >
  Customer-facing channels, Bahrain OBF APIs, BENEFIT / Fawri+ connectivity
  and remote access must use TLS 1.2 or 1.3.
condition:
  type: "COMPLEX"
  parameters:
    required_scopes:
      - "CBB"
      - "BH-CBB"
    required_scope_groups:
      - ["CUSTOMER-FACING", "REMOTE-ACCESS", "OPEN-BANKING"]
    forbidden_algorithms:
      - "SSLv3"
      - "TLS1.0"
      - "TLS1.1"
evaluation:
  result_template: "FAIL"
  message_template: "Transport {algorithm} is below the TLS 1.2 floor required by CBB"
remediation: >
  Disable SSLv3 / TLS 1.0 / 1.1 on the endpoint, pin TLS 1.2 as the minimum
  (prefer 1.3) and re-scan so the new floor is captured in evidence.
enabled: true
