rule_id: "BHPDPL-001"
rule_name: "Bahrain PDPL (Law 30/2018) — no broken algorithms on personal data"
version: "1.0"
effective_date: "2026-09-26"
severity: "CRITICAL"
standard_reference: "Bahrain Law No. 30 of 2018 (Personal Data Protection Law), Art. 8 — technical and organisational measures; PDPA Authority guidance"
description: >
  A system processing personal data of individuals in Bahrain (CPR numbers,
  eKYC records) cannot rely on broken or deprecated algorithms. Scoped to the
  Bahraini personal-data tags only.
condition:
  type: "COMPLEX"
  parameters:
    required_scopes:
      - "BH-PDPL"
      - "BH-PDPL-30-2018"
    forbidden_algorithms:
      - "DES"
      - "3DES"
      - "RC4"
      - "MD5"
      - "SHA-1"
      - "SHA1"
      - "SSLv3"
      - "TLS1.0"
      - "TLS1.1"
evaluation:
  result_template: "FAIL"
  message_template: "{algorithm} cannot protect personal data under Bahrain PDPL Art. 8"
remediation: >
  Replace with AES-256 (GCM/CCM), SHA-256 or stronger and TLS 1.2/1.3.
enabled: true
