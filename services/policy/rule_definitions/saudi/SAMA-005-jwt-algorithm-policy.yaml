rule_id: "SAMA-005"
rule_name: "SAMA — JWT 'none' / SHA-1 HS1/RS1/ES1 algorithms forbidden on customer-facing APIs"
version: "1.0"
effective_date: "2026-09-26"
severity: "MEDIUM"
standard_reference: "SAMA Open Banking / API Security Guidelines; OAuth 2.0 Security BCP (RFC 9700)"
description: >
  Tokens used by customer-facing APIs must be signed with RS256/RS384/ES256/ES384/PS256
  (or HS256+ with rotated ≥256-bit secrets). The 'none' alg and HMAC/RSA/ECDSA
  with SHA-1 are forbidden.
condition:
  type: "ALGORITHM_IN_LIST"
  parameters:
    required_scopes:
      - "SAMA"
    required_scope_groups:
      - ["CUSTOMER-FACING"]
    algorithm_list:
      - "JWT-NONE"
      - "JWT-HS1"
      - "JWT-RS1"
      - "JWT-ES1"
evaluation:
  result_template: "FAIL"
  message_template: "JWT algorithm {algorithm} is forbidden for customer-facing APIs"
remediation: >
  Switch signing to ES256/ES384, RS256/PS256 or (minimum) HS256 with rotated ≥256-bit
  secrets; disable 'none' at the verifier.
enabled: true
