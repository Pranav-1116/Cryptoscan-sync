rule_id: "SAMASWIFT-001"
rule_name: "SWIFT CSCF v2024 — no legacy TLS or 3DES/RC4/MD5 on SWIFT interfaces (Alliance, SAG/SNL, LAU)"
version: "1.0"
effective_date: "2026-09-26"
severity: "CRITICAL"
standard_reference: "SWIFT Customer Security Controls Framework v2024 (CSCF) — Control 2.2 (Interfaces); SWIFT ISAE 3402"
description: >
  SWIFT Alliance Access/Entry, SAG/SNL, SWIFTNet Link, MQ-HA and Alliance
  Web Platform interfaces must use TLS 1.2+ with AEAD ciphers and RSA ≥ 2048.
  3DES/RC4/MD5/SHA-1/SL3, TLS 1.0/1.1, or DH-1024 on SWIFT zones are failures.
condition:
  type: "COMPLEX"
  parameters:
    required_scopes:
      - "SWIFT"
    forbidden_algorithms:
      - "DES"
      - "3DES"
      - "RC4"
      - "MD5"
      - "SHA-1"
      - "SSLv3"
      - "TLS1.0"
      - "TLS1.1"
      - "DH"
evaluation:
  result_template: "FAIL"
  message_template: "Forbidden {algorithm} on a SWIFT-scoped system (CSP v2024 control 2.2)"
remediation: >
  Align with SWIFT CSCF v2024: disable TLS 1.0/1.1 and weak ciphers on
  Alliance Gateway, Web Platform and SWIFTNet Link; rotate to RSA 2048+ or
  ECDSA certs; validate against the SWIFT Customer Security attestation.
enabled: true
