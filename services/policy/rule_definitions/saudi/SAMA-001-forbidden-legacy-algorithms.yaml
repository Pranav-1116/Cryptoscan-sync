rule_id: "SAMA-001"
rule_name: "SAMA Cybersecurity Framework — forbidden legacy cryptography"
version: "1.0"
effective_date: "2026-09-26"
severity: "CRITICAL"
standard_reference: "SAMA Cyber Security Framework (v3.1) — Domain 4 (Cybersecurity Technology & Operations), Control 4.3 (Cryptography); ISO/IEC 27001:2022 A.8.24 (Use of cryptography)"
description: >
  Banks, insurance companies, financing firms and payment service providers
  supervised by SAMA must not deploy broken or deprecated algorithms in
  production: DES/single-DES, 3DES (retired), RC4, MD5, SHA-1 for signing or
  integrity, and SSLv3 / TLS 1.0 / TLS 1.1 transport.
condition:
  type: "ALGORITHM_IN_LIST"
  parameters:
    required_scopes:
      - "SAMA"
    algorithm_list:
      - "DES"
      - "3DES"
      - "RC4"
      - "MD5"
      - "SHA-1"
      - "SHA1"
      - "SSLv3"
      - "TLS1.0"
      - "TLS1.1"
      - "DSA"
      - "DH"
evaluation:
  result_template: "FAIL"
  message_template: "Algorithm {algorithm} is forbidden under SAMA CSF cryptographic controls"
remediation: >
  Replace DES/3DES with AES-256-GCM or ChaCha20-Poly1305, RC4 with AES-GCM/ChaCha20-Poly1305,
  MD5/SHA-1 signatures with SHA-256/SHA-384, DSA with ECDSA-P256/P-384 or RSA-PSS,
  DH with ECDHE (P-256/X25519), and move all TLS endpoints to TLS 1.2 minimum (prefer 1.3).
enabled: true
