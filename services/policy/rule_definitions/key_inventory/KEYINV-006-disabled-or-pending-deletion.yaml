rule_id: "KEYINV-006"
rule_name: "Disabled, archived or pending-deletion key still referenced"
version: "1.0"
effective_date: "2026-01-01"
severity: "LOW"
standard_reference: "NIST SP 800-57 Part 1 §7 (key states)"
description: >
  Advisory: the key is in a non-active state (Disabled / ARCHIVED / PendingDeletion / NOTRUST). Applications
  that still reference it will fail at the next rotation or deletion date.
condition:
  type: "KEY_INVENTORY_ATTRIBUTE"
  parameters:
    attribute: "state"
    operator: "in"
    values: ["Disabled", "ARCHIVED", "PendingDeletion", "NOTRUST", "INACTIVE", "DESTROYED", "DESTROY_SCHEDULED"]
    result: "WARN"
evaluation:
  result_template: "WARN"
  message_template: "{key_label} is in state {state}"
remediation: >
  Cross-check consumers in the key-reconciliation report; either re-enable with a documented reason or remove
  the references before the deletion date.
enabled: true
