rule_id: "KEYINV-002"
rule_name: "TR-31 key block version A (key variant binding)"
version: "1.0"
effective_date: "2026-01-01"
severity: "HIGH"
standard_reference: "ANSI X9.143 (TR-31), PCI PIN 18-3 requirement 18-3"
description: >
  Key block version A binds usage with a key-variant method that PCI PIN phases out; versions B (TDEA
  key derivation) or D (AES key derivation) are required for new keys and for all keys after the PCI PIN deadline.
condition:
  type: "KEY_INVENTORY_ATTRIBUTE"
  parameters:
    attribute: "key_block_version"
    operator: "contains"
    value: "TR-31 A"
    result: "FAIL"
evaluation:
  result_template: "FAIL"
  message_template: "Key {key_label} uses TR-31 version A"
remediation: >
  Re-wrap the key under a version D (preferred) or B key block on the payment HSM; retire the variant-bound copy.
enabled: true
