rule_id: "KEYINV-001"
rule_name: "Exportable / extractable HSM keys"
version: "1.0"
effective_date: "2026-01-01"
severity: "HIGH"
standard_reference: "PCI PIN 18-3, PCI DSS 4.0 3.6 / 3.7, NIST SP 800-57 Part 1 §6.2"
description: >
  Keys marked exportable / extractable in an HSM or KMS export can leave the hardware boundary.
  Only key-encryption keys under a documented split-knowledge ceremony may be exportable.
condition:
  type: "KEY_INVENTORY_ATTRIBUTE"
  parameters:
    attribute: "exportability"
    operator: "in"
    values: ["sensitive (exportable under any KEK)", "exportable under trusted key", "exportable", "yes", "true"]
    result: "FAIL"
evaluation:
  result_template: "FAIL"
  message_template: "Key {key_label} is exportable"
remediation: >
  Re-generate the key as non-exportable (ICSF: NOEXPORT / KEY-BLOCK export prohibited; Luna: CKA_EXTRACTABLE=0;
  KMS: origin AWS_KMS with no key material export). Track the exception if a KEK ceremony requires export.
enabled: true
