rule_id: "KEYINV-004"
rule_name: "Key or certificate expires within 90 days"
version: "1.0"
effective_date: "2026-01-01"
severity: "MEDIUM"
standard_reference: "NIST SP 800-57 Part 1 §5.3, internal certificate lifecycle standard"
description: >
  Advisory: material listed in an inventory export reaches not_after within the next 90 days.
condition:
  type: "KEY_INVENTORY_ATTRIBUTE"
  parameters:
    attribute: "not_after"
    operator: "date_within_days"
    days: 90
    result: "WARN"
evaluation:
  result_template: "WARN"
  message_template: "{key_label} expires within 90 days"
remediation: >
  Schedule renewal through the certificate lifecycle workflow (Certificates → renewal queue) and re-import.
enabled: true
