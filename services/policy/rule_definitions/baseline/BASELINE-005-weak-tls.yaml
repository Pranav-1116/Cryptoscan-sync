rule_id: "BASELINE-005"
rule_name: "Minimum TLS Version"
version: "1.0"
effective_date: "2024-01-01"
severity: "HIGH"
standard_reference: "NIST SP 800-52 Rev. 2 / Internal Baseline"
description: >
  TLS 1.0, TLS 1.1 and SSLv3 are forbidden for production endpoints.
  Require TLS 1.2 as a floor and prefer TLS 1.3.
condition:
  type: "ALGORITHM_IN_LIST"
  parameters:
    algorithm_list:
      - "SSLv3"
      - "TLS1.0"
      - "TLS1.1"
evaluation:
  result_template: "FAIL"
  message_template: "Protocol {algorithm} is below the TLS 1.2 minimum"
remediation: >
  Disable SSLv3 / TLS 1.0 / TLS 1.1 on load balancers, Ingress, and
  application TLS configs. Prefer TLS 1.3 with AES-256-GCM or ChaCha20-Poly1305.
enabled: true
