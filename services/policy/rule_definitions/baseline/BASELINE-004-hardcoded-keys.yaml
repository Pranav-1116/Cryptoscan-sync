rule_id: "BASELINE-004"
rule_name: "Hardcoded Cryptographic Keys"
version: "1.0"
effective_date: "2024-01-01"
severity: "CRITICAL"
standard_reference: "OWASP A02 / Internal Baseline"
description: "Cryptographic keys must never be hardcoded in source."
condition:
  type: "BOOLEAN_FLAG"
  parameters:
    field: "is_hardcoded_key"
    forbidden_value: true
evaluation:
  result_template: "FAIL"
  message_template: "Hardcoded cryptographic key detected"
remediation: "Move the key to a secrets manager or KMS (AWS KMS, Azure Key Vault, HashiCorp Vault) and load it at runtime."
enabled: true
