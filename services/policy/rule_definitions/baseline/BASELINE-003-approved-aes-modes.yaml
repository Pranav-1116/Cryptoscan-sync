rule_id: "BASELINE-003"
rule_name: "Approved AES Modes"
version: "1.0"
effective_date: "2024-01-01"
severity: "HIGH"
standard_reference: "NIST SP 800-38D / Internal Baseline"
description: "AES must use an AEAD or stream-safe mode. ECB is forbidden. CBC is discouraged."
condition:
  type: "ALGORITHM_MODE_WHITELIST"
  parameters:
    algorithm: "AES"
    approved_modes: ["GCM", "CCM", "CTR"]
    forbidden_modes: ["ECB", "CBC"]
evaluation:
  result_template: "FAIL"
  message_template: "AES mode {mode} is not approved"
remediation: "Use AES-256-GCM (preferred) or AES-CTR / AES-CCM. Do not use ECB. Avoid CBC for new code."
enabled: true
