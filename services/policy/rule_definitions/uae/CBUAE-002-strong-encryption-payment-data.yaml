rule_id: "CBUAE-002"
rule_name: "CBUAE — strong authenticated encryption for payment/card data"
version: "1.0"
effective_date: "2026-09-20"
severity: "HIGH"
standard_reference: "CBUAE Cybersecurity Framework — Domain 6 (Data & Information Protection); CBUAE payment-system security expectations (PCI DSS / SWIFT CSP interplay)"
description: >
  Encryption of payment-system and card data must use an approved algorithm
  with an authenticated mode and keys of at least 256 bits, consistent with
  the strong-cryptography expectations CBUAE examiners apply alongside PCI
  DSS and SWIFT CSP for UAE payment systems.
condition:
  type: "COMPLEX"
  parameters:
    required_scopes:
      - "CBUAE"
      - "PAYMENT"
      - "CARD"
      - "SWIFT"
    if_purpose:
      - "ENCRYPTION"
      - "DECRYPTION"
    require_algorithms:
      - "AES"
      - "CHACHA20"
      - "CHACHA20-POLY1305"
    require_modes:
      - "GCM"
      - "CCM"
      - "CTR"
      - "POLY1305"
    mode_required: true
    min_key_size: 256
evaluation:
  result_template: "FAIL"
  message_template: "Payment-data protection must use AES-256-GCM/CCM or ChaCha20-Poly1305 (got {algorithm} {mode}, key {key_size})"
remediation: >
  Re-key the data path with AES-256 in GCM (or CCM), or ChaCha20-Poly1305;
  update the payment gateway configuration and re-run the evidence scan to
  refresh the inventory.
enabled: true
