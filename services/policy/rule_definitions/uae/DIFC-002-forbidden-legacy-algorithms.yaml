rule_id: "DIFC-002"
rule_name: "DIFC DP Law 5/2020 — no broken algorithms in personal-data processing"
version: "1.0"
effective_date: "2026-09-20"
severity: "CRITICAL"
standard_reference: "DIFC Data Protection Law No. 5 of 2020, Art. 23 (highest standard of information security appropriate to the risk)"
description: >
  Broken or deprecated algorithms (DES, 3DES, RC4, MD5, SHA-1, SSLv3,
  TLS < 1.2) cannot meet the security standard Art. 23 requires of personal
  data processing in the DIFC, and are failing controls in any such system.
condition:
  type: "COMPLEX"
  parameters:
    required_scopes:
      - "DIFC"
      - "DIFC-DPL-5-2020"
    forbidden_algorithms:
      - "DES"
      - "3DES"
      - "RC4"
      - "MD5"
      - "SHA-1"
      - "SHA1"
      - "SSLv3"
      - "TLS1.0"
      - "TLS1.1"
evaluation:
  result_template: "FAIL"
  message_template: "{algorithm} cannot protect personal data under DIFC Art. 23"
remediation: >
  Replace with AES-256 (GCM/CCM), SHA-256 or stronger, and TLS 1.2/1.3.
  Because the DIFC carries a private right of action (since July 2025),
  remediate before the next breach window and keep the scan evidence.
enabled: true
