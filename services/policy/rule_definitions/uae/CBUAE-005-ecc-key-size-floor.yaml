rule_id: "CBUAE-005"
rule_name: "CBUAE — ECC/DH key-size floor (256 bits)"
version: "1.0"
effective_date: "2026-09-20"
severity: "HIGH"
standard_reference: "CBUAE Information Security Standards (ISO/IEC 27001-aligned cryptographic baselines); NIST SP 800-131A transition"
description: >
  Elliptic-curve and Diffie-Hellman parameters in a CBUAE-supervised estate
  must provide at least 256 bits of security level; curves and groups below
  that (e.g. P-192, 1024-bit DH) are failing controls.
condition:
  type: "COMPLEX"
  parameters:
    required_scopes:
      - "CBUAE"
    if_algorithms:
      - "ECC"
      - "ECDSA"
      - "ECDH"
      - "EC"
      - "DH"
    min_key_size: 256
evaluation:
  result_template: "FAIL"
  message_template: "{algorithm} at {key_size} bits is below the 256-bit security floor"
remediation: >
  Migrate to P-256 or larger (X25519 for transport key agreement), re-issue
  certificates/parameters, and note the post-quantum path (hybrid X25519MLKEM)
  in the migration roadmap.
enabled: true
