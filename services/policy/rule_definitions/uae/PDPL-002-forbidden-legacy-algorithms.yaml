rule_id: "PDPL-002"
rule_name: "UAE Federal PDPL Art. 20 — no broken algorithms in personal-data processing"
version: "1.0"
effective_date: "2026-09-20"
severity: "CRITICAL"
standard_reference: "UAE Federal Decree-Law No. 45 of 2021 (Personal Data Protection Law), Art. 20 — technical measures; breach exposure Art. 9 (72h notification per UAE Data Office guidance)"
description: >
  A system handling UAE residents' personal data cannot rely on broken or
  deprecated algorithms (DES, 3DES, RC4, MD5, SHA-1, SSLv3, TLS < 1.2).
  Because breaches must be notified to the UAE Data Office within 72 hours
  and carry fines up to AED 5 million, failing cryptography on personal data
  is a critical control breach.
condition:
  type: "COMPLEX"
  parameters:
    required_scopes:
      - "PDPL"
      - "PERSONAL_DATA"
      - "UAE-PDPL-45-2021"
    forbidden_algorithms:
      - "DES"
      - "3DES"
      - "RC4"
      - "MD5"
      - "SHA-1"
      - "SHA1"
      - "SSLv3"
      - "TLS1.0"
      - "TLS1.1"
evaluation:
  result_template: "FAIL"
  message_template: "{algorithm} cannot protect personal data under PDPL Art. 20"
remediation: >
  Replace with AES-256 (GCM/CCM), SHA-256 or stronger, and TLS 1.2/1.3;
  validate the 72-hour breach-notification runbook against the new controls.
enabled: true
