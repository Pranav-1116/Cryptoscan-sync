rule_id: "CBUAE-001"
rule_name: "CBUAE — forbidden legacy cryptography in supervised estate"
version: "1.0"
effective_date: "2026-09-20"
severity: "CRITICAL"
standard_reference: "CBUAE Cybersecurity Framework — Domain 6 (Data & Information Protection); CBUAE Information Security Standards (ISO/IEC 27001-aligned)"
description: >
  Licensed banks, exchange houses, finance companies and payment service
  providers must not use broken or deprecated algorithms in estate systems.
  DES, 3DES, RC4, MD5, SHA-1 and TLS < 1.2 do not meet the CBUAE
  information-security standard expectations (aligned to ISO/IEC 27001
  cryptographic baselines).
condition:
  type: "ALGORITHM_IN_LIST"
  parameters:
    algorithm_list:
      - "DES"
      - "3DES"
      - "RC4"
      - "MD5"
      - "SHA-1"
      - "SHA1"
      - "SSLv3"
      - "TLS1.0"
      - "TLS1.1"
evaluation:
  result_template: "FAIL"
  message_template: "Algorithm {algorithm} is forbidden in CBUAE-supervised systems"
remediation: >
  Replace DES/3DES with AES-256-GCM (or CCM), RC4 with ChaCha20-Poly1305 or
  AES-GCM, MD5/SHA-1 with SHA-256 or stronger, and renegotiate transport to
  TLS 1.2/1.3. Record the retirement in the technology-risk register.
enabled: true
