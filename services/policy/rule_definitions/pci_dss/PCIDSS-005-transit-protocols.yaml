rule_id: "PCIDSS-005"
rule_name: "PCI-DSS 4.0 — SSLv3 / TLS 1.0 / TLS 1.1 are forbidden in transit"
version: "2.0"
effective_date: "2024-01-01"
severity: "CRITICAL"
standard_reference: "PCI-DSS 4.0 req. 4.2.1"
description: >
  Cardholder data in transit must not use SSLv3, TLS 1.0, or TLS 1.1.
condition:
  type: "COMPLEX"
  parameters:
    required_scopes:
      - "PCI-DSS"
      - "PCI-DSS-4.0"
      - "PAN"
    if_purpose:
      - "KEY_EXCHANGE"
      - "ENCRYPTION"
    forbidden_algorithms:
      - "SSL"
      - "SSLV3"
      - "TLS1.0"
      - "TLS1.1"
      - "TLS-1.0"
      - "TLS-1.1"
evaluation:
  result_template: "FAIL"
  message_template: "PCI-DSS 4.2.1 forbids {algorithm} for data in transit"
remediation: >
  Disable SSLv3/TLS 1.0/1.1 and require TLS 1.2 or TLS 1.3 with modern ciphers.
enabled: true
