rule_id: "PCIDSS-002"
rule_name: "PCI-DSS 4.0 — strong encryption for stored/transmitted PAN"
version: "2.0"
effective_date: "2024-01-01"
severity: "HIGH"
standard_reference: "PCI-DSS 4.0 req. 3.5.1 / 4.2.1"
description: >
  Encryption of cardholder data must use AES with an authenticated mode and at least 256-bit keys.
condition:
  type: "COMPLEX"
  parameters:
    required_scopes:
      - "PCI-DSS"
      - "PCI-DSS-4.0"
      - "PAN"
    if_purpose:
      - "ENCRYPTION"
      - "DECRYPTION"
    require_algorithms:
      - "AES"
      - "CHACHA20"
      - "CHACHA20-POLY1305"
    require_modes:
      - "GCM"
      - "CCM"
    mode_required: true
    min_key_size: 256
evaluation:
  result_template: "FAIL"
  message_template: "PCI-DSS requires AES-256-GCM/CCM (or ChaCha20-Poly1305) for PAN encryption"
remediation: >
  Configure AES-256-GCM (or CCM) with a unique nonce per encryption and managed key storage.
enabled: true
