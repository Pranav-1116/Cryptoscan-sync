[project]
name = "cryptoscan-policy"
version = "1.0.0"
description = "Deterministic cryptographic policy engine"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.5.0", "pyyaml>=6.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["policy*"]
