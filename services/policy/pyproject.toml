[tool.poetry]
name = "cryptoscan-policy"
version = "1.0.0"
description = "Policy engine for cryptographic compliance evaluation"
authors = ["CryptoScan Team <team@cryptoscan.dev>"]
license = "Apache-2.0"

[tool.poetry.dependencies]
python = "^3.10"
pydantic = "^2.0"
pydantic-settings = "^2.0"
pyyaml = "^6.0"
python-dotenv = "^1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"
pytest-cov = "^4.0"
pytest-asyncio = "^0.20"
black = "^23.0"
isort = "^5.12"
mypy = "^1.0"
pylint = "^2.16"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--cov=policy --cov-report=html --cov-report=term"