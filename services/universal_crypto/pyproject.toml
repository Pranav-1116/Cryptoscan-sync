[project]
name = "universal-crypto"
version = "0.1.0"
description = "ZELNX Universal Cryptography Scanner — deterministic crypto discovery, evidence fusion, PQC readiness, live CBOM"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5.3",
    "pyyaml>=6.0.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
