[project]
name = "cryptoscan-database"
version = "0.1.0"
description = "CryptoScan database models, migrations, and repositories"
requires-python = ">=3.11"
dependencies = ["sqlalchemy>=2.0.25", "alembic>=1.13.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["db*", "database*"]
