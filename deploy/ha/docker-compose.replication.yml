# Postgres streaming replication overlay — RPO ≈ 0 (async), RTO = promote (~seconds).
#
#   docker compose -f docker-compose.yml -f docker-compose.replication.yml up -d
#
# Primary archives WAL; replica streams it and can be promoted by
# `./promote-replica.sh` when the primary is lost. Not executable in every
# environment (needs Docker): syntax-verified, promotion rehearsed in the
# quarterly drill (drill.sh).

services:
  postgres:
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=5
      - -c
      - archive_mode=on
      - -c
      - archive_command=/bin/true   # replace with 'cp %p /wal_archive/%f' backed by object storage for PITR
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./pg-primary/init.sql:/docker-entrypoint-initdb.d/10-replication.sql:ro

  postgres-replica:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cryptoscan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: cryptoscan
      PRIMARY_HOST: postgres
    volumes:
      - pgrepl:/var/lib/postgresql/data
      - ./pg-replica/clone.sh:/docker-entrypoint-initdb.d/10-clone.sh:ro
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryptoscan && ps aux | grep -q '[w]al_receiver'"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgrepl:
