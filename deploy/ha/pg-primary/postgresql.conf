# CryptoScan PostgreSQL operations profile — WAL, PITR, autovacuum.
#
# Mounted into the primary (docker-compose.yml: postgres -c config_file=...).
# Every setting here answers one of the operational requirements, and the
# invariant tests (scripts/tests/test_postgres_ops_config.py) pin them:
# a config that drifts back to defaults fails the suite, not the bank.

# ── WAL management ──────────────────────────────────────────────────────
# replica: WAL shipping for streaming replicas AND archiving for PITR.
# minimal would break both; this is the floor, not a tuning preference.
wal_level = replica
max_wal_senders = 5
max_wal_size = 2GB
min_wal_size = 1GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9

# ── Point-in-time recovery ──────────────────────────────────────────────
# Every WAL segment older than the keep window lands in the archive; the
# restore drill (pg-backup/restore-drill.sh) replays it to recovery_target_time.
# The archive lives on the backup volume — off the data directory, so losing
# the data volume never loses the archive with it.
archive_mode = on
archive_command = 'mkdir -p /pgbackup/archive && test ! -f /pgbackup/archive/%f && cp %p /pgbackup/archive/%f'
archive_timeout = 300

# ── Vacuum / autovacuum ─────────────────────────────────────────────────
# CryptoScan collects continuously: autovacuum must keep up with ingest,
# not run on PostgreSQL's table-size heuristics alone. Scale factors are
# aggressive (evidence tables churn), work_mem-bounded, and never off.
autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.02
autovacuum_analyze_scale_factor = 0.01
autovacuum_vacuum_cost_limit = 2000

# ── Query visibility (the EXPLAIN audit's production half) ──────────────
# A query slow enough to matter shows up in the log with its duration.
log_min_duration_statement = 1000
