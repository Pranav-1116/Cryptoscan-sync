# CryptoScan edge: TLS termination, least-conn LB, defense-in-depth headers.

upstream cryptoscan_api {
    least_conn;
    server api:8000 max_fails=3 fail_timeout=15s;
    keepalive 32;
}

# HTTP -> HTTPS redirect (certs mounted at /etc/nginx/certs)
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # mTLS for internal SOC access: issue client certs and uncomment
    # ssl_client_certificate /etc/nginx/certs/ca.pem;
    # ssl_verify_client on;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    client_max_body_size 25m;   # CBOM/report uploads and HSM audit batches

    location / {
        proxy_pass http://cryptoscan_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;   # synchronous scan-now probes can take a while
    }

    location /api/v1/payment-crypto/ {
        # payment key inventory: SOC networks only (example allow-list)
        # allow 10.0.0.0/8; deny all;
        proxy_pass http://cryptoscan_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
