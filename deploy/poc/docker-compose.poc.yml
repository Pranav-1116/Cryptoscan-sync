# CryptoScan PoC stack — two containers, one volume, no cloud dependency.
#
# Scope: the fixed two-week proof of concept (docs/proposals/fab-poc.md).
# The full production stack (Postgres/Redis/Neo4j/worker) lives in the root
# docker-compose.yml — the PoC runs the API on SQLite inside a mounted
# volume so every byte stays inside the bank's tenancy and can be exported
# (or shredded) at the end of the engagement.
#
#   cp poc.env.example poc.env   # fill in the two secrets
#   docker compose -f docker-compose.poc.yml --env-file poc.env up -d --build
#   open http://localhost:8080   (admin / $ADMIN_PASSWORD — change it first)
#
# Nothing here phones home: no telemetry endpoint, no image pulls at runtime
# beyond the build, air-gap notes in docs/admin-guide/air-gap-install.md.

services:
  api:
    build:
      context: ..
      dockerfile: .docker/api/Dockerfile
    container_name: cryptoscan-poc-api
    environment:
      ENVIRONMENT: development
      ALLOW_SQLITE: "true"
      DATABASE_URL: sqlite:////data/techbom-poc.db
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY (min 32 chars) in poc.env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in poc.env}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-poc-webhook-secret-not-used-012345}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOW_ORIGINS: ${ALLOW_ORIGINS:-*}
      CRYPTOSCAN_HOME: /data/home
      CRYPTOSCAN_SNAPSHOT_DIR: /data/snapshots
      CRYPTOSCAN_TELECOM_REGISTRY: /data/telecom_registry.json
      # SSO (optional — off until OIDC_ISSUER is set; see docs/enterprise-readiness.md)
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      # ITSM/SIEM delivery (optional — off until these are set)
      SERVICENOW_INSTANCE_URL: ${SERVICENOW_INSTANCE_URL:-}
      SPLUNK_HEC_URL: ${SPLUNK_HEC_URL:-}
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      SENTINEL_WORKSPACE_ID: ${SENTINEL_WORKSPACE_ID:-}
    volumes:
      - poc_data:/data                     # DB + snapshots + telecom registry
      - ${TELECOM_REGISTRY_HOST_PATH:-./telecom_registry.json}:/data/telecom_registry.json:ro
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # OPTIONAL continuous monitoring: `docker compose -f docker-compose.poc.yml
  # --profile continuous ... up -d` adds the 24/7 daemon — it re-probes NETWORK
  # and TELECOM (5GC/roaming) targets on interval and writes passes to the same
  # snapshot volume the API serves. Off by default: the two-container PoC
  # footprint stays exactly as proposed.
  monitor:
    build:
      context: ..
      dockerfile: .docker/worker/Dockerfile
    container_name: cryptoscan-poc-monitor
    command: ["python", "scripts/run_monitor.py"]
    profiles: ["continuous"]
    environment:
      ENVIRONMENT: development
      ALLOW_SQLITE: "true"
      DATABASE_URL: sqlite:////data/techbom-poc.db
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY (min 32 chars) in poc.env}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-poc-webhook-secret-not-used-012345}
      CRYPTOSCAN_HOME: /data/home
      CRYPTOSCAN_SNAPSHOT_DIR: /data/snapshots
      CRYPTOSCAN_TELECOM_REGISTRY: /data/telecom_registry.json
      MONITOR_TICK_SECONDS: ${MONITOR_TICK_SECONDS:-30}
    volumes:
      - poc_data:/data
      - ${TELECOM_REGISTRY_HOST_PATH:-./telecom_registry.json}:/data/telecom_registry.json:ro
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  dashboard:
    build:
      context: ..
      dockerfile: .docker/dashboard/Dockerfile
    container_name: cryptoscan-poc-dashboard
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${DASHBOARD_PORT:-3000}:80"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  poc_data:
