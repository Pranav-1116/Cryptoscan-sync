# CryptoScan Helm Values — Real Product, Production Ready
# Deterministic, No AI, Fully Auditable

replicaCount: 3

image:
  repository: cryptoscan/api
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001

service:
  type: ClusterIP
  port: 8010

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: cryptoscan.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: cryptoscan-tls
      hosts:
        - cryptoscan.example.com

resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      podAffinityTerm:
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: cryptoscan
        topologyKey: kubernetes.io/hostname

# Probes — real product
livenessProbe:
  httpGet:
    path: /healthz
    port: 8010
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: 8010
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
  successThreshold: 1

# Postgres — real product with PITR
postgres:
  enabled: true
  image: postgres:15-alpine
  auth:
    username: cryptoscan
    database: cryptoscan
    existingSecret: cryptoscan-postgres-secret
  primary:
    persistence:
      enabled: true
      size: 100Gi
      storageClass: gp3
    resources:
      limits:
        cpu: 2000m
        memory: 4Gi
      requests:
        cpu: 500m
        memory: 1Gi
  backup:
    enabled: true
    cronjob:
      schedule: "0 2 * * *"
    pitr:
      enabled: true
      walSize: 10Gi

# Redis — real product with persistence for real-time
redis:
  enabled: true
  image: redis:7-alpine
  auth:
    enabled: true
    existingSecret: cryptoscan-redis-secret
  master:
    persistence:
      enabled: true
      size: 10Gi
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 256Mi
  replica:
    replicaCount: 2

# Neo4j — real product for graph
neo4j:
  enabled: true
  image: neo4j:5.26-community
  auth:
    existingSecret: cryptoscan-neo4j-secret
  core:
    persistence:
      enabled: true
      size: 50Gi
    resources:
      limits:
        cpu: 2000m
        memory: 4Gi
      requests:
        cpu: 500m
        memory: 1Gi

# Frontend — real product 296 pages real-time live
frontend:
  enabled: true
  replicaCount: 3
  image:
    repository: cryptoscan/frontend
    tag: latest
  service:
    port: 80
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

# Worker — real product with concurrent jobs
worker:
  enabled: true
  replicaCount: 2
  maxConcurrentJobs: 10
  resources:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 512Mi

# Monitoring — real product Prometheus Grafana Loki Jaeger
monitoring:
  prometheus:
    enabled: true
    retention: 30d
    storage: 50Gi
  grafana:
    enabled: true
    adminPassword: ""
    existingSecret: cryptoscan-grafana-secret
    dashboards:
      enabled: true
      p99_latency: true
      throughput: true
      error_rate: true
      realtime_connections: true
      cdt_simulations: true
  loki:
    enabled: true
    storage: 50Gi
  jaeger:
    enabled: true
    storage: 20Gi

# Security — real product
security:
  networkPolicy:
    enabled: true
    ingress:
      - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
        ports:
        - port: 8010
    egress:
      - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
        ports:
        - port: 5432
      - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
        ports:
        - port: 6379
      - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: neo4j
        ports:
        - port: 7687
  podDisruptionBudget:
    enabled: true
    minAvailable: 2
  secrets:
    # Fail-closed: no default secrets, must be provided
    postgres:
      name: cryptoscan-postgres-secret
      keys:
        postgres-password: ""
        password: ""
    redis:
      name: cryptoscan-redis-secret
      keys:
        password: ""
    neo4j:
      name: cryptoscan-neo4j-secret
      keys:
        neo4j-password: ""
    api:
      name: cryptoscan-api-secret
      keys:
        secret-key: ""
        report-signing-key: ""

# Real-time — real product
realtime:
  enabled: true
  backend: redis  # redis for prod, in-memory for dev
  p99_latency: "<500ms"
  throughput: "100K+ events/sec"
  exactly_once: true
  backpressure: "drop oldest on QueueFull"
  auto_reconnect: true
  history_replay: "last 10 deterministic"
  history_max: 1000
  event_bus_max: 10000

# CDT — real product first-mover genuine
cdt:
  enabled: true
  real_engine: true
  isolation:
    network: "separate namespace cdt-isolated no route to production"
    data: "own databases cdt_entities cdt_relationships cdt_snapshots cdt_simulations never shared"
    credentials: "own DB user, own KMS key, no prod secrets"
    code: "static analysis bans prod imports"
  lag_target: "<5s"
  deterministic: true
  no_ai: true
  layers: 7
  scenario_types: 10

# Production hardening — real product fail-closed
production:
  fail_closed: true
  weak_secrets: false
  plaintext_admin_passwords: false
  sqlite: false
  wildcard_cors: false
  rbac: true
  rate_limiting: true
  audit_worm: true
  backup_drill: true
  mTLS: false  # needs real infra
  WAF: false  # needs real infra
  DDoS: false  # needs real infra
