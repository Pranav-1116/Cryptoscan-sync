# Migration gate — every PR that touches the database layer must bring a FRESH
# database from empty to HEAD on real PostgreSQL (the production engine), not
# just SQLite. Catches bad revision chains, missing dependencies, and
# dialect-specific DDL before they reach a deploy.

name: db-migration

on:
  pull_request:
    paths:
      - "services/database/**"
      - ".github/workflows/db-migration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-migration-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_NO_CACHE_DIR: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  POSTGRES_USER: cryptoscan
  POSTGRES_PASSWORD: ci-postgres-password
  POSTGRES_DB: cryptoscan

jobs:
  migrate:
    name: alembic upgrade head (postgres 15)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: cryptoscan
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: cryptoscan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cryptoscan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build PYTHONPATH (all services + shared)
        run: |
          echo "PYTHONPATH=$(find services shared -mindepth 1 -maxdepth 1 -type d | tr '\n' ':')" >> "$GITHUB_ENV"
      - name: Upgrade empty database to head
        working-directory: services/database/migrations
        run: |
          python -m alembic -c alembic.ini upgrade head
        env:
          DATABASE_URL: postgresql://cryptoscan:ci-postgres-password@localhost:5432/cryptoscan
          ALLOW_SQLITE: "false"
      - name: Verify revision is head
        working-directory: services/database/migrations
        run: |
          python -m alembic -c alembic.ini current | tee /tmp/current.txt
          head_rev="$(python -m alembic -c alembic.ini heads | awk '{print $1}' | head -1)"
          grep -q "$head_rev" /tmp/current.txt || {
            echo "database is NOT at head revision ($head_rev)"; exit 1; }
        env:
          DATABASE_URL: postgresql://cryptoscan:ci-postgres-password@localhost:5432/cryptoscan
      - name: Re-run upgrade (idempotency)
        working-directory: services/database/migrations
        run: python -m alembic -c alembic.ini upgrade head
        env:
          DATABASE_URL: postgresql://cryptoscan:ci-postgres-password@localhost:5432/cryptoscan
      - name: Schema smoke — core tables exist
        run: |
          PGPASSWORD=ci-postgres-password psql -h localhost -U cryptoscan -d cryptoscan -tAc \
            "select count(*) from information_schema.tables where table_schema='public'" \
            | grep -qv '^0$'
          PGPASSWORD=ci-postgres-password psql -h localhost -U cryptoscan -d cryptoscan -tAc \
            "select table_name from information_schema.tables where table_schema='public' order by 1" \
            | head -40
