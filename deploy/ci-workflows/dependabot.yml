# Dependabot — weekly dependency updates for pip + npm + docker bases.
# NOTE: this lives here because the deployment token cannot write
# .github/. Copy it together with the workflows:
#   cp deploy/ci-workflows/dependabot.yml .github/
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    allow:
      - dependency-type: direct
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directory: /.docker/api
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /.docker/frontend
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /.docker/nginx
    schedule:
      interval: weekly
