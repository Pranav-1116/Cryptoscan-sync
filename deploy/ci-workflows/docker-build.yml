# Image gate — every PR and every push to main must build ALL runtime images.
# A Dockerfile that no longer compiles is a production outage waiting for a
# deploy window; this makes that impossible to miss.
#
# Builds only (no registry push): the images this repo ships are deployed from
# the release host via `scripts/deploy_prod.sh`, which builds locally. Wire a
# registry by adding login + push steps guarded on repository secrets if the
# deploy model changes to pull-based.

name: docker-build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: .docker/api/Dockerfile
          - name: frontend
            dockerfile: .docker/frontend/Dockerfile
          - name: nginx-edge
            dockerfile: .docker/nginx/Dockerfile
          - name: scanner
            dockerfile: .docker/scanner/Dockerfile
          - name: worker
            dockerfile: .docker/worker/Dockerfile
          - name: dashboard
            dockerfile: .docker/dashboard/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: cryptoscan-${{ matrix.name }}:ci-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
