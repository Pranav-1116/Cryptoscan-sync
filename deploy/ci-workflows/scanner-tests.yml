# Scanner-heavy suites — the slow, network-adjacent tests that would make the
# main ci.yml gate sluggish. Everything runs strictly OFFLINE: the CRYPTOSCAN_
# *_LIVE flags stay 0 so no scanner ever touches a real network target from CI.
#
# Runs on PRs that touch scanner code, on a nightly schedule (so latent
# breakage surfaces even without changes), and on demand.

name: scanner-tests

on:
  pull_request:
    paths:
      - "services/scanner/**"
      - "services/network_scanner/**"
      - "services/cloud_scanner/**"
      - "services/container_scanner/**"
      - "services/universal_vendor/**"
      - ".github/workflows/scanner-tests.yml"
  schedule:
    # 03:17 UTC daily — off the hour to avoid shared-runner congestion.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scanner-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_NO_CACHE_DIR: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  scanners:
    name: scanner / ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        service:
          - scanner
          - network_scanner
          - cloud_scanner
          - container_scanner
          - universal_vendor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build PYTHONPATH (all services + shared)
        run: |
          echo "PYTHONPATH=$(find services shared -mindepth 1 -maxdepth 1 -type d | tr '\n' ':')" >> "$GITHUB_ENV"
      - name: Pytest (${{ matrix.service }}) — offline
        run: python -m pytest services/${{ matrix.service }}/tests -q
        env:
          ENVIRONMENT: test
          GITHUB_WEBHOOK_SECRET: test-webhook-secret-abc123
          SECRET_KEY: test-secret-key-for-sessions-min-32-chars
          REDIS_URL: redis://localhost:6379/1
          # Hard offline: every live-scan capability disabled.
          CRYPTOSCAN_CVE_LIVE: "0"
          CRYPTOSCAN_TLS_LIVE: "0"
          CRYPTOSCAN_CLOUD_LIVE: "0"
          CRYPTOSCAN_CLOUD_SUBMIT: "0"
          CRYPTOSCAN_CBOM_SIGN: "0"
          CRYPTOSCAN_HOME: /tmp/cryptoscan-home
