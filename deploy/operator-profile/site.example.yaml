# INPUT TEMPLATE ONLY. Replace all REPLACE_* values with real reviewed site
# configuration and digest-pinned registry images. Never apply this file.
apiVersion: v1
kind: Namespace
metadata:
  name: cryptoscan
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cryptoscan-profile
  namespace: cryptoscan
data:
  ENVIRONMENT: production
  DOCS_ENABLED: "false"
  CORS_ORIGINS: "https://REPLACE_CONSOLE_HOST"
  TRUSTED_HOSTS: '["REPLACE_CONSOLE_HOST"]'
  CRYPTOSCAN_EXECUTION_CONTROLS: "true"
  CRYPTOSCAN_EXECUTION_REGION: REPLACE_REGION
  CRYPTOSCAN_EVIDENCE_REGION: REPLACE_REGION
  CRYPTOSCAN_EVIDENCE_DESTINATION: REPLACE_DESTINATION
  CRYPTOSCAN_STATIC_SCAN_MODE: container
  CRYPTOSCAN_SOURCE_ROOTS: /approved-source
  # Client-IP boundary: one ingress hop appends the address it observed, and
  # only peers inside the ingress controller's pod network may do so. Without
  # these two, api.security.client_ip falls back to the socket peer, which
  # behind an ingress is the controller — every login rate limit and API-key IP
  # allowlist would then collapse into one shared bucket.
  TRUSTED_PROXY_COUNT: "1"
  TRUSTED_PROXY_CIDRS: REPLACE_INGRESS_POD_CIDR
  # One bank, one organisation, one installation: an account the administrator
  # creates joins REPLACE_ORG_SLUG on first request at the read-only role,
  # recorded as actor onprem:auto-membership in the tenant provision log.
  ONPREM_SINGLE_ORG: "true"
  ONPREM_DEFAULT_ORG_SLUG: REPLACE_ORG_SLUG
  ONPREM_DEFAULT_ORG_NAME: REPLACE_ORG_NAME
  ONPREM_AUTO_MEMBERSHIP_ROLE: viewer
  REDIS_CA_CERTS: /site-ca/redis-ca.pem
  PGSSLROOTCERT: /site-ca/postgres-ca.pem
  SSL_CERT_FILE: /site-ca/organization-ca.pem
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cryptoscan-api
  namespace: cryptoscan
spec:
  # Two replicas with a rolling update that never dips below the count: one
  # node drain or pod restart is not an API outage (see the PodDisruptionBudget
  # at the end of this file).
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  minReadySeconds: 10
  selector:
    matchLabels: {app: cryptoscan-api}
  template:
    metadata:
      labels: {app: cryptoscan-api}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      # The API needs no Kubernetes API access.
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: REPLACE_REGISTRY/cryptoscan-api@sha256:REPLACE_ACTUAL_API_DIGEST
          ports: [{containerPort: 8010}]
          env:
            - {name: CRYPTOSCAN_DEPLOYMENT_PROFILE, value: "kubernetes-external-services/local-source-v1"}
            - {name: ENVIRONMENT, value: production}
            - {name: CRYPTOSCAN_EXECUTION_CONTROLS, value: "true"}
          envFrom:
            - configMapRef: {name: cryptoscan-profile}
            - secretRef: {name: cryptoscan-runtime}
          volumeMounts:
            - {name: site-ca, mountPath: /site-ca, readOnly: true}
            - {name: source, mountPath: /approved-source, readOnly: true}
            - {name: scratch, mountPath: /tmp}
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8010
              httpHeaders: [{name: Host, value: REPLACE_CONSOLE_HOST}]
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8010
              httpHeaders: [{name: Host, value: REPLACE_CONSOLE_HOST}]
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            # The image is built with PYTHONDONTWRITEBYTECODE=1 and the API's
            # only runtime writes go to /tmp (scratch, below), so the image
            # layer stays read-only: a compromised process cannot persist.
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      volumes:
        - name: site-ca
          secret: {secretName: cryptoscan-ca}
        - name: source
          persistentVolumeClaim: {claimName: approved-source}
        - name: scratch
          emptyDir: {sizeLimit: 512Mi}
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: cryptoscan}
spec:
  selector: {app: cryptoscan-api}
  ports: [{port: 8010, targetPort: 8010}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: cryptoscan-worker, namespace: cryptoscan}
spec:
  replicas: 1
  selector:
    matchLabels: {app: cryptoscan-worker}
  template:
    metadata:
      labels: {app: cryptoscan-worker}
    spec:
      # Dedicated, reviewed worker node. Docker daemon control is root-equivalent;
      # never share this node/runtime with untrusted tenants or expose it to parser.
      nodeSelector: {cryptoscan-isolation: dedicated}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        # Replace with the site's Docker socket GID; never chmod socket 666.
        supplementalGroups: [REPLACE_DOCKER_SOCKET_GID]
      containers:
        - name: worker
          # This site image MUST include the approved Docker CLI/runtime adapter.
          image: REPLACE_REGISTRY/cryptoscan-worker@sha256:REPLACE_ACTUAL_WORKER_DIGEST
          envFrom:
            - configMapRef: {name: cryptoscan-profile}
            - secretRef: {name: cryptoscan-runtime}
          env:
            - {name: CRYPTOSCAN_DEPLOYMENT_PROFILE, value: "kubernetes-external-services/local-source-v1"}
            - {name: ENVIRONMENT, value: production}
            - {name: CRYPTOSCAN_EXECUTION_CONTROLS, value: "true"}
            - {name: CRYPTOSCAN_SCANNER_IMAGE, value: "REPLACE_REGISTRY/cryptoscan-scanner@sha256:REPLACE_ACTUAL_PARSER_DIGEST"}
            - {name: WORKSPACE_BASE_PATH, value: /tmp/cryptoscan-workspaces}
            - {name: WORKSPACE_BASE, value: /tmp/cryptoscan-workspaces}
          volumeMounts:
            - {name: site-ca, mountPath: /site-ca, readOnly: true}
            - {name: source, mountPath: /approved-source, readOnly: true}
            - {name: staging, mountPath: /tmp/cryptoscan-workspaces}
            - {name: runtime, mountPath: /var/run/docker.sock}
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
      volumes:
        - name: site-ca
          secret: {secretName: cryptoscan-ca}
        - name: source
          persistentVolumeClaim: {claimName: approved-source}
        - name: staging
          hostPath: {path: /tmp/cryptoscan-workspaces, type: Directory}
        - name: runtime
          hostPath: {path: /var/run/docker.sock, type: Socket}
      terminationGracePeriodSeconds: 120
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: cryptoscan-frontend, namespace: cryptoscan}
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: cryptoscan-frontend}
  template:
    metadata:
      labels: {app: cryptoscan-frontend}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true}
      containers:
        - name: frontend
          image: REPLACE_REGISTRY/cryptoscan-frontend@sha256:REPLACE_ACTUAL_FRONTEND_DIGEST
          ports: [{containerPort: 3003}]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          readinessProbe:
            httpGet: {path: /, port: 3003}
          livenessProbe:
            httpGet: {path: /, port: 3003}
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata: {name: cryptoscan-frontend, namespace: cryptoscan}
spec:
  selector: {app: cryptoscan-frontend}
  ports: [{port: 3003, targetPort: 3003}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cryptoscan
  namespace: cryptoscan
  annotations:
    # TLS terminates at the ingress; the frontend/API speak plain HTTP on the
    # cluster network only.
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.2 TLSv1.3"
    nginx.ingress.kubernetes.io/hsts: "true"
    nginx.ingress.kubernetes.io/hsts-max-age: "31536000"
    nginx.ingress.kubernetes.io/hsts-include-subdomains: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: REPLACE_INGRESS_CLASS
  tls:
    - hosts: [REPLACE_CONSOLE_HOST]
      secretName: cryptoscan-ingress-tls
  rules:
    - host: REPLACE_CONSOLE_HOST
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cryptoscan-frontend
                port: {number: 3003}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: cryptoscan-api, namespace: cryptoscan}
spec:
  # A node drain during a cluster upgrade must leave one API pod serving; the
  # drain waits rather than taking the API offline.
  minAvailable: 1
  selector:
    matchLabels: {app: cryptoscan-api}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: cryptoscan-frontend, namespace: cryptoscan}
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: cryptoscan-frontend}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: cryptoscan-frontend-ingress, namespace: cryptoscan}
spec:
  # Only the ingress controller may reach the operator console. The API and
  # worker are not exposed here: nothing outside the cluster calls them.
  podSelector:
    matchLabels: {app: cryptoscan-frontend}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: REPLACE_INGRESS_NAMESPACE
      ports:
        - {protocol: TCP, port: 3003}
