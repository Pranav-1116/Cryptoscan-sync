# INPUT TEMPLATE ONLY. Replace all REPLACE_* values with real reviewed site
# configuration and digest-pinned registry images. Never apply this file.
apiVersion: v1
kind: Namespace
metadata:
  name: cryptoscan
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cryptoscan-profile
  namespace: cryptoscan
data:
  ENVIRONMENT: production
  DOCS_ENABLED: "false"
  CORS_ORIGINS: "https://REPLACE_CONSOLE_HOST"
  TRUSTED_HOSTS: '["REPLACE_CONSOLE_HOST"]'
  CRYPTOSCAN_EXECUTION_CONTROLS: "true"
  CRYPTOSCAN_EXECUTION_REGION: REPLACE_REGION
  CRYPTOSCAN_EVIDENCE_REGION: REPLACE_REGION
  CRYPTOSCAN_EVIDENCE_DESTINATION: REPLACE_DESTINATION
  CRYPTOSCAN_STATIC_SCAN_MODE: container
  CRYPTOSCAN_SOURCE_ROOTS: /approved-source
  REDIS_CA_CERTS: /site-ca/redis-ca.pem
  PGSSLROOTCERT: /site-ca/postgres-ca.pem
  SSL_CERT_FILE: /site-ca/organization-ca.pem
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cryptoscan-api
  namespace: cryptoscan
spec:
  replicas: 1
  selector:
    matchLabels: {app: cryptoscan-api}
  template:
    metadata:
      labels: {app: cryptoscan-api}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: api
          image: REPLACE_REGISTRY/cryptoscan-api@sha256:REPLACE_ACTUAL_API_DIGEST
          ports: [{containerPort: 8010}]
          env:
            - {name: CRYPTOSCAN_DEPLOYMENT_PROFILE, value: "kubernetes-external-services/local-source-v1"}
            - {name: ENVIRONMENT, value: production}
            - {name: CRYPTOSCAN_EXECUTION_CONTROLS, value: "true"}
          envFrom:
            - configMapRef: {name: cryptoscan-profile}
            - secretRef: {name: cryptoscan-runtime}
          volumeMounts:
            - {name: site-ca, mountPath: /site-ca, readOnly: true}
            - {name: source, mountPath: /approved-source, readOnly: true}
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8010
              httpHeaders: [{name: Host, value: REPLACE_CONSOLE_HOST}]
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8010
              httpHeaders: [{name: Host, value: REPLACE_CONSOLE_HOST}]
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
      volumes:
        - name: site-ca
          secret: {secretName: cryptoscan-ca}
        - name: source
          persistentVolumeClaim: {claimName: approved-source}
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: cryptoscan}
spec:
  selector: {app: cryptoscan-api}
  ports: [{port: 8010, targetPort: 8010}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: cryptoscan-worker, namespace: cryptoscan}
spec:
  replicas: 1
  selector:
    matchLabels: {app: cryptoscan-worker}
  template:
    metadata:
      labels: {app: cryptoscan-worker}
    spec:
      # Dedicated, reviewed worker node. Docker daemon control is root-equivalent;
      # never share this node/runtime with untrusted tenants or expose it to parser.
      nodeSelector: {cryptoscan-isolation: dedicated}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        # Replace with the site's Docker socket GID; never chmod socket 666.
        supplementalGroups: [REPLACE_DOCKER_SOCKET_GID]
      containers:
        - name: worker
          # This site image MUST include the approved Docker CLI/runtime adapter.
          image: REPLACE_REGISTRY/cryptoscan-worker@sha256:REPLACE_ACTUAL_WORKER_DIGEST
          envFrom:
            - configMapRef: {name: cryptoscan-profile}
            - secretRef: {name: cryptoscan-runtime}
          env:
            - {name: CRYPTOSCAN_DEPLOYMENT_PROFILE, value: "kubernetes-external-services/local-source-v1"}
            - {name: ENVIRONMENT, value: production}
            - {name: CRYPTOSCAN_EXECUTION_CONTROLS, value: "true"}
            - {name: CRYPTOSCAN_SCANNER_IMAGE, value: "REPLACE_REGISTRY/cryptoscan-scanner@sha256:REPLACE_ACTUAL_PARSER_DIGEST"}
            - {name: WORKSPACE_BASE_PATH, value: /tmp/cryptoscan-workspaces}
            - {name: WORKSPACE_BASE, value: /tmp/cryptoscan-workspaces}
          volumeMounts:
            - {name: site-ca, mountPath: /site-ca, readOnly: true}
            - {name: source, mountPath: /approved-source, readOnly: true}
            - {name: staging, mountPath: /tmp/cryptoscan-workspaces}
            - {name: runtime, mountPath: /var/run/docker.sock}
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
      volumes:
        - name: site-ca
          secret: {secretName: cryptoscan-ca}
        - name: source
          persistentVolumeClaim: {claimName: approved-source}
        - name: staging
          hostPath: {path: /tmp/cryptoscan-workspaces, type: Directory}
        - name: runtime
          hostPath: {path: /var/run/docker.sock, type: Socket}
      terminationGracePeriodSeconds: 120
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: cryptoscan-frontend, namespace: cryptoscan}
spec:
  replicas: 1
  selector:
    matchLabels: {app: cryptoscan-frontend}
  template:
    metadata:
      labels: {app: cryptoscan-frontend}
    spec:
      containers:
        - name: frontend
          image: REPLACE_REGISTRY/cryptoscan-frontend@sha256:REPLACE_ACTUAL_FRONTEND_DIGEST
          ports: [{containerPort: 3003}]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          readinessProbe:
            httpGet: {path: /, port: 3003}
---
apiVersion: v1
kind: Service
metadata: {name: cryptoscan-frontend, namespace: cryptoscan}
spec:
  selector: {app: cryptoscan-frontend}
  ports: [{port: 3003, targetPort: 3003}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: cryptoscan, namespace: cryptoscan}
spec:
  ingressClassName: REPLACE_INGRESS_CLASS
  tls:
    - hosts: [REPLACE_CONSOLE_HOST]
      secretName: cryptoscan-ingress-tls
  rules:
    - host: REPLACE_CONSOLE_HOST
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cryptoscan-frontend
                port: {number: 3003}
