# OpenTelemetry collector (the TRACING layer): API -> worker -> DB -> graph
# traces arrive over OTLP and are batched to the bank's APM/SIEM exporters.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
  memory_limiter:
    check_interval: 1s
    limit_mib: 256

exporters:
  # Metrics fan-out to Prometheus (scrapes this endpoint).
  prometheus:
    endpoint: 0.0.0.0:8889
  # Traces: the bank profile points otlphttp at its APM. The local profile
  # logs spans at debug level — configured here, never claimed as connected.
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
