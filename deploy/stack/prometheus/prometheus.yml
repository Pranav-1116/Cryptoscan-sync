# Prometheus scrape configuration (the METRICS layer).
# Scrapes the platform's own /metrics surfaces; add the bank's node-exporters
# and pushgateways in the environment profile.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

scrape_configs:
  - job_name: cryptoscan-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8010"]
  # The Redis-backed worker exposes no HTTP metrics listener; do not report a
  # fabricated worker target as scraped. Add one only when implemented.
  - job_name: cryptoscan-otel
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
