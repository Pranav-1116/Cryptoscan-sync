# Worker autoscaling: processing capacity follows demand.
#
# The honest scaling signal is the queue itself — pending job depth and
# refusal counts are exposed at GET /api/v1/binary/worker/status and, for
# controllers, at /metrics (cryptoscan_scan_queue_depth / _limit /
# _refused_total). CPU utilization below is the baseline trigger that
# works with no metrics adapter. The queue-driven form is
# 26-worker-keda.yaml (KEDA) — apply ONE of the two files, never both:
# two controllers fighting over one deployment is an outage with extra
# steps. The custom-metrics adapter wiring for a plain HPA variant is in
# deploy/stack/prometheus/adapter-snippet.yaml. min is
# kept at or below the deployment's static replicas so the HPA takes
# ownership without a scale-down cliff on adopt.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cryptoscan-worker
  namespace: cryptoscan
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cryptoscan-worker
  minReplicas: 2
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300   # never shed workers mid-scan
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0     # backlog is the emergency
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
