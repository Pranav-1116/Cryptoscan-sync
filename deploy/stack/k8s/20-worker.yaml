apiVersion: apps/v1
kind: Deployment
metadata:
  name: cryptoscan-worker
  namespace: cryptoscan
spec:
  replicas: 3
  selector:
    matchLabels: { app: cryptoscan-worker }
  template:
    metadata:
      labels: { app: cryptoscan-worker }
    spec:
      containers:
        - name: worker
          image: cryptoscan/worker:latest
          command: ["celery", "-A", "worker.app", "worker", "--loglevel=info"]
          envFrom:
            - configMapRef: { name: cryptoscan-stack }
            - secretRef: { name: cryptoscan-runtime }
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "2", memory: "2Gi" }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cryptoscan-gateway
  namespace: cryptoscan
spec:
  replicas: 2
  selector:
    matchLabels: { app: cryptoscan-gateway }
  template:
    metadata:
      labels: { app: cryptoscan-gateway }
    spec:
      containers:
        - name: envoy
          image: envoyproxy/envoy:v1.31.2
          args: ["-c", "/etc/envoy/envoy.yaml"]
          ports: [{ containerPort: 8443 }]
          volumeMounts:
            - { name: envoy-config, mountPath: /etc/envoy }
            - { name: gateway-certs, mountPath: /run/secrets/gateway, readOnly: true }
      volumes:
        - name: envoy-config
          configMap: { name: cryptoscan-envoy }
        - name: gateway-certs
          secret: { secretName: cryptoscan-gateway-tls }   # bank secret manager
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: cryptoscan
spec:
  selector: { app: cryptoscan-gateway }
  ports: [{ port: 443, targetPort: 8443 }]
