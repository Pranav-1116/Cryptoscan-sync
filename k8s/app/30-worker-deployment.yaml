apiVersion: apps/v1
kind: Deployment
metadata:
  name: cryptoscan-worker
  namespace: cryptoscan
  labels:
    app: cryptoscan-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cryptoscan-worker
  template:
    metadata:
      labels:
        app: cryptoscan-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      automountServiceAccountToken: false
      containers:
        - name: worker
          image: cryptoscan-worker:v1.0.0
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "worker.main"]
          envFrom:
            - configMapRef:
                name: cryptoscan-config
            - secretRef:
                name: cryptoscan-secrets
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: workspaces
              mountPath: /tmp/cryptoscan-workspaces
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: workspaces
          emptyDir:
            sizeLimit: 20Gi
      # Scans clone repos and can spike CPU; give the pod a generous termination
      # grace period so in-flight pipelines can finish.
      terminationGracePeriodSeconds: 120
