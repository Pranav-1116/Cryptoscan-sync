apiVersion: apps/v1
kind: Deployment
metadata:
  name: cryptoscan-api
  namespace: cryptoscan
  labels:
    app: cryptoscan-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cryptoscan-api
  template:
    metadata:
      labels:
        app: cryptoscan-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: api
          image: cryptoscan-api:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8010
              name: http
          envFrom:
            - configMapRef:
                name: cryptoscan-config
            - secretRef:
                name: cryptoscan-secrets
          # Readiness must answer the DEPENDENCY-aware probe: /health returns
          # 200 while the DB is down, so wiring it here kept a broken pod in
          # the Service's rotation. /readyz returns 503 during DB/dependency
          # failure — that is what "not ready to serve" means. Liveness stays
          # on the process-alive /healthz and never depends on the database:
          # a DB outage must remove pods from rotation, not restart them.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            # beyond the bounded DB probe inside /readyz so a slow-but-alive
            # dependency check is not scored a readiness failure
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false   # workspaces dir is written
            capabilities:
              drop: ["ALL"]
