# Template only — copy to 15-secret.yaml, fill real values, never commit the filled copy.
apiVersion: v1
kind: Secret
metadata:
  name: cryptoscan-secrets
  namespace: cryptoscan
type: Opaque
stringData:
  SECRET_KEY: "CHANGE-ME-openssl-rand-hex-32"
  ADMIN_USERNAME: "admin"
  # python3 scripts/hash_admin_password.py
  ADMIN_PASSWORD_HASH: ""
  GITHUB_WEBHOOK_SECRET: "CHANGE-ME-openssl-rand-hex-24"
  # Prometheus bearer token for /metrics; mount the same value as
  # /etc/prometheus/secrets/metrics_token in the Prometheus deployment.
  METRICS_TOKEN: "CHANGE-ME-openssl-rand-hex-32"
  # Alertmanager's bearer token for POST /api/v1/ops/alerts/alertmanager; mount
  # the same value as /etc/alertmanager/secrets/webhook_token in the Alertmanager
  # deployment. Without it production refuses to boot, because rules that
  # evaluate and reach nothing are a silent outage (guide 117).
  ALERTMANAGER_WEBHOOK_TOKEN: "CHANGE-ME-openssl-rand-hex-32"
  # Bank DBA-owned, non-superuser NOBYPASSRLS runtime role; never the migration owner.
  DATABASE_URL: "postgresql+psycopg2://cryptoscan_app:REPLACE_WITH_SECRET@postgres-host:5432/cryptoscan"
  # Bank-operated TLS Redis with ACL identity and a separately mounted trusted CA.
  REDIS_URL: "rediss://cryptoscan_acl:REPLACE_WITH_SECRET@redis-host:6379/0"
  NEO4J_PASSWORD: ""              # 24+ chars when NEO4J_URI is set
  # The production gate refuses to boot without these four: they authenticate
  # the registry webhook, the CBOM report signature, the realtime stream HMAC,
  # and the auditor-only compliance API.
  REGISTRY_WEBHOOK_SECRET: "CHANGE-ME-openssl-rand-hex-32"
  CBOM_SIGNING_SECRET: "CHANGE-ME-openssl-rand-hex-32"
  STREAM_SECRET: "CHANGE-ME-openssl-rand-hex-32"
  AUDITOR_API_KEY: "CHANGE-ME-openssl-rand-hex-32"
  # Rotation overlap: the PREVIOUS SECRET_KEY, comma-separated (max 3), so
  # sessions signed before a rotation keep verifying. Output of
  # scripts/rotate_secrets.py. Leave empty outside a rotation window.
  SECRET_KEY_PREVIOUS: ""
