services:
  postgres:
    image: postgres:15-alpine
    container_name: cryptoscan-postgres
    hostname: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cryptoscan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cryptoscan_secret}
      POSTGRES_DB: ${POSTGRES_DB:-cryptoscan}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cryptoscan} -d ${POSTGRES_DB:-cryptoscan}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      cryptoscan-net:
        aliases: [postgres, cryptoscan-postgres]

  redis:
    image: redis:7-alpine
    container_name: cryptoscan-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [cryptoscan-net]

  neo4j:
    image: neo4j:5.26-community
    container_name: cryptoscan-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-cryptoscan}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      # Named volume only. Do not bind-mount into /import — the image chowns
      # that path at start and a :ro host mount makes it exit 1.
      - neo4j_data:/data
    ports:
      - "${NEO4J_HTTP_PORT:-57474}:7474"
      - "${NEO4J_BOLT_PORT:-57687}:7687"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-cryptoscan} 'RETURN 1'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks: [cryptoscan-net]
    restart: unless-stopped

  neo4j-init:
    image: neo4j:5.26-community
    container_name: cryptoscan-neo4j-init
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-cryptoscan}
    volumes:
      - ./infra/neo4j/init:/init-cypher:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        cypher-shell -a bolt://neo4j:7687 -u "${NEO4J_USER:-neo4j}" -p "${NEO4J_PASSWORD:-cryptoscan}" \
          -f /init-cypher/01_create_constraints.cypher
        exit 0
    networks: [cryptoscan-net]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: .docker/api/Dockerfile
    container_name: cryptoscan-api
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-cryptoscan}:${POSTGRES_PASSWORD:-cryptoscan_secret}@postgres:5432/${POSTGRES_DB:-cryptoscan}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-cryptoscan-secret-key-change-in-production-32}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-cryptoscan}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-dev-webhook-secret-change-me-32chars!!}
      SCAN_JOB_QUEUE_KEY: cryptoscan:jobs:queue
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      DOCS_ENABLED: ${DOCS_ENABLED:-true}
      CRYPTOSCAN_ROOT: /app
      # Scan-target sandbox: sources are cloned/extracted here; the target
      # validation guard allows paths under this root (SSRF/traversal confine).
      WORKSPACE_BASE_PATH: /tmp/cryptoscan-workspaces
      CRYPTOSCAN_SOURCE_ROOTS: /app:/tmp/cryptoscan-workspaces
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-cryptoscan}
      NEO4J_DATABASE: neo4j
      DB_WAIT_SECONDS: ${DB_WAIT_SECONDS:-90}
      # Telecom realtime: the monitor daemon writes snapshot passes to the
      # SAME shared volume this API reads — cross-process freshness without
      # a restart. Drop your estate at ./config/telecom_registry.json to
      # enable TELECOM monitor targets (absent file = honest BLOCKED).
      CRYPTOSCAN_SNAPSHOT_DIR: /var/lib/cryptoscan/telecom
      CRYPTOSCAN_TELECOM_REGISTRY: /var/lib/cryptoscan/telecom/telecom_registry.json
    volumes:
      - telecom_data:/var/lib/cryptoscan/telecom
      - ${TELECOM_REGISTRY_HOST_PATH:-./config/telecom_registry.json}:/var/lib/cryptoscan/telecom/telecom_registry.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    links:
      - postgres
      - redis
      - neo4j
    ports:
      - "${API_PORT:-8010}:8010"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 120s
    # Defense-in-depth: the container process runs as the non-root
    # `cryptoscan` uid already; block privilege escalation and drop every
    # Linux capability the API does not need.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks: [cryptoscan-net]
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: .docker/worker/Dockerfile
    container_name: cryptoscan-worker
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-cryptoscan}:${POSTGRES_PASSWORD:-cryptoscan_secret}@postgres:5432/${POSTGRES_DB:-cryptoscan}
      REDIS_URL: redis://redis:6379/0
      SCAN_JOB_QUEUE_KEY: cryptoscan:jobs:queue
      WORKSPACE_BASE_PATH: /tmp/cryptoscan-workspaces
      CRYPTOSCAN_SOURCE_ROOTS: /app:/tmp/cryptoscan-workspaces
      CRYPTOSCAN_ROOT: /app
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-cryptoscan}
      NEO4J_DATABASE: neo4j
      DB_WAIT_SECONDS: ${DB_WAIT_SECONDS:-90}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    links:
      - postgres
      - redis
      - neo4j
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks: [cryptoscan-net]
    restart: unless-stopped

  monitor:
    build:
      context: .
      dockerfile: .docker/worker/Dockerfile
    container_name: cryptoscan-monitor
    command: ["python", "scripts/run_monitor.py"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-cryptoscan}:${POSTGRES_PASSWORD:-cryptoscan_secret}@postgres:5432/${POSTGRES_DB:-cryptoscan}
      REDIS_URL: redis://redis:6379/0
      WORKSPACE_BASE_PATH: /tmp/cryptoscan-workspaces
      CRYPTOSCAN_ROOT: /app
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-cryptoscan}
      NEO4J_DATABASE: neo4j
      DB_WAIT_SECONDS: ${DB_WAIT_SECONDS:-90}
      MONITOR_TICK_SECONDS: ${MONITOR_TICK_SECONDS:-30}
      MONITOR_LEASE_TTL_SECONDS: ${MONITOR_LEASE_TTL_SECONDS:-60}
      MONITOR_JITTER_FRACTION: ${MONITOR_JITTER_FRACTION:-0.1}
      MONITOR_WATCH_ENABLED: ${MONITOR_WATCH_ENABLED:-true}
      MONITOR_WATCH_PROBE_TIMEOUT_SECONDS: ${MONITOR_WATCH_PROBE_TIMEOUT_SECONDS:-10}
      MONITOR_CONCURRENCY: ${MONITOR_CONCURRENCY:-2}
      MONITOR_RUN_REPORTS: ${MONITOR_RUN_REPORTS:-true}
      # Telecom realtime: same shared snapshot dir + registry as the API —
      # TELECOM targets probe the same estate and the API serves the passes.
      CRYPTOSCAN_SNAPSHOT_DIR: /var/lib/cryptoscan/telecom
      CRYPTOSCAN_TELECOM_REGISTRY: /var/lib/cryptoscan/telecom/telecom_registry.json
      ALERT_CEF_HOST: ${ALERT_CEF_HOST:-}
      ALERT_CEF_PORT: ${ALERT_CEF_PORT:-514}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_WEBHOOK_SECRET: ${ALERT_WEBHOOK_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
    volumes:
      - telecom_data:/var/lib/cryptoscan/telecom
      - ${TELECOM_REGISTRY_HOST_PATH:-./config/telecom_registry.json}:/var/lib/cryptoscan/telecom/telecom_registry.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    links:
      - postgres
      - redis
      - neo4j
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks: [cryptoscan-net]
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: .docker/frontend/Dockerfile
    container_name: cryptoscan-frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3003}:3003"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks: [cryptoscan-net]
    restart: unless-stopped

  nginx:
    build:
      context: ./.docker/nginx
      dockerfile: Dockerfile
    container_name: cryptoscan-nginx
    ports:
      - "${NGINX_PORT:-8088}:80"
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    # nginx binds :80 (needs NET_BIND_SERVICE); keep that single capability
    # and drop everything else, plus block privilege escalation.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    networks: [cryptoscan-net]
    restart: unless-stopped

volumes:
  telecom_data:
  postgres_data:
  redis_data:
  neo4j_data:

networks:
  cryptoscan-net:
    driver: bridge
