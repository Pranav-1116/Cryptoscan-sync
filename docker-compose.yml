services:
  postgres:
    image: postgres:15-alpine
    container_name: cryptoscan-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cryptoscan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cryptoscan_secret}
      POSTGRES_DB: ${POSTGRES_DB:-cryptoscan}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cryptoscan}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [cryptoscan-net]

  redis:
    image: redis:7-alpine
    container_name: cryptoscan-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [cryptoscan-net]

  neo4j:
    image: neo4j:5.26-community
    container_name: cryptoscan-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-cryptoscan}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - neo4j_data:/data
      - ./infra/neo4j/init:/var/lib/neo4j/import/init:ro
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-cryptoscan} 'RETURN 1'"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks: [cryptoscan-net]

  api:
    build:
      context: .
      dockerfile: .docker/api/Dockerfile
    container_name: cryptoscan-api
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-cryptoscan}:${POSTGRES_PASSWORD:-cryptoscan_secret}@postgres:5432/${POSTGRES_DB:-cryptoscan}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-cryptoscan-secret-key-change-in-production-32}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-cryptoscan}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-dev-webhook-secret-change-me-32chars!!}
      SCAN_JOB_QUEUE_KEY: cryptoscan:jobs:queue
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      DOCS_ENABLED: ${DOCS_ENABLED:-true}
      CRYPTOSCAN_ROOT: /app
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-cryptoscan}
      NEO4J_DATABASE: neo4j
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks: [cryptoscan-net]
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: .docker/worker/Dockerfile
    container_name: cryptoscan-worker
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-cryptoscan}:${POSTGRES_PASSWORD:-cryptoscan_secret}@postgres:5432/${POSTGRES_DB:-cryptoscan}
      REDIS_URL: redis://redis:6379/0
      SCAN_JOB_QUEUE_KEY: cryptoscan:jobs:queue
      WORKSPACE_BASE_PATH: /tmp/cryptoscan-workspaces
      CRYPTOSCAN_ROOT: /app
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-cryptoscan}
      NEO4J_DATABASE: neo4j
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks: [cryptoscan-net]
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: .docker/dashboard/Dockerfile
    container_name: cryptoscan-dashboard
    depends_on:
      - api
    networks: [cryptoscan-net]
    restart: unless-stopped

  nginx:
    build:
      context: ./.docker/nginx
      dockerfile: Dockerfile
    container_name: cryptoscan-nginx
    ports:
      - "80:80"
    depends_on:
      - api
      - dashboard
    networks: [cryptoscan-net]
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  neo4j_data:

networks:
  cryptoscan-net:
    driver: bridge
