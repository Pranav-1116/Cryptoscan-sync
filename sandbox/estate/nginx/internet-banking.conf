server {
    listen 443 ssl;
    server_name internet-banking.bank.sandbox;

    ssl_certificate     /certs/internet-banking.crt;
    ssl_certificate_key /certs/internet-banking.key;

    # Strong modern posture: TLS 1.3 + 1.2, ECDHE suites only.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers on;

    location / {
        default_type application/json;
        return 200 '{"service":"internet-banking","vendor":"Meridian Bank","channel":"retail-web"}';
    }
}
