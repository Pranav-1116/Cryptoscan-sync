server {
    listen 443 ssl;
    server_name mobile-api.bank.sandbox;

    ssl_certificate     /certs/mobile-api.crt;
    ssl_certificate_key /certs/mobile-api.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers on;

    location / {
        default_type application/json;
        return 200 '{"service":"mobile-api","channel":"ios-android","version":"7.2.0"}';
    }
}
