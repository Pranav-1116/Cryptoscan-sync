server {
    listen 443 ssl;
    server_name swift-gateway.bank.sandbox;

    ssl_certificate     /certs/swift-gateway.crt;
    ssl_certificate_key /certs/swift-gateway.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;

    location / {
        default_type application/json;
        return 200 '{"service":"swift-gateway","message_family":"ISO20022","region":"MEASA"}';
    }
}
