server {
    listen 443 ssl;
    server_name legacy-branch.bank.sandbox;

    ssl_certificate     /certs/legacy-branch.crt;
    ssl_certificate_key /certs/legacy-branch.key;

    # Deliberately weak: a decommission-pending branch concentrator still
    # offering TLS 1.0/1.1 with a 1024-bit RSA certificate. This is the
    # endpoint that SHOULD light up the CryptoScan findings dashboard.
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    ssl_ciphers 'ALL:@SECLEVEL=0';
    ssl_prefer_server_ciphers on;

    location / {
        default_type application/json;
        return 200 '{"service":"legacy-branch-concentrator","status":"decommission-pending"}';
    }
}
