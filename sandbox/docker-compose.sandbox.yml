# CryptoScan banking sandbox estate.
#
# IMPORTANT: compose resolves relative bind-mount paths against the FIRST
# `-f` file's directory, so when this file is stacked after the root
# docker-compose.yml the paths below must include the `sandbox/` prefix
# (they did once resolve as plain ./estate/… and fail to mount).
#
# Must be run from the repo root, stacked after the main file:
#   docker compose -f docker-compose.yml -f sandbox/docker-compose.sandbox.yml up -d
#
# Two networks:
#   cryptoscan-net — the stack's own network; estate DNS names live here
#     (internet-banking.bank.sandbox, …).
#   sandbox-net — the fake bank's LAN: fixed RFC1918 subnet 10.210.0.0/24
#     with a stable IP per system, so the platform can be pointed at REAL IP
#     targets exactly like a bank sweep (the SSRF guard admits RFC1918).
#     The `api` service is joined to it below — without that, scans by IP
#     cannot reach the estate. Everything here is throwaway; never point it
#     at a production network.

x-cryptava-agent: &cryptava-agent
  image: python:3.12-alpine
  profiles: ["agents"]
  entrypoint: ["/bin/sh", "/opt/cryptava/packaging/container/entrypoint.sh"]
  cap_add: [SYS_PTRACE, DAC_READ_SEARCH]
  restart: unless-stopped

x-cryptava-env: &cryptava-env
  PYTHONPATH: /opt/cryptava
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  CRYPTAVA_SERVER: "http://api:8010"
  CRYPTAVA_ESTATE: "${SANDBOX_ESTATE:-meridian-bank}"
  CRYPTAVA_SCOPE: "sandbox-lan"
  CRYPTAVA_ROOT: "/proc/1/root"
  CRYPTAVA_INTERVAL: "300"
  CRYPTAVA_JITTER: "30"
  CRYPTAVA_TAGS: '{"environment": "production-sandbox", "datacenter": "dc1", "owner": "Meridian Bank"}'
  CRYPTAVA_LOGIN_USER: "${CRYPTOSCAN_USERNAME:-admin}"
  CRYPTAVA_LOGIN_PASSWORD: "${CRYPTOSCAN_PASSWORD:-}"

services:

  # Join the API (where the network scanner runs) onto the fake bank LAN.
  api:
    networks:
      - sandbox-net

  certgen:
    image: alpine/openssl:3.3.2
    container_name: cryptoscan-sbx-certgen
    entrypoint: ["/bin/sh", "/init/gen-certs.sh"]
    volumes:
      - ./sandbox/estate/init/gen-certs.sh:/init/gen-certs.sh:ro
      - sandbox_certs:/certs
    networks: [cryptoscan-net]
    restart: "no"

  internet-banking:
    image: nginx:1.27-alpine
    container_name: cryptoscan-sbx-internet-banking
    depends_on: [certgen]
    volumes:
      - ./sandbox/estate/nginx/internet-banking.conf:/etc/nginx/conf.d/default.conf:ro
      - sandbox_certs:/certs:ro
    networks:
      cryptoscan-net:
        aliases: [internet-banking.bank.sandbox]
      sandbox-net:
        ipv4_address: 10.210.0.2
    restart: unless-stopped

  mobile-api:
    image: nginx:1.27-alpine
    container_name: cryptoscan-sbx-mobile-api
    depends_on: [certgen]
    volumes:
      - ./sandbox/estate/nginx/mobile-api.conf:/etc/nginx/conf.d/default.conf:ro
      - sandbox_certs:/certs:ro
    networks:
      cryptoscan-net:
        aliases: [mobile-api.bank.sandbox]
      sandbox-net:
        ipv4_address: 10.210.0.3
    restart: unless-stopped

  swift-gateway:
    image: nginx:1.27-alpine
    container_name: cryptoscan-sbx-swift-gateway
    depends_on: [certgen]
    volumes:
      - ./sandbox/estate/nginx/swift-gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - sandbox_certs:/certs:ro
    networks:
      cryptoscan-net:
        aliases: [swift-gateway.bank.sandbox]
      sandbox-net:
        ipv4_address: 10.210.0.4
    restart: unless-stopped

  legacy-branch:
    image: nginx:1.27-alpine
    container_name: cryptoscan-sbx-legacy-branch
    depends_on: [certgen]
    volumes:
      - ./sandbox/estate/nginx/legacy-branch.conf:/etc/nginx/conf.d/default.conf:ro
      - sandbox_certs:/certs:ro
    networks:
      cryptoscan-net:
        aliases: [legacy-branch.bank.sandbox]
      sandbox-net:
        ipv4_address: 10.210.0.5
    restart: unless-stopped

  hsm-sim:
    image: python:3.12-alpine
    container_name: cryptoscan-sbx-hsm-sim
    depends_on: [certgen]
    command: ["python", "/app/hsm_sim.py"]
    volumes:
      - ./sandbox/estate/hsm_sim.py:/app/hsm_sim.py:ro
      - sandbox_certs:/certs:ro
    ports:
      - "${SBX_HSM_PORT:-9843}:8443"
    networks:
      cryptoscan-net:
        aliases: [hsm-sim.bank.sandbox]
      sandbox-net:
        ipv4_address: 10.210.0.6
    restart: unless-stopped

  payments-bastion:
    build:
      context: ./sandbox/estate/ssh-bastion
      dockerfile: Dockerfile
    container_name: cryptoscan-sbx-payments-bastion
    networks:
      cryptoscan-net:
        aliases: [payments-bastion.bank.sandbox]
      sandbox-net:
        ipv4_address: 10.210.0.8
    restart: unless-stopped

  core-banking-db:
    image: postgres:15-alpine
    container_name: cryptoscan-sbx-core-db
    depends_on: [certgen]
    entrypoint: ["/bin/sh", "/init/core-db-entry.sh"]
    environment:
      POSTGRES_USER: core
      POSTGRES_PASSWORD: sandbox-only-password
      POSTGRES_DB: ledger
    volumes:
      - ./sandbox/estate/init/core-banking-db.sql:/docker-entrypoint-initdb.d/01-core.sql:ro
      - ./sandbox/estate/init/core-db-entry.sh:/init/core-db-entry.sh:ro
      - sandbox_certs:/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U core -d ledger"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      cryptoscan-net:
        aliases: [core-banking-db.bank.sandbox]
      sandbox-net:
        ipv4_address: 10.210.0.7
    restart: unless-stopped

  bank-redis-seed:
    image: redis:7-alpine
    container_name: cryptoscan-sbx-bank-redis-seed
    depends_on: [redis]
    entrypoint: ["/bin/sh", "/init/seed-redis.sh"]
    volumes:
      - ./sandbox/estate/init/seed-redis.sh:/init/seed-redis.sh:ro
    networks: [cryptoscan-net]
    restart: "no"

  # One-off seeder: installs its own Python deps inside the container, so the
  # host does not need sqlalchemy/psycopg/pydantic installed. Uses a profile
  # so `up -d` never runs it by accident; invoke via run_sandbox.sh or:
  #   docker compose -f docker-compose.yml -f sandbox/docker-compose.sandbox.yml \
  #     run --rm sandbox-seed           # or:  run --rm sandbox-seed python scripts/seed_sandbox_bank.py --reset
  sandbox-seed:
    image: python:3.12-slim
    container_name: cryptoscan-sbx-seed
    profiles: ["seed"]
    working_dir: /work
    entrypoint: ["/bin/sh", "/init/entry-seed.sh"]
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-cryptoscan}:${POSTGRES_PASSWORD:-cryptoscan_secret}@postgres:5432/${POSTGRES_DB:-cryptoscan}"
    volumes:
      - .:/work:ro
      - ./sandbox/estate/init/entry-seed.sh:/init/entry-seed.sh:ro
    networks: [cryptoscan-net]
    restart: "no"

  # The "bank-side agent": walks the estate over REAL channels (docker socket,
  # TLS handshakes, SSH banner, postgres login, HSM banner) and pushes one
  # observation to /api/v1/ingestion/observations. Every BOM workspace
  # re-projects from the newest stored observation, so each run is what makes
  # the BOMs move. Profiled out of `up`; invoke via run_sandbox.sh collect.
  sandbox-collect:
    image: python:3.12-alpine
    container_name: cryptoscan-sbx-collect
    profiles: ["collect"]
    depends_on: [api]
    entrypoint: ["/bin/sh", "/collect/entry-collect.sh"]
    environment:
      CRYPTOSCAN_API: "http://api:8010"
      CRYPTOSCAN_USERNAME: "${CRYPTOSCAN_USERNAME:-}"
      CRYPTOSCAN_PASSWORD: "${CRYPTOSCAN_PASSWORD:-}"
      # set to a number of seconds (e.g. 300) to run as a continuous agent
      COLLECT_INTERVAL_SECONDS: "${COLLECT_INTERVAL_SECONDS:-}"
    volumes:
      - ./sandbox/collect:/collect:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [cryptoscan-net, sandbox-net]
    restart: unless-stopped

  # Cryptava — the real host agent (services/cryptava), one per simulated bank server (7).
  # Each sidecar shares its host's processes and network and reads the host's files
  # through /proc/1/root, exactly as on a real server; it enrols itself under a unique
  # name and pushes a SIGNED observation every 5 minutes. Profiled out of `up`:
  #   ./sandbox/run_sandbox.sh agents        (or: ... --profile agents up -d)
  # Container names deliberately do NOT start with cryptoscan-sbx- so the sandbox
  # collector never mistakes an agent for a bank host.
  # Each agent also gets its host's CMDB record (sandbox/cryptava/<host>.json) at
  # /etc/cryptava/asset-record.json: the hardware identity a container cannot read from
  # firmware (HBOM) and the vendor contracts that are never on a host (VBOM).
  # All seven bank servers have one. `run_sandbox.sh up` starts them once the API is
  # healthy; a server you (re)connect from the console (Add a server -> "Sandbox bank
  # server" -> `agents add`) replaces its built-in agent.
  cryptava-swift-gateway:
    <<: *cryptava-agent
    container_name: cryptoscan-cryptava-swift-gateway
    depends_on: [api, swift-gateway]
    network_mode: "service:swift-gateway"
    pid: "service:swift-gateway"
    environment:
      <<: *cryptava-env
      CRYPTAVA_NAME: "mrdn-sbx-dc1-swiftgw01"
      CRYPTAVA_HOSTNAME: "swift-gateway"
      CRYPTAVA_FQDN: "swift-gateway.bank.sandbox"
      CRYPTAVA_PRIMARY_IP: "10.210.0.4"
      CRYPTAVA_SYSTEM: '{"name": "SWIFT Gateway", "owner": "Payments Operations"}'
    volumes:
      - ./services/cryptava:/opt/cryptava:ro
      - cryptava_swift_gateway:/var/lib/cryptava
      - ./sandbox/cryptava/swift-gateway.json:/etc/cryptava/asset-record.json:ro

  cryptava-internet-banking:
    <<: *cryptava-agent
    container_name: cryptoscan-cryptava-internet-banking
    depends_on: [api, internet-banking]
    network_mode: "service:internet-banking"
    pid: "service:internet-banking"
    environment:
      <<: *cryptava-env
      CRYPTAVA_NAME: "mrdn-sbx-dc1-ibank01"
      CRYPTAVA_HOSTNAME: "internet-banking"
      CRYPTAVA_FQDN: "internet-banking.bank.sandbox"
      CRYPTAVA_PRIMARY_IP: "10.210.0.2"
      CRYPTAVA_SYSTEM: '{"name": "Internet Banking", "owner": "Digital Channels"}'
    volumes:
      - ./services/cryptava:/opt/cryptava:ro
      - cryptava_internet_banking:/var/lib/cryptava
      - ./sandbox/cryptava/internet-banking.json:/etc/cryptava/asset-record.json:ro

  cryptava-core-banking-db:
    <<: *cryptava-agent
    container_name: cryptoscan-cryptava-core-banking-db
    depends_on: [api, core-banking-db]
    network_mode: "service:core-banking-db"
    pid: "service:core-banking-db"
    environment:
      <<: *cryptava-env
      CRYPTAVA_NAME: "mrdn-sbx-dc1-coredb01"
      CRYPTAVA_HOSTNAME: "core-db"
      CRYPTAVA_FQDN: "core-db.bank.sandbox"
      CRYPTAVA_PRIMARY_IP: "10.210.0.7"
      CRYPTAVA_SYSTEM: '{"name": "Core Banking", "owner": "Core Banking Platform"}'
    volumes:
      - ./services/cryptava:/opt/cryptava:ro
      - cryptava_core_banking_db:/var/lib/cryptava
      - ./sandbox/cryptava/core-banking-db.json:/etc/cryptava/asset-record.json:ro

  cryptava-payments-bastion:
    <<: *cryptava-agent
    container_name: cryptoscan-cryptava-payments-bastion
    depends_on: [api, payments-bastion]
    network_mode: "service:payments-bastion"
    pid: "service:payments-bastion"
    environment:
      <<: *cryptava-env
      CRYPTAVA_NAME: "mrdn-sbx-dc1-paybastion01"
      CRYPTAVA_HOSTNAME: "payments-bastion"
      CRYPTAVA_FQDN: "payments-bastion.bank.sandbox"
      CRYPTAVA_PRIMARY_IP: "10.210.0.8"
      CRYPTAVA_SYSTEM: '{"name": "SWIFT Gateway", "owner": "Payments Operations"}'
    volumes:
      - ./services/cryptava:/opt/cryptava:ro
      - cryptava_payments_bastion:/var/lib/cryptava
      - ./sandbox/cryptava/payments-bastion.json:/etc/cryptava/asset-record.json:ro

  cryptava-mobile-api:
    <<: *cryptava-agent
    container_name: cryptoscan-cryptava-mobile-api
    depends_on: [api, mobile-api]
    network_mode: "service:mobile-api"
    pid: "service:mobile-api"
    environment:
      <<: *cryptava-env
      CRYPTAVA_NAME: "mrdn-sbx-dc1-mobileapi01"
      CRYPTAVA_HOSTNAME: "mobile-api"
      CRYPTAVA_FQDN: "mobile-api.bank.sandbox"
      CRYPTAVA_PRIMARY_IP: "10.210.0.3"
      CRYPTAVA_SYSTEM: '{"name": "Mobile Banking API", "owner": "Digital Channels"}'
    volumes:
      - ./services/cryptava:/opt/cryptava:ro
      - cryptava_mobile_api:/var/lib/cryptava
      - ./sandbox/cryptava/mobile-api.json:/etc/cryptava/asset-record.json:ro

  cryptava-legacy-branch:
    <<: *cryptava-agent
    container_name: cryptoscan-cryptava-legacy-branch
    depends_on: [api, legacy-branch]
    network_mode: "service:legacy-branch"
    pid: "service:legacy-branch"
    environment:
      <<: *cryptava-env
      CRYPTAVA_NAME: "mrdn-sbx-br0142-legacy01"
      CRYPTAVA_HOSTNAME: "legacy-branch"
      CRYPTAVA_FQDN: "legacy-branch.bank.sandbox"
      CRYPTAVA_PRIMARY_IP: "10.210.0.5"
      CRYPTAVA_SYSTEM: '{"name": "Branch Banking", "owner": "Branch Technology"}'
      CRYPTAVA_TAGS: '{"environment": "production-sandbox", "datacenter": "branch-0142", "owner": "Meridian Bank"}'
    volumes:
      - ./services/cryptava:/opt/cryptava:ro
      - cryptava_legacy_branch:/var/lib/cryptava
      - ./sandbox/cryptava/legacy-branch.json:/etc/cryptava/asset-record.json:ro

  cryptava-hsm-sim:
    <<: *cryptava-agent
    container_name: cryptoscan-cryptava-hsm-sim
    depends_on: [api, hsm-sim]
    network_mode: "service:hsm-sim"
    pid: "service:hsm-sim"
    environment:
      <<: *cryptava-env
      CRYPTAVA_NAME: "mrdn-sbx-dc1-hsmsim01"
      CRYPTAVA_HOSTNAME: "hsm-sim"
      CRYPTAVA_FQDN: "hsm-sim.bank.sandbox"
      CRYPTAVA_PRIMARY_IP: "10.210.0.6"
      CRYPTAVA_SYSTEM: '{"name": "Payment HSM", "owner": "Payments Security"}'
    volumes:
      - ./services/cryptava:/opt/cryptava:ro
      - cryptava_hsm_sim:/var/lib/cryptava
      - ./sandbox/cryptava/hsm-sim.json:/etc/cryptava/asset-record.json:ro

volumes:
  sandbox_certs:
  cryptava_swift_gateway:
  cryptava_internet_banking:
  cryptava_core_banking_db:
  cryptava_payments_bastion:
  cryptava_mobile_api:
  cryptava_legacy_branch:
  cryptava_hsm_sim:

networks:
  # The fake bank's LAN. Fixed subnet so every system keeps a stable IP you
  # can paste into CryptoScan as a scan target; 10.210.0.0/24 is RFC1918 and
  # passes the platform's SSRF guard (loopback/link-local are refused, internal
  # ranges are what this scanner exists for).
  sandbox-net:
    name: cryptoscan-sandbox-net
    driver: bridge
    ipam:
      config:
        - subnet: 10.210.0.0/24
          # Dynamic members (the API joins this LAN too) only ever get
          # .128-.255 — the estate's static .2-.8 can never be stolen out
          # from under it ("Address already in use" on up).
          ip_range: 10.210.0.128/25
