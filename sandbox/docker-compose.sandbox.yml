# CryptoScan banking sandbox estate.
#
# Stack this on top of the main compose file:
#   docker compose -f docker-compose.yml -f sandbox/docker-compose.sandbox.yml up -d
#
# It joins `cryptoscan-net`, so the CryptoScan scanners can reach every fake
# bank system by DNS name (internet-banking.bank.sandbox, …), while the estate
# itself is nothing but throwaway containers.

services:

  certgen:
    image: alpine/openssl:3.3.2
    container_name: cryptoscan-sbx-certgen
    entrypoint: ["/bin/sh", "/init/gen-certs.sh"]
    volumes:
      - ./estate/init/gen-certs.sh:/init/gen-certs.sh:ro
      - sandbox_certs:/certs
    networks: [cryptoscan-net]

  internet-banking:
    image: nginx:1.27-alpine
    container_name: cryptoscan-sbx-internet-banking
    depends_on: [certgen]
    volumes:
      - ./estate/nginx/internet-banking.conf:/etc/nginx/conf.d/default.conf:ro
      - sandbox_certs:/certs:ro
    networks:
      cryptoscan-net:
        aliases: [internet-banking.bank.sandbox]

  mobile-api:
    image: nginx:1.27-alpine
    container_name: cryptoscan-sbx-mobile-api
    depends_on: [certgen]
    volumes:
      - ./estate/nginx/mobile-api.conf:/etc/nginx/conf.d/default.conf:ro
      - sandbox_certs:/certs:ro
    networks:
      cryptoscan-net:
        aliases: [mobile-api.bank.sandbox]

  swift-gateway:
    image: nginx:1.27-alpine
    container_name: cryptoscan-sbx-swift-gateway
    depends_on: [certgen]
    volumes:
      - ./estate/nginx/swift-gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - sandbox_certs:/certs:ro
    networks:
      cryptoscan-net:
        aliases: [swift-gateway.bank.sandbox]

  legacy-branch:
    image: nginx:1.27-alpine
    container_name: cryptoscan-sbx-legacy-branch
    depends_on: [certgen]
    volumes:
      - ./estate/nginx/legacy-branch.conf:/etc/nginx/conf.d/default.conf:ro
      - sandbox_certs:/certs:ro
    networks:
      cryptoscan-net:
        aliases: [legacy-branch.bank.sandbox]

  hsm-sim:
    image: python:3.12-alpine
    container_name: cryptoscan-sbx-hsm-sim
    depends_on: [certgen]
    command: ["python", "/app/hsm_sim.py"]
    volumes:
      - ./estate/hsm_sim.py:/app/hsm_sim.py:ro
      - sandbox_certs:/certs:ro
    ports:
      - "${SBX_HSM_PORT:-9843}:8443"
    networks:
      cryptoscan-net:
        aliases: [hsm-sim.bank.sandbox]

  core-banking-db:
    image: postgres:15-alpine
    container_name: cryptoscan-sbx-core-db
    environment:
      POSTGRES_USER: core
      POSTGRES_PASSWORD: sandbox-only-password
      POSTGRES_DB: ledger
    volumes:
      - ./estate/init/core-banking-db.sql:/docker-entrypoint-initdb.d/01-core.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U core -d ledger"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      cryptoscan-net:
        aliases: [core-banking-db.bank.sandbox]

  bank-redis-seed:
    image: redis:7-alpine
    container_name: cryptoscan-sbx-bank-redis-seed
    depends_on: [redis]
    entrypoint: ["/bin/sh", "/init/seed-redis.sh"]
    volumes:
      - ./estate/init/seed-redis.sh:/init/seed-redis.sh:ro
    networks: [cryptoscan-net]

volumes:
  sandbox_certs:
