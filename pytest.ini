[pytest]
# A generous per-test wall-clock timeout so a stray blocking test (e.g. a live
# network/socket call that isn't mocked) fails fast instead of hanging the whole
# suite. 120s is far above any legitimate unit/integration test here (the api
# app + SQLite per-test setup is the slowest, ~10-20s).
timeout = 120
timeout_method = thread
# importlib mode: test modules are addressed by their full path, so identical
# basenames in different test dirs (e.g. api tests unit/ vs integration/
# test_report_schedules.py) no longer collide in sys.modules.
addopts = --import-mode=importlib -p no:cacheprovider -m "not live"
# Only test_*.py. The default pattern also matches *_test.py, which collects
# scripts/load_test.py -- a CLI capacity probe with no test functions, whose
# `from _bootstrap import bootstrap` then fails because scripts/ is not on
# sys.path. No test module in services/ or shared/ uses the *_test.py spelling,
# so narrowing the pattern deselects nothing real. (CI names its test
# directories explicitly and never saw this; a bare `pytest` from the repo root
# did.)
python_files = test_*.py
markers =
    live: needs real network access (excluded from the hermetic gate)
    enable_socket: pytest-socket opt-in for a specific test
    integration: exercises several components together (worker pipeline end-to-end)
