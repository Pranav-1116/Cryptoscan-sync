[pytest]
# A generous per-test wall-clock timeout so a stray blocking test (e.g. a live
# network/socket call that isn't mocked) fails fast instead of hanging the whole
# suite. 120s is far above any legitimate unit/integration test here (the api
# app + SQLite per-test setup is the slowest, ~10-20s).
timeout = 120
timeout_method = thread
# importlib mode: test modules are addressed by their full path, so identical
# basenames in different test dirs (e.g. api tests unit/ vs integration/
# test_report_schedules.py) no longer collide in sys.modules.
addopts = --import-mode=importlib
