[project]
name = "shared-config"
version = "0.1.0"
description = "Shared configuration utilities for CryptoScan"
requires-python = ">=3.11"
dependencies = ["pydantic-settings>=2.1.0", "python-dotenv>=1.0.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shared_config*"]
