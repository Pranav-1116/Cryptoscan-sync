[tool.poetry]
name = "shared-config"
version = "0.1.0"
description = "Shared configuration utilities for CryptoScan Platform"
authors = ["CryptoScan Team"]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"

[tool.poetry.dev-dependencies]
pytest = "^7.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"