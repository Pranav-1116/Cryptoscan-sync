# Local engineering gateway only. No TLS or mTLS; never use for bank deployment.
worker_processes 1;
error_log @RUN@/nginx-error.log warn;
pid @RUN@/nginx.pid;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log @RUN@/nginx-access.log;
    server_tokens off;
    client_max_body_size 64m;
    client_body_temp_path @RUN@/nginx-body;
    proxy_temp_path @RUN@/nginx-proxy;
    fastcgi_temp_path @RUN@/nginx-fastcgi;
    uwsgi_temp_path @RUN@/nginx-uwsgi;
    scgi_temp_path @RUN@/nginx-scgi;
    limit_req_zone $binary_remote_addr zone=local_auth:1m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=local_api:2m rate=60r/s;
    limit_req_status 429;
    upstream cryptoscan_api { server 127.0.0.1:@API_PORT@; }
    upstream cryptoscan_ui { server 127.0.0.1:@UI_PORT@; }
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    server {
        listen 127.0.0.1:55920;
        server_name localhost 127.0.0.1;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer always;
        location ~ ^/api/v1/auth/(login|register)$ {
            limit_req zone=local_auth burst=10 nodelay;
            proxy_pass http://cryptoscan_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_header Set-Cookie;
        }
        location /api/ {
            limit_req zone=local_api burst=120 nodelay;
            proxy_pass http://cryptoscan_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_header Set-Cookie;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }
        location /ws {
            proxy_pass http://cryptoscan_api/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
        }
        location /events {
            proxy_pass http://cryptoscan_api/events;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_buffering off;
        }
        location = /health { proxy_pass http://cryptoscan_api/health; access_log off; }
        location = /ready { proxy_pass http://cryptoscan_api/ready; access_log off; }
        location / {
            proxy_pass http://cryptoscan_ui;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
