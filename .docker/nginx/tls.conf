# TLS edge configuration — mounted over the image's nginx.conf by
# docker-compose.tls.yml. Same proxy behavior as the plain-HTTP edge
# (.docker/nginx/nginx.conf): rate limiting, SSE-safe buffering, gzip —
# plus TLS 1.2/1.3 only, HSTS, and a :80 -> :443 redirect.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 2048; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 64m;
    server_tokens off;

    limit_req_zone  $binary_remote_addr zone=cs_api:10m rate=60r/s;
    limit_req_zone  $binary_remote_addr zone=cs_auth:10m rate=5r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=cs_conn:10m;
    limit_conn_status 429;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain application/xml image/svg+xml;
    gzip_min_length 1024;

    proxy_buffer_size 16k;
    proxy_buffers 32 16k;
    proxy_busy_buffers_size 64k;

    upstream cryptoscan_api {
        server api:8010;
    }

    upstream cryptoscan_frontend {
        server frontend:3003;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # ── :80 — redirect only ─────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        location /.well-known/acme-challenge/ {
            # HTTP-01 renewal challenges (mount a webroot if you renew here).
            root /var/www/certbot;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── :443 — the real edge ────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache   shared:cs_ssl:10m;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        # SAMEORIGIN so the console can be embedded in the preview iframe.
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer always;

        location ~ ^/api/v1/auth/(login|register)$ {
            limit_req zone=cs_auth burst=10 nodelay;
            limit_conn cs_conn 20;
            proxy_pass http://cryptoscan_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection "";
            proxy_pass_header Set-Cookie;
            proxy_buffering off;
        }

        location /api/ {
            limit_req zone=cs_api burst=120 nodelay;
            limit_conn cs_conn 100;
            proxy_pass http://cryptoscan_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection "";
            proxy_set_header Authorization $http_authorization;
            proxy_pass_header Set-Cookie;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
        }

        location = /health {
            proxy_pass http://cryptoscan_api/health;
            access_log off;
        }
        location = /ready {
            proxy_pass http://cryptoscan_api/ready;
            access_log off;
        }

        location / {
            proxy_pass http://cryptoscan_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 3600s;
        }
    }
}
