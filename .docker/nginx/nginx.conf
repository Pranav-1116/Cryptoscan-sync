worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 2048; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 64m;
    server_tokens off;

    # Edge rate limiting
    limit_req_zone  $binary_remote_addr zone=cs_api:10m rate=60r/s;
    limit_req_zone  $binary_remote_addr zone=cs_auth:10m rate=5r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=cs_conn:10m;
    limit_conn_status 429;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain application/xml image/svg+xml;
    gzip_min_length 1024;

    proxy_buffer_size 16k;
    proxy_buffers 32 16k;
    proxy_busy_buffers_size 64k;

    upstream cryptoscan_api {
        server api:8010;
    }

    upstream cryptoscan_frontend {
        server frontend:3003;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        server_name _;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer always;

        # Tight throttle on credential endpoints
        location ~ ^/api/v1/auth/(login|register)$ {
            limit_req zone=cs_auth burst=10 nodelay;
            limit_conn cs_conn 20;
            proxy_pass http://cryptoscan_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_pass_header Set-Cookie;
            proxy_buffering off;
        }

        # ── API + realtime SSE ──
        location /api/ {
            limit_req zone=cs_api burst=120 nodelay;
            limit_conn cs_conn 100;
            proxy_pass http://cryptoscan_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_set_header Authorization $http_authorization;
            proxy_pass_header Set-Cookie;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
        }

        # WebSocket proxy
        location /ws {
            proxy_pass http://cryptoscan_api/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        # SSE /events proxy
        location /events {
            proxy_pass http://cryptoscan_api/events;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_read_timeout 3600s;
        }

        location = /healthz {
            proxy_pass http://cryptoscan_api/healthz;
            access_log off;
        }
        location = /health {
            proxy_pass http://cryptoscan_api/health;
            access_log off;
        }
        location = /ready {
            proxy_pass http://cryptoscan_api/ready;
            access_log off;
        }

        # ── frontend ──
        location / {
            proxy_pass http://cryptoscan_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
        }
    }
}
