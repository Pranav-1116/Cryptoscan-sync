server {
    listen 3003;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json text/css text/plain image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;  # the console is previewed in an iframe
    add_header Referrer-Policy no-referrer always;

    # ── API + realtime SSE proxy → backend :8010 ─────────────────────
    location /api/ {
        proxy_pass http://api:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Set-Cookie;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # SSE must stream — disable buffering for the whole /api path so
        # the realtime event stream (GET /api/v1/events/stream) is live.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
    }

    # Backend health, surfaced at the edge.
    location = /health {
        proxy_pass http://api:8010/health;
        proxy_set_header Host $host;
        access_log off;
    }
    location = /ready {
        proxy_pass http://api:8010/ready;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── static assets (hashed Vite bundle) — cache hard ───────────────
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # ── SPA shell must never be cached ────────────────────────────────
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
    }

    location / {
        try_files $uri /index.html;
    }
}
