server {
    listen 3003;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json text/css text/plain image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;  # the console is previewed in an iframe
    add_header Referrer-Policy no-referrer always;
    # The bundle has no inline script and talks only to the same-origin edge.
    # Keep inline styles for the existing component CSS, but do not permit
    # arbitrary script, form, frame or external font/stylesheet origins.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'" always;

    # Resolve the backend per request through Docker's embedded DNS:
    # a static proxy_pass caches the api container's IP at nginx startup, and
    # any api recreate (sandbox up/down, redeploy) leaves nginx proxying to a
    # dead address until restarted. With a variable upstream + resolver, a
    # recreated backend is picked up within seconds.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # ── API + realtime SSE proxy → backend :8010 ─────────────────────
    location /api/ {
        set $api_upstream http://api:8010;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Set-Cookie;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # SSE must stream — disable buffering for the whole /api path so
        # the realtime event stream (GET /api/v1/events/stream) is live.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
    }

    # WebSocket proxy → backend :8010
    location /ws {
        set $api_ws_upstream http://api:8010/ws;
        proxy_pass $api_ws_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # SSE /events proxy → backend :8010
    location /events {
        set $api_events_upstream http://api:8010/events;
        proxy_pass $api_events_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
    }

    # Backend health checks, surfaced at the edge.
    location = /healthz {
        set $api_h_healthz http://api:8010/healthz;
        proxy_pass $api_h_healthz;
        proxy_set_header Host $host;
        access_log off;
    }
    location = /health {
        set $api_h_health http://api:8010/health;
        proxy_pass $api_h_health;
        proxy_set_header Host $host;
        access_log off;
    }
    location = /ready {
        set $api_h_ready http://api:8010/ready;
        proxy_pass $api_h_ready;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── static assets (hashed Vite bundle) — cache hard ───────────────
    # nginx replaces inherited add_header directives the moment a location
    # defines its own, so each header-bearing location repeats the full set.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer always;
        try_files $uri =404;
    }

    # ── SPA shell must never be cached ────────────────────────────────
    # The shell is the document where CSP governs everything loaded after
    # it — dropping it here (nginx add_header inheritance) would leave the
    # one response that needs CSP most without it. Full header set, always.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'" always;
    }

    location / {
        try_files $uri /index.html;
    }
}
