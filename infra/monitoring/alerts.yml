# Real Product Alerts — Deterministic
groups:
- name: cryptoscan
  rules:
  - alert: HighErrorRate
    expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: "High error rate on {{ $labels.job }}"

  - alert: HighP99Latency
    expr: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m])) > 0.5
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "High p99 latency {{ $value }}s on {{ $labels.job }} — target <500ms"

  - alert: RealtimeConnectionsHigh
    expr: realtime_active_connections > 10000
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: "High realtime connections {{ $value }}"

  - alert: CDTSimulationsFailing
    expr: rate(cdt_simulations_failed_total[5m]) > 0.1
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: "CDT simulations failing"

  - alert: EvidenceChainBroken
    expr: evidence_chain_verification_failed > 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "Evidence chain hash verification failed — tamper detected"

  - alert: QRNGEntropyLow
    expr: qrng_entropy_avail < 128
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "QRNG entropy low {{ $value }} < 128"

  - alert: QRNGEntropyCritical
    expr: qrng_entropy_avail < 64
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "QRNG entropy critical {{ $value }} < 64 — CRITICAL"
