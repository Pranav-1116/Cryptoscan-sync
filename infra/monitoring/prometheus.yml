# Prometheus — Real Product Monitoring
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'cryptoscan-api'
    static_configs:
      - targets: ['api:8010']
    metrics_path: /metrics
    scrape_interval: 5s

  - job_name: 'cryptoscan-worker'
    static_configs:
      - targets: ['worker:8011']
    metrics_path: /metrics

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:9121']

  - job_name: 'neo4j'
    static_configs:
      - targets: ['neo4j:2004']

  - job_name: 'realtime-system'
    static_configs:
      - targets: ['api:8010']
    metrics_path: /api/v1/realtime-system/metrics
    scrape_interval: 1s

  - job_name: 'cdt-real'
    static_configs:
      - targets: ['api:8010']
    metrics_path: /api/v1/cryptographic-digital-twin-real/realtime/status

rule_files:
  - "alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093
