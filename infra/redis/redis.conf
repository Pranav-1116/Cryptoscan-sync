# CryptoScan Redis Configuration

# Network
bind 0.0.0.0
port 6379
protected-mode no

# Memory
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence (for job queue durability)
save 900 1
save 300 10
save 60 10000
appendonly yes
appendfsync everysec

# Security
# requirepass your_redis_password_here

# Performance
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Logging
loglevel notice