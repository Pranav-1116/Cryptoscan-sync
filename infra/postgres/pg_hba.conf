# PostgreSQL client authentication — CryptoScan
#
# Hardened replacement for the image default. The compose files do not mount
# this automatically; to enforce it, add to the postgres service:
#
#   volumes:
#     - ./infra/postgres/pg_hba.conf:/var/lib/postgresql/data/pg_hba.conf:ro
#     - ./infra/postgres/postgres.conf:/etc/postgres/postgres.conf:ro
#
# Roles/DBs (docker-compose.yml):
#   POSTGRES_USER=cryptoscan  POSTGRES_DB=cryptoscan   (prod overrides via env)
#   init/01_create_databases.sql also provisions a test database.
#
# Rules are evaluated top-to-bottom; the FIRST match wins, so order matters.
# Reference: https://www.postgresql.org/docs/15/auth-pg-hba-conf.html

# TYPE      DATABASE            USER            ADDRESS         METHOD

# Container-local health checks (pg_isready) and `docker exec … psql` use the
# unix domain socket.
local       all                 postgres                        peer

# Application services connect over the compose network `cryptoscan-net`.
# Docker allocates bridge subnets from 172.16.0.0/12 by default — pin the
# exact subnet (e.g. 172.28.0.0/16) via a `networks: ipam` block in
# docker-compose.prod.yml before exposing Postgres beyond localhost.
host        cryptoscan          cryptoscan      172.16.0.0/12   scram-sha-256
host        cryptoscan_test     cryptoscan      172.16.0.0/12   scram-sha-256
host        cryptoscan          all             172.16.0.0/12   scram-sha-256

# Replication for a future streaming-standby deployment.
host        replication         replicator      172.16.0.0/12   scram-sha-256

# Fail closed: reject everything that matched no rule above (including
# host-port access from the host network via the published 55432 port).
host        all                 all             0.0.0.0/0       reject
host        all                 all             ::/0            reject
